<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>枕冬 · 自媒体工作台</title>
<meta name="theme-color" content="#17181B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="枕冬">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#F3EFE6;--card:#FBF8F1;--card2:#FFFCF5;--ink:#17181B;--ink2:#1F2023;
  --text:#1F1D19;--muted:#7A7468;--faint:#A39B8C;--line:#D9D1BF;--line2:#E7E1D3;
  --accent:#B04A2B;--accent-soft:#EEDFD5;--sage:#6E7A55;--sage-soft:#E4E7DA;
  --amber:#B07A3C;--plum:#8A6EA8;--slate:#8C8578;
  --r:3px;--sidebar:224px;--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
button:focus,button:active,a:focus{outline:none}
button:focus-visible,a:focus-visible,[data-act]:focus-visible{outline:2px solid rgba(176,74,43,.6);outline-offset:2px}
@media (hover:none){button:focus-visible,a:focus-visible,[data-act]:focus-visible,button:focus,button:active{outline:none}}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--ff);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
::selection{background:var(--accent);color:#fff}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 侧栏 ---------- */
.rail{position:sticky;top:0;height:100vh;background:var(--ink);color:#EDE8DC;display:flex;flex-direction:column;padding:22px 16px 16px;gap:20px;z-index:20}
.brand{padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{display:block;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.06em;line-height:1.15}
.brand span{display:block;margin-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:#8C877B}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:var(--r);color:#B9B3A5;font-size:12.5px;text-align:left;transition:background .16s,color .16s;border-left:2px solid transparent}
.nav button svg{width:16px;height:16px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.05);color:#EDE8DC}
.nav button.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--accent)}
.nav button.on svg{opacity:1}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:#7E7A70;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:20px}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-family:var(--mono);font-size:9.5px;line-height:1.9;color:#807B70;letter-spacing:.04em}
.rail-foot b{color:#C9C3B4;font-weight:500}
/* ---------- 星球黑洞入口 ---------- */
.bh-entry{display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--r);color:#B9B3A5;font-size:12.5px;text-align:left;border:1px solid rgba(255,255,255,.07);background:linear-gradient(120deg,rgba(224,138,76,.12),rgba(90,120,255,.1));transition:background .16s,color .16s,border-color .16s}
.bh-entry:hover{color:#fff;border-color:rgba(224,138,76,.45);background:linear-gradient(120deg,rgba(224,138,76,.2),rgba(90,120,255,.16))}
.bh-orb{width:15px;height:15px;border-radius:50%;flex:none;background:radial-gradient(circle,#05060A 0 34%,#E08A4C 50%,#9FC4FF 72%,rgba(159,196,255,0) 78%);box-shadow:0 0 10px rgba(224,138,76,.45)}
.bh-entry .bh-tag{margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:#E0A87C;border:1px solid rgba(224,138,76,.35);padding:1px 5px;border-radius:2px}
/* ---------- 黑洞全屏层 ---------- */
.bh-overlay{position:fixed;inset:0;z-index:80;background:#05060A;display:flex;flex-direction:column}
.bh-overlay[hidden]{display:none}
.bh-chrome{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0A0C12;border-bottom:1px solid rgba(255,255,255,.08);color:#E8E4DA;flex:none}
.bh-chrome b{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.06em}
.bh-chrome span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#7A828E}
.bh-chrome .bh-close{margin-left:auto;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#E8E4DA;padding:5px 10px;border-radius:3px;font-size:11px}
.bh-chrome .bh-close:hover{background:rgba(255,255,255,.12)}
#bhFrame{flex:1;width:100%;border:0;background:#05060A}
body.bh-open{overflow:hidden}
.dot-live{display:inline-block;width:5px;height:5px;border-radius:50%;background:#7E9A63;margin-right:5px;vertical-align:1px}

/* ---------- 主区 ---------- */
main{min-width:0;padding:0 30px 56px;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:linear-gradient(var(--paper) 72%,rgba(243,239,230,.86) 88%,rgba(243,239,230,0));padding:22px 0 16px;display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb-l{min-width:0}
.tb-l h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.02em;line-height:1.1;margin-top:4px}
.tb-l p{color:var(--muted);font-size:11.5px;margin-top:6px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;line-height:1.6;text-align:right}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:20px;background:var(--card)}
.sync i{width:5px;height:5px;border-radius:50%;background:var(--sage);display:block}
.sync.warn i{background:var(--amber)}.sync.err i{background:var(--accent)}
.sync.local i{background:var(--faint)}.sync.demo i{background:var(--plum)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 11px;border-radius:var(--r);font-size:11.5px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:#BDB4A0;background:var(--card2)}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#F3EFE6}
.btn.primary:hover{background:#2A2B2E}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:#DCC3B8}
.btn.danger:hover{background:#F6E9E2}
.btn.sm{padding:4px 8px;font-size:10.5px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- 通用卡片 ---------- */
.view{display:none;padding-top:20px}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.card-h .eyebrow{margin-left:auto}
.card-b{padding:14px 15px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.stat .eyebrow{display:block;margin-bottom:9px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px;letter-spacing:0}
.stat .sub{font-size:10.5px;color:var(--muted);margin-top:6px}
.stat::after{content:"";position:absolute;right:0;top:0;width:3px;height:100%;background:var(--line2)}
.stat.accent::after{background:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted);background:#F6F2E9;white-space:nowrap}
.badge .bd{width:5px;height:5px;border-radius:50%;background:var(--slate)}
.badge.stage-文案 .bd{background:var(--slate)}.badge.stage-剪辑 .bd{background:var(--amber)}
.badge.stage-审核 .bd{background:var(--plum)}.badge.stage-发布 .bd{background:var(--accent)}
.badge.stage-已发布 .bd{background:var(--sage)}
.badge.k-发布{border-color:#DCC3B8;color:#7E3A24}.badge.k-拍摄{border-color:#E0CDB5;color:#7A5326}
.badge.k-剪辑{border-color:#DBCFBE;color:#6E624F}.badge.k-审核{border-color:#D6CCE2;color:#5C4A74}
.badge.k-商单{border-color:#D9C9BC;color:#7A3F2C}.badge.k-复盘{border-color:#C9D0BE;color:#4F5B3D}
.badge.s-完成,.badge.s-已回款,.badge.s-已交付{border-color:#CAD2BB;color:#4F5B3D;background:#EFF1E7}
.badge.s-制作中,.badge.s-待发布,.badge.s-已签约,.badge.s-进行中{border-color:#E0D3BD;color:#7A5326;background:#F7F0E4}
.priority{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint)}
.priority.p1{color:var(--accent)}
.hair{height:1px;background:var(--line2);border:0;margin:0}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:11.5px}
.bar{height:3px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* ---------- 今日 ---------- */
.today-hero{display:flex;align-items:center;gap:18px;padding:2px 0 18px}
.today-hero .line{font-family:var(--serif);font-size:19px;letter-spacing:.01em}
.today-hero .line em{font-style:normal;color:var(--accent)}
.today-hero .rule{flex:1;height:1px;background:var(--line)}
.today-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.today-grid{display:grid;grid-template-columns:1.05fr 1.35fr .95fr;gap:14px;align-items:start}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line2)}
.todo li:last-child{border-bottom:0}
.todo .ck{width:15px;height:15px;border:1px solid #C3B9A5;border-radius:2px;flex:none;margin-top:1px;display:grid;place-items:center;background:var(--card2)}
.todo .ck svg{width:9px;height:9px;opacity:0;fill:var(--sage)}
.todo li.done .ck{border-color:var(--sage);background:var(--sage-soft)}
.todo li.done .ck svg{opacity:1}
.todo li.done .tt{text-decoration:line-through;color:var(--faint)}
.todo .tt{font-size:12px;line-height:1.45}
.todo .meta{margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.todo .time{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.todo .over{color:var(--accent)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.feed li:last-child{border-bottom:0}
.feed .idx{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:18px;flex:none}
.feed .ft{min-width:0;flex:1}
.feed .ft b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .ft span{font-size:10px;color:var(--muted)}
.feed .badge{flex:none}
.mini-deal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.mini-deal:last-child{border-bottom:0}
.mini-deal .md-b{width:28px;height:28px;border-radius:50%;background:#EFE8DA;display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:#5C5446;flex:none}
.mini-deal .md-t{flex:1;min-width:0}
.mini-deal .md-t b{display:block;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-deal .md-t span{font-size:9.5px;color:var(--muted)}
.mini-deal .md-a{font-family:var(--mono);font-size:10.5px;text-align:right;color:var(--text)}

/* ---------- 内容 ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 9px;border-radius:20px;font-size:10.5px;color:var(--muted);transition:.14s}
.chip:hover{border-color:#BDB4A0}
.chip.on{background:var(--ink);border-color:var(--ink);color:#EFEADF}
.toolbar .sp{flex:1}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:220px;display:flex;flex-direction:column;transition:background .15s,border-color .15s}
.col.over{background:var(--accent-soft);border-color:#CDA695}
.col-h{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--line2)}
.col-h .cdot{width:6px;height:6px;border-radius:50%}
.col-h b{font-size:11.5px;font-weight:600}
.col-h span{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.icard{background:var(--card2);border:1px solid var(--line2);border-radius:2px;padding:10px;cursor:grab;transition:.14s;position:relative}
.icard:hover{border-color:#C6BCA7;box-shadow:0 2px 0 rgba(23,24,27,.04)}
.icard.dragging{opacity:.45}
.icard h4{font-size:12px;font-weight:500;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .im{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:9.5px;color:var(--muted)}
.icard .im .sep{color:var(--line)}
.icard .hook{margin-top:6px;font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .cf{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2)}
.icard .cf .due{font-family:var(--mono);font-size:9px;color:var(--faint)}
.icard .cf .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.15s}
.icard:hover .acts,.icard:focus-within .acts{opacity:1}
.iconbtn{width:21px;height:21px;display:grid;place-items:center;border-radius:2px;color:var(--faint)}
.iconbtn:hover{background:#EFE9DB;color:var(--text)}
.iconbtn svg{width:12px;height:12px}
.iconbtn.del:hover{color:var(--accent)}
.advance{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line2);padding:2px 5px;border-radius:2px}
.advance:hover{border-color:var(--accent);color:var(--accent)}
.col-add{padding:6px 8px;border-top:1px dashed var(--line2);font-size:10.5px;color:var(--faint);text-align:center}
.col-add:hover{color:var(--accent)}

/* ---------- 商单 ---------- */
.deal-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fan-wrap{position:relative;padding:8px 0 0}
.fan-stage{position:relative;height:206px;perspective:1100px;overflow:visible;touch-action:pan-y}
.fan-card{position:absolute;left:50%;top:12px;width:178px;transform-origin:50% 118%;transition:transform .52s cubic-bezier(.22,.9,.24,1),opacity .34s ease,filter .34s ease,box-shadow .34s ease;border-radius:3px;border:1px solid var(--line);background:var(--card2);padding:13px 13px 12px;cursor:pointer;will-change:transform;text-align:left}
.fan-card:not(.dim){box-shadow:0 14px 30px -18px rgba(23,24,27,.5)}
.fan-card:active{filter:brightness(.985)}
.fan-card .fc-top{display:flex;align-items:center;gap:6px}
.fan-card .fc-logo{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#EDE8DC;display:grid;place-items:center;font-family:var(--serif);font-size:12px;flex:none}
.fan-card .fc-brand{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fan-card .fc-stage{margin-left:auto}
.fan-card h4{font-size:11.5px;font-weight:500;line-height:1.4;margin-top:9px;height:32px;overflow:hidden}
.fan-card .fc-amt{font-family:var(--mono);font-size:14px;margin-top:8px}
.fan-card .fc-p{margin-top:8px}
.fan-card .fc-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:6px}
.fan-card.dim{filter:grayscale(.3) brightness(.97)}
.fan-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 0 2px}
.fan-nav .idx{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.fan-arrow{width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--card)}
.fan-arrow:hover{border-color:#BDB4A0}
.fan-arrow svg{width:12px;height:12px}
.focus-deal{display:grid;grid-template-columns:1.35fr .85fr;gap:0;margin-top:8px;overflow:hidden}
.fd-anim{animation:fdIn .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes fdIn{from{opacity:.25;transform:translateY(7px)}to{opacity:1;transform:none}}
.fd-l{padding:18px 20px;border-right:1px solid var(--line2)}
.fd-head{display:flex;align-items:flex-start;gap:12px}
.fd-head .fc-logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#EDE8DC;display:grid;place-items:center;font-family:var(--serif);font-size:18px;flex:none}
.fd-head h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2}
.fd-head .sub{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fd-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:16px}
.fd-meta .m .k{font-size:9.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.fd-meta .m .v{font-family:var(--mono);font-size:12px;margin-top:2px}
.fd-list{margin-top:15px}
.fd-list .k{font-size:9.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.fd-list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.fd-list li{font-size:11px;color:var(--muted);padding-left:14px;position:relative}
.fd-list li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;background:var(--line);border-radius:50%}
.fd-r{padding:18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F7F3EA}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:108px;height:108px}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-family:var(--mono);font-size:22px;font-weight:500;display:block;line-height:1}
.ring .rv span{font-size:9px;color:var(--muted);letter-spacing:.1em}
.fd-money{width:100%;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.fd-money b{color:var(--text);font-weight:500}
.fd-actions{width:100%;display:flex;flex-direction:column;gap:6px}
.fd-actions .btn{justify-content:center}

/* ---------- 日程 ---------- */
.sched-leg{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sched-leg span{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--muted)}
.sched-leg i{width:6px;height:6px;border-radius:1px;display:block}
.sched-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.sched{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));min-width:760px}
.sched .wk{background:#EFE9DC;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:8px 4px;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);position:sticky;left:0;z-index:2}
.sched .dh{padding:8px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line2);text-align:center;background:#F6F1E6}
.sched .dh b{font-family:var(--mono);font-size:11px;font-weight:500}
.sched .dh span{display:block;font-size:8.5px;color:var(--faint);letter-spacing:.08em;margin-top:1px}
.sched .wlab{display:grid;place-items:center;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:#EFE9DC;font-family:var(--mono);font-size:8px;color:var(--faint);letter-spacing:.06em;position:sticky;left:0;z-index:2}
.cell{min-height:104px;padding:6px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--card);transition:background .12s;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.cell:nth-child(7n+8){border-right:0}
.cell.other{background:#F6F2E9;opacity:.55}
.cell.today{background:#FBF3EA;box-shadow:inset 0 0 0 1px var(--accent)}
.cell.over{background:var(--accent-soft)}
.cell .dn{display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;color:var(--muted);min-height:13px}
.cell.today .dn b{color:var(--accent)}
.cell .dn b{font-weight:500}
.cell .dn .mm{margin-left:auto;font-size:8px;color:var(--faint)}
.ev{display:flex;align-items:center;gap:4px;font-size:9.5px;line-height:1.25;padding:2px 4px;border-radius:2px;background:#EEE8DB;border-left:2px solid var(--slate);cursor:grab;overflow:hidden;white-space:nowrap}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev .tm{font-family:var(--mono);font-size:8px;color:var(--muted);flex:none}
.ev.k-发布{border-left-color:var(--accent);background:#F7E9E2}
.ev.k-拍摄{border-left-color:var(--amber);background:#F7EFE2}
.ev.k-剪辑{border-left-color:#A78B63;background:#F3EEE3}
.ev.k-审核{border-left-color:var(--plum);background:#EFEAF3}
.ev.k-商单{border-left-color:#B35A3A;background:#F5E8E0}
.ev.k-复盘{border-left-color:var(--sage);background:#ECEFE4}
.ev.done{opacity:.5;text-decoration:line-through}
.ev.more{background:transparent;border-left-color:transparent;color:var(--faint);font-family:var(--mono);font-size:8px;cursor:pointer}
.ev.add{background:transparent;border-left-color:transparent;color:var(--faint);opacity:0;transition:opacity .12s;cursor:pointer;justify-content:center}
.cell:hover .ev.add{opacity:1}
.ev.add svg{width:10px;height:10px}
.day-list{list-style:none;margin:0;padding:0}
.day-list li{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.day-list li:last-child{border-bottom:0}
.day-list .dl-t{flex:1;min-width:0}
.day-list .dl-t b{font-size:12px;font-weight:500}
.day-list .dl-t .mm{display:flex;gap:7px;margin-top:4px;align-items:center;flex-wrap:wrap}
.day-list .dl-t .tm{font-family:var(--mono);font-size:9.5px;color:var(--muted)}

/* ---------- 洞察 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chart-card .card-b{padding:12px 14px 8px}
.chart-card.span2{grid-column:1/-1}
.chart-card svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--muted)}
.legend i{width:7px;height:7px;border-radius:1px;display:block}
.trend-wrap{overflow-x:auto}

/* ---------- 选题素材库 ---------- */
.lib-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.lib-tabs button{padding:8px 13px;font-size:11.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.lib-tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.mobile-more{display:none}
.more-wrap{position:relative}
.more-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 22px rgba(23,24,27,.14);padding:4px;display:none;z-index:40}
.more-menu.open{display:block}
.more-menu button{display:block;width:100%;text-align:left;padding:9px 10px;font-size:11.5px;border-radius:2px;color:var(--text)}
.more-menu button svg{width:12px;height:12px;margin-right:5px;opacity:.7;vertical-align:-1px}
.suggest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sg{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#F1ECE0;border:1px solid var(--line);border-radius:var(--r)}
.sg .no{font-family:var(--mono);font-size:9px;color:var(--faint);flex:none}
.sg .sgt{flex:1;min-width:0}
.sg .sgt b{display:block;font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .sgt span{font-size:9px;color:var(--muted)}
.sg .btn{flex:none}
.idea-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;display:flex;flex-direction:column;gap:9px;position:relative;transition:.15s}
.ic:hover{border-color:#C6BCA7;box-shadow:0 2px 0 rgba(23,24,27,.04)}
.ic .ich{display:flex;gap:7px;align-items:flex-start}
.ic .ich b{font-size:12px;font-weight:500;line-height:1.42;flex:1}
.ic .tags{display:flex;gap:4px;flex-wrap:wrap}
.ic .tag{font-size:8.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 5px;border-radius:2px}
.ic .icf{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line2)}
.ic .link{font-family:var(--mono);font-size:8.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95px}
.ic .icf .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.15s}
.ic:hover .acts{opacity:1}
.heat{display:inline-flex;gap:2px}
.heat i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.heat i.f{background:var(--accent)}
.heat.low i.f{background:var(--amber)}
.ic{cursor:pointer}

/* ---------- 选题手机预览 ---------- */
.phone-wrap{display:flex;gap:18px;align-items:flex-start}
.phone{width:294px;flex:none;background:#E8E2D3;border:1px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 10px 24px rgba(23,24,27,.1)}
.phone-screen{background:#FFFDF8;border-radius:17px;overflow:hidden;max-height:396px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.phone-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 13px 3px;font-family:var(--mono);font-size:8.5px;color:#9A9384}
.phone-bar .notch{width:46px;height:4px;border-radius:3px;background:#DDD6C6}
.note{padding-bottom:13px}
.note-top{display:flex;align-items:center;gap:8px;padding:7px 13px 9px}
.note-av{width:25px;height:25px;border-radius:50%;background:var(--accent-soft);color:#7E3A24;display:grid;place-items:center;font-family:var(--serif);font-size:12px;flex:none}
.note-top b{display:block;font-size:10.5px;font-weight:600;line-height:1.3}
.note-top span{font-size:8.5px;color:var(--faint)}
.note-top .flw{margin-left:auto;border:1px solid #D3A894;color:var(--accent);font-size:8.5px;padding:2px 8px;border-radius:20px;flex:none}
.note-cover{height:142px;margin:0 13px;border-radius:3px;background:linear-gradient(140deg,#F1EADC,#E5DDCB 55%,#DCD3BF);display:grid;place-items:center;text-align:center;padding:0 14px;color:#8A8171;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;line-height:1.6}
.note h4{font-family:var(--serif);font-size:13.5px;line-height:1.42;margin:10px 13px 0;font-weight:600}
.note p{font-size:10px;line-height:1.7;color:#4A463D;margin:6px 13px 0;white-space:pre-wrap}
.note .ntags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 13px 0}
.note .ntags span{font-size:9px;color:#5B6E45}
.note-bar{display:flex;gap:16px;margin:10px 13px 0;padding-top:8px;border-top:1px solid #F1ECDE;font-size:9px;color:#9A9384}
.pp-side{flex:1;min-width:0}
.pp-side .kv{grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 10px}
.pp-side .kv .v{font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){
  .phone-wrap{flex-direction:column-reverse;gap:14px}
  .phone{width:100%;max-width:340px;align-self:center}
  .phone-screen{max-height:320px}
}

/* ---------- 弹层 ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--text);border-radius:4px;max-width:560px;width:calc(100% - 32px);max-height:86vh;max-height:86dvh;box-shadow:0 18px 50px rgba(23,24,27,.22);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog.wide{max-width:720px}
dialog::backdrop{background:rgba(23,24,27,.44);backdrop-filter:blur(1px)}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 13px;border-bottom:1px solid var(--line);flex:none}
.m-head .eyebrow{display:block;margin-bottom:4px}
.m-head h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2}
.m-head .sub{font-size:10.5px;color:var(--muted);margin-top:4px}
.m-close{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.m-close:hover{background:#EFE9DB;color:var(--text)}
.m-close svg{width:13px;height:13px}
.m-body{padding:15px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;max-height:calc(86vh - 128px);max-height:calc(86dvh - 128px)}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#F7F3EA;flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 13px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
.f label b{color:var(--accent);font-weight:400;margin-left:2px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card2);padding:7px 9px;border-radius:2px;font-size:11.5px;outline:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#B4977F;box-shadow:0 0 0 2px rgba(176,74,43,.08)}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f .hint{font-size:9px;color:var(--faint)}
.dl-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dl-head h3{font-family:var(--serif);font-size:21px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px;margin:12px 0}
.kv .k{font-size:9px;color:var(--faint);letter-spacing:.07em;text-transform:uppercase}
.kv .v{font-family:var(--mono);font-size:11.5px;margin-top:1px}
.sec-t{font-size:9.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin:14px 0 6px}
.brief{font-size:11.5px;color:var(--muted);line-height:1.6;background:#F7F3EA;border-left:2px solid var(--line);padding:9px 11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--ink);color:#F0EBE0;font-size:11.5px;padding:9px 14px;border-radius:3px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ta{margin-left:10px;padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.5);color:#F2CDB0;font-size:11.5px}
.toast .ta:hover{color:#fff;border-bottom-color:#fff}
.toast.err{background:#8E3320}
.offline-strip{display:flex;align-items:flex-start;gap:8px;font-size:10px;color:#7A5326;background:#F7EEDE;border:1px solid #E4D2B4;border-left:3px solid var(--amber);padding:7px 11px;border-radius:2px;margin-bottom:12px;cursor:pointer;line-height:1.55}
.offline-strip b{font-weight:500}
.offline-strip svg{flex:none;width:13px;height:13px;margin-top:2px}
.quick{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:var(--r);padding:7px 11px;margin-bottom:12px}
.quick .eyebrow{flex:none}
.quick input{flex:1;min-width:140px;border:0;background:transparent;font-size:12px;padding:3px 2px;outline:none}
.quick input::placeholder{color:var(--faint)}
.quick .qbtns{display:flex;gap:4px;flex:none}
.mobile-only{display:none}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  main{padding:0 20px 48px}
  .kanban{grid-template-columns:repeat(5,minmax(210px,1fr))}
  .today-grid{grid-template-columns:1fr 1fr}
  .today-grid .card:last-child{grid-column:1/-1}
}
@media (max-width:1020px){
  .idea-grid,.suggest{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .deal-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .focus-deal{grid-template-columns:1fr}
  .fd-l{border-right:0;border-bottom:1px solid var(--line2)}
  .today-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:820px){
  body{grid-template-columns:1fr;display:block}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:0;border-top:1px solid #2A2B2E;background:rgba(23,24,27,.98);backdrop-filter:blur(8px)}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:4px;padding:6px 2px;font-size:10px;border-left:0;border-bottom:2px solid transparent;justify-content:center}
  .nav button.on{border-left-color:transparent;border-bottom-color:var(--accent);background:transparent}
  .nav button svg{width:15px;height:15px}
  .nav .count{display:none}
  .nav{flex:1;width:auto}
  .bh-entry{flex:none;flex-direction:column;gap:4px;padding:6px 5px;font-size:10px;border:0;background:none;min-width:52px}
  .bh-entry:hover{background:none;color:#fff}
  .bh-orb{width:15px;height:15px;box-shadow:0 0 7px rgba(224,138,76,.4)}
  .bh-entry .bh-tag{display:none}
  .bh-chrome{padding:7px 10px}
  .bh-chrome span{display:none}
  main{padding:0 13px calc(64px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(74px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px);padding:10px 14px}
  .toast .ta{min-height:28px;padding:2px 8px}
  .topbar{padding:14px 0 11px;gap:9px}
  .tb-l h1{font-size:21px}
  .tb-l p{display:none}
  .tb-r{gap:7px;flex:1;justify-content:flex-end}
  .clock{display:none}
  .sync{font-size:8.5px;padding:4px 7px}
  #newBtn{padding:6px 9px;font-size:10.5px}
  .view{padding-top:13px}
  .today-grid,.grid-3,.grid-2{grid-template-columns:1fr}
  .today-grid .card:last-child{grid-column:auto}
  .today-hero{display:none}
  .today-stats,.deal-stats,.kpis{grid-template-columns:1fr 1fr;gap:8px}
  .stat b{font-size:21px}
  .kanban{grid-template-columns:1fr;gap:9px}
  .col{min-height:0}
  .col-b{flex-direction:row;flex-wrap:wrap}
  .icard{flex:1 1 100%}
  .icard .acts{opacity:1}
  .advance{padding:2px 5px}
  .fan-stage{height:176px}
  .fan-card{width:132px;padding:10px}
  .fan-card h4{font-size:10.5px;height:30px}
  .fan-card .fc-amt{font-size:12px}
  .fan-card .fc-brand{font-size:10.5px}
  .fan-arrow{width:34px;height:34px}
  .focus-deal{margin-top:0}
  .fd-head h3{font-size:19px}
  .fd-meta{grid-template-columns:1fr 1fr;gap:8px 12px}
  /* 手机端：整张月历缩进一屏，七列不横滑 */
  .sched-scroll{overflow-x:hidden}
  .sched{min-width:0;grid-template-columns:20px repeat(7,minmax(0,1fr))}
  .sched .wk{padding:6px 0;font-size:6.5px;letter-spacing:0}
  .sched .wlab{font-size:7px;letter-spacing:0}
  .sched .dh{padding:6px 1px}
  .sched .dh b{font-size:10.5px}
  .sched .dh span{font-size:7.5px;letter-spacing:0;margin-top:0}
  .cell{min-height:64px;padding:3px 2px;gap:2px}
  .cell .dn{font-size:9.5px;min-height:12px}
  .cell .dn .mm{font-size:7px}
  .ev{font-size:8px;line-height:1.2;padding:1px 2px;gap:2px;border-left-width:2px;border-radius:1px}
  .ev .tm{font-size:6.5px}
  .ev.more{font-size:7.5px;justify-content:center;background:transparent;border-left:0;color:var(--muted)}
  .ev.add{justify-content:center;background:transparent;border-left:0;opacity:.5}
  .sched-leg{flex-wrap:nowrap;overflow-x:auto;gap:9px;margin-bottom:0;min-width:0}
  .sched-leg span{flex:none;font-size:9px}
  .toolbar .sp{display:none}
  .chart-card .card-b{padding:8px 6px 2px}
  .legend{gap:7px}
  .idea-grid{grid-template-columns:1fr}
  /* 手机端去掉与卡片重复的推荐列表 */
  .suggest{display:none}
  /* 类型 tab / 状态筛选改为横滑，不再换行挤压 */
  .lib-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .lib-tabs::-webkit-scrollbar{display:none}
  .lib-tabs button{flex:0 0 auto;text-align:center;white-space:nowrap}
  .filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .filters .chip{flex:none}
  /* 卡片只留三个高频动作，其余进详情弹窗 */
  .ic .acts .act2{display:none}
  .ic .icf .acts{opacity:1}
  /* 顶栏收起次要入口 */
  #dataBtn,#aiBtn{display:none}
  .mobile-more{display:block}
  .tb-r{position:relative}
  .more-wrap{position:static}
  .more-menu{right:0}
  .form-grid{grid-template-columns:1fr}
  .f.full{grid-column:auto}
  dialog{width:calc(100% - 20px);max-height:92vh;max-height:92dvh;margin:auto}
  .m-body{max-height:calc(92vh - 132px);max-height:calc(92dvh - 132px)}
  .m-head{padding:13px 15px 11px}
  .m-head h3{font-size:17px}
  .m-head .sub{margin-top:2px}
  .m-body{padding:12px 15px}
  .m-foot{padding:10px 15px calc(10px + env(safe-area-inset-bottom));gap:7px}
  .m-foot .btn{flex:1;justify-content:center;min-height:40px}
  .mobile-only{display:block}
  .fp{display:none}
  /* ---- 手机端触控与可读性 ---- */
  .chip{padding:6px 11px;font-size:11px;min-height:32px;display:inline-flex;align-items:center}

function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){
  if(!s) return null;
  const p = String(s).slice(0,10).split('-').map(Number);
  if(p.length !== 3 || !p[0]) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function addDays(s, n){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function weekStart(s){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return ymd(d);
}
function diffDays(a, b){
  const A = parseYmd(a), B = parseYmd(b);
  if(!A || !B) return 0;
  return Math.round((B - A)/86400000);
}
function fmtD(s){ const d = parseYmd(s); return d ? (d.getMonth()+1)+'/'+d.getDate() : '—'; }
function fmtCN(s){
  const d = parseYmd(s); if(!d) return '—';
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
}
function weekNoOf(s){
  const d = parseYmd(s) || new Date();
  const start = new Date(d.getFullYear(),0,1);
  return Math.ceil((Math.floor((d-start)/86400000) + start.getDay() + 1)/7);
}
function relDay(s){
  const n = diffDays(todayStr(), s);
  if(!s) return '未排期';
  if(n === 0) return '今天';
  if(n === 1) return '明天';
  if(n === -1) return '昨天';
  return n > 0 ? n+' 天后' : (-n)+' 天前';
}

  if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'')+'万';

}

function contentText(c){

function legacyCopy(text, done, fail){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  }catch(e){ fail(); }
}
function copyText(text, okMsg){
  if(!text){ toast('这条还没有正文', true); return; }
  const done = ()=>toast(okMsg || '已复制，去小红书粘贴就能发');
  const fail = ()=>toast('复制失败，长按文字手动选择', true);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>legacyCopy(text, done, fail));
  }else{
    legacyCopy(text, done, fail);
  }
}

/* ================= 数据层 ================= */
const TABLES = ['content_items','deals','schedule','metrics','ideas'];
const LS_KEY = 'zd_workbench_v2';

const Store = {
  mode: DEMO ? 'demo' : (CLOUD ? 'cloud' : 'local'),
  data: { content_items:[], deals:[], schedule:[], metrics:[], ideas:[] },
  fp: '',
  sha: '',
  lastSync: null
};

function emptyData(){
  return { content_items:[], deals:[], schedule:[], metrics:[], ideas:[] };
}
function normalizeTables(t){
  const d = emptyData();
  TABLES.forEach(k=>{ d[k] = Array.isArray(t && t[k]) ? t[k] : []; });
  return d;
}

/* ---------- GitHub 数据盘（私有数据仓库） ---------- */
const GH_API  = 'https://api.github.com';
const GH_FILE = '/repos/' + WB_CONFIG.DATA_OWNER + '/' + WB_CONFIG.DATA_REPO + '/contents/' + WB_CONFIG.DATA_PATH;
const LEGACY_URL = 'https://raw.githubusercontent.com/' + WB_CONFIG.OWNER + '/' + WB_CONFIG.REPO + '/' + WB_CONFIG.BRANCH + '/' + WB_CONFIG.PATH;
/* 只读一次旧公开仓库，用于首次把已有数据搬进私有仓库 */
async function readLegacyDoc(){
  try{
    const res = await fetch(LEGACY_URL + '?t=' + Date.now());
    if(!res.ok) return null;
    const j = JSON.parse(await res.text());
    return j && j.tables ? j : null;
  }catch(e){
    return null;
  }
}

function ghHeaders(extra){
  return Object.assign({
    'Authorization':'Bearer ' + ghToken(),
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
    'Content-Type':'application/json'
  }, extra || {});
}
function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64 || '').replace(/\s+/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function ghFetch(path, opts){
  const o = Object.assign({ headers: ghHeaders() }, opts || {});
  let res;
  try{
    res = await fetch(GH_API + path, o);
  }catch(err){
    throw new Error('网络无法连接 GitHub');
  }
  if(res.status === 404) return { __notfound:true };
  if(!res.ok){
    let msg = res.status + ' ' + (res.statusText || '');
    if(res.status === 401) msg = '令牌无效或已过期';
    if(res.status === 403) msg = '令牌权限不足或已限流';
    if(res.status === 409) msg = '数据冲突，请稍后重试';
    try{ const j = await res.json(); if(j && j.message) msg = j.message; }catch(e){}
    throw new Error(msg);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function ghReadDoc(){
  const r = await ghFetch(GH_FILE + '?ref=' + WB_CONFIG.BRANCH + '&t=' + Date.now());
  if(!r || r.__notfound) return { doc:null, sha:null };
  let doc = null;
  try{ doc = JSON.parse(b64dec(r.content)); }catch(e){ doc = null; }
  return { doc, sha:r.sha };
}
function docOf(data){
  return { v:1, updated_at:new Date().toISOString(), tables:data };
}
async function ghWriteDoc(doc){
  if(LOCAL_ONLY) throw new Error('只读演示模式，不会写入云端');
  const body = {
    message:'data: 工作台数据 ' + new Date().toISOString().slice(0,16).replace('T',' '),
    content: b64enc(JSON.stringify(doc, null, 2)),
    branch: WB_CONFIG.BRANCH
  };
  if(Store.sha) body.sha = Store.sha;
  let r;
  try{
    r = await ghFetch(GH_FILE, { method:'PUT', body:JSON.stringify(body) });
  }catch(err){
    if(!String(err.message).includes('冲突')) throw err;
    const fresh = await ghReadDoc();
    Store.sha = fresh.sha || '';
    if(fresh.sha) body.sha = fresh.sha; else delete body.sha;
    r = await ghFetch(GH_FILE, { method:'PUT', body:JSON.stringify(body) });
  }
  if(r && r.__notfound){
    throw new Error('找不到数据仓库 ' + WB_CONFIG.DATA_OWNER + '/' + WB_CONFIG.DATA_REPO + '，请先创建这个私有仓库再连接');
  }
  Store.sha = (r && r.content && r.content.sha) || Store.sha;
}
function lsRead(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.content_items) return normalizeTables(d);
    }
  }catch(e){}
  /* 正常使用不再灌演示数据；只有 ?demo=1 才生成示例 */
  const s = DEMO ? seedData() : emptyData();
  lsWrite(s);
  return s;
}
function lsWrite(d){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){ toast('本地存储写入失败', true); }
}
function fpOf(d){
  return TABLES.map(t=>{
    const rows = d[t] || [];
    let mx = '';
    for(const r of rows){
      const v = String(r.updatedAt || r.updated_at || r.createdAt || r.created_at || '');
      if(v > mx) mx = v;
    }
    return t + ':' + rows.length + ':' + mx;
  }).join('|');
}

let pushTimer = null;
function schedulePush(){
  if(Store.mode !== 'cloud') return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 900);
}
async function pushNow(){
  if(Store.mode !== 'cloud') return;
  try{
    /* 防误清空：某张表突然少掉七成以上时，以云端为准，避免一次误操作抹掉整表 */
    try{
      const remote = await ghReadDoc();
      if(remote.doc && remote.doc.tables){
        let fixed = [];
        TABLES.forEach(t=>{
          const rl = (remote.doc.tables[t] || []).length;
          const ll = (Store.data[t] || []).length;
          if(rl >= 6 && ll < rl * 0.3){
            Store.data[t] = remote.doc.tables[t];
            fixed.push(t);
          }
        });
        if(fixed.length) toast('检测到数据异常减少，已按云端恢复：' + fixed.join('、'), true);
      }
    }catch(e){}
    await ghWriteDoc(docOf(Store.data));
    Store.lastSync = Date.now();
    setSyncState('ok');
  }catch(e){
    setSyncState('warn', '保存失败');
    toast('云端保存失败：' + e.message, true);
  }
}

async function createRow(table, row){
  const rec = Object.assign({ id:uid(), created_at:new Date().toISOString(), updated_at:new Date().toISOString() }, row);
  Store.data[table] = (Store.data[table] || []).concat(rec);
  if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(Store.data);
  Store.fp = fpOf(Store.data);
  return rec;
}

async function updateRow(table, id, patch){
  const i = (Store.data[table] || []).findIndex(r => r.id === id);
  if(i < 0) return null;
  Store.data[table][i] = Object.assign({}, Store.data[table][i], patch, { updated_at:new Date().toISOString() });
  if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(Store.data);
  Store.fp = fpOf(Store.data);
  return Store.data[table][i];
}

async function deleteRow(table, id, label){
  const arr = Store.data[table] || [];
  const idx = arr.findIndex(r => r.id === id);
  if(idx < 0) return;
  const row = arr[idx];
  const name = label || '记录';
  Store.data[table] = arr.slice(0, idx).concat(arr.slice(idx + 1));
  if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(Store.data);
  Store.fp = fpOf(Store.data);
  toast(name + '已删除', false, { label:'撤销', fn: ()=>restoreRow(table, row, idx, name) });
}

async function restoreRow(table, row, idx, label){
  const arr = (Store.data[table] || []).slice();
  arr.splice(clamp(idx, 0, arr.length), 0, row);
  Store.data[table] = arr;
  if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(Store.data);
  Store.fp = fpOf(Store.data);
  renderAll();
  toast((label || '记录') + '已恢复');
}

async function loadAll(){
  if(Store.mode === 'cloud'){
    const { doc, sha } = await ghReadDoc();
    let d = doc && doc.tables ? normalizeTables(doc.tables) : emptyData();
    let migrated = false;
    Store.sha = sha || '';
    /* 私有仓库为空时，尝试沿用旧公开仓库的数据，避免换存储后丢历史 */
    if(sum(TABLES, t=>d[t].length) === 0){
      const legacy = await readLegacyDoc();
      if(legacy && sum(TABLES, t=>(legacy.tables[t] || []).length) > 0){
        d = normalizeTables(legacy.tables);
        migrated = true;
        toast('已把旧仓库的数据迁移到私有数据仓库');
      }
    }
    Store.data = d;
    if(migrated || !(doc && doc.tables)) await ghWriteDoc(docOf(d));
  }else if(Store.mode === 'demo'){
    Store.data = seedData();
  }else{
    Store.data = lsRead();
  }
  Store.fp = fpOf(Store.data);
  Store.lastSync = Date.now();
}

async function syncNow(announce){
  if(Store.mode === 'demo') return;
  try{
    if(Store.mode === 'cloud'){
      const { doc, sha } = await ghReadDoc();
      if(doc && doc.tables && sha && sha !== Store.sha){
        Store.data = doc.tables;
        Store.sha = sha;
        Store.fp = fpOf(Store.data);
        Store.lastSync = Date.now();
        setSyncState('ok');
        renderAll();
        if(announce) toast('已同步最新数据');
        return;
      }
      Store.lastSync = Date.now();
      setSyncState('ok');
      if(announce) toast('已是最新');
      return;
    }
    const d = lsRead();
    const fp = fpOf(d);
    Store.data = d;
    Store.lastSync = Date.now();
    setSyncState('ok');
    if(fp !== Store.fp){
      Store.fp = fp;
      renderAll();
      if(announce) toast('已重新载入本地数据');
    }else if(announce){
      toast('已是最新');
    }
  }catch(e){
    setSyncState('err', e.message);
    if(announce) toast('同步失败：' + e.message, true);
  }
}

function setSyncState(state, msg){
  const chip = $('#sync');
  const lab = chip.querySelector('span');
  const cloud = Store.mode === 'cloud';
  const demo = Store.mode === 'demo';
  chip.className = 'sync' + (demo ? ' demo' : cloud ? '' : ' local') + (state === 'err' ? ' err' : state === 'warn' ? ' warn' : '');
  if(state === 'ok' || state === 'warn'){
    lab.textContent = demo ? '演示数据' : cloud ? '在线同步' : '本地存储';
    chip.title = demo
      ? '当前是演示数据，不会写入任何仓库'
      : cloud
        ? '数据存在私有仓库 ' + WB_CONFIG.DATA_OWNER + '/' + WB_CONFIG.DATA_REPO + '，点击立即拉取'
        : '数据只存在本机浏览器，点「数据」可连接云端';
    $('#railData').innerHTML = '<span class="dot-live" style="' + (demo ? 'background:#8A6EA8' : cloud ? '' : 'background:#A39B8C') + '"></span>' +
      (demo ? 'DEMO · 演示数据' : cloud ? 'GITHUB · 在线' : 'LOCAL · 本机存储');
    if(state === 'warn' && msg) chip.title = msg;
  }else{
    lab.textContent = '离线';
    chip.title = msg || '';
    $('#railData').innerHTML = '<span class="dot-live" style="background:#B04A2B"></span>' + (msg ? esc(msg).slice(0,26) : '数据连接异常');
  }
}

function xlCell(v, isNum){
  const s = v == null ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const t = (isNum && v !== null && v !== '') ? 'Number' : 'String';
  return '<Cell><Data ss:Type="' + t + '">' + s + '</Data></Cell>';
}
function exportXLSX(){
  let sheets = '';
  XL_SHEETS.forEach(sh=>{
    const rows = Store.data[sh.key] || [];
    let body = '<Row>' + sh.cols.map(c=>xlCell(c[0], false)).join('') + '</Row>';
    rows.forEach(r=>{ body += '<Row>' + sh.cols.map(c=>xlCell(r[c[1]], typeof r[c[1]] === 'number')).join('') + '</Row>'; });
    sheets += '<Worksheet ss:Name="' + sh.name + '"><Table>' + body + '</Table></Worksheet>';
  });
  const xml = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' + sheets + '</Workbook>';
  const blob = new Blob(['\ufeff' + xml], { type:'application/vnd.ms-excel' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zhidong-workbench-' + todayStr() + '.xls';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('已导出表格文件（5 个工作表）');
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const j = JSON.parse(String(fr.result));
      const d = j && j.tables ? j.tables : j;
      if(!d || !Array.isArray(d.content_items)) throw new Error('文件里没有工作台数据');
      TABLES.forEach(t=>{ if(!Array.isArray(d[t])) d[t] = []; });
      Store.data = d;
      Store.fp = fpOf(d);
      if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(d);
      renderAll();
      toast('已导入 ' + sum(TABLES, t=>d[t].length) + ' 条记录');
    }catch(e){ toast('导入失败：' + e.message, true); }
  };
  fr.readAsText(file);
}
async function connectCloud(tok){
  const prevMode = Store.mode;
  localStorage.setItem(TOKEN_KEY, tok);
  Store.mode = 'cloud';
  Store.sha = '';
  try{
    await loadAll();
  }catch(err){
    localStorage.removeItem(TOKEN_KEY);
    Store.mode = prevMode === 'demo' ? 'demo' : 'local';
    Store.sha = '';
    const msg = String((err && err.message) || '');
    if(/not found|404/i.test(msg)){
      throw new Error('读不到私有数据仓库 ' + WB_CONFIG.DATA_OWNER + '/' + WB_CONFIG.DATA_REPO + '，请先创建它，并让令牌拥有该仓库的 Contents 读写权限');
    }
    throw err;
  }
  CLOUD = true;
  Store.fp = fpOf(Store.data);
  Store.lastSync = Date.now();
  setSyncState('ok');
  renderAll();
  toast('已连接云端，数据写入私有仓库 ' + WB_CONFIG.DATA_REPO);
}
function disconnectCloud(){
  localStorage.removeItem(TOKEN_KEY);
  CLOUD = false;
  Store.mode = 'local';
  Store.sha = '';
  lsWrite(Store.data);
  setSyncState('ok');
  renderAll();
  toast('已断开云端，切回本地存储');
}

/* iOS：键盘弹出时可见视口会变矮，弹窗按可见高度收缩，保证底部按钮不被挡 */
function fitDialog(){
  if(!modalEl.open) return;
  const vv = window.visualViewport;
  const h = (vv ? vv.height : window.innerHeight) || window.innerHeight;
  modalEl.style.maxHeight = Math.max(220, Math.round(h * 0.92)) + 'px';
  if(vv && Math.abs(vv.offsetTop) > 1){
    modalEl.style.transform = 'translateY(' + Math.round(vv.offsetTop) + 'px)';

    modalEl.style.transform = '';

function fieldHTML(f, values){
  const val = values[f.key] == null ? (f.def == null ? '' : f.def) : values[f.key];
  let input;
  if(f.type === 'textarea'){
    input = '<textarea name="'+f.key+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(val)+'</textarea>';
  }else if(f.type === 'select'){
    input = '<select name="'+f.key+'">'+(f.options||[]).map(o=>'<option value="'+esc(o)+'"'+(String(o)===String(val)?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  }else{
    input = '<input name="'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||'')+'"'+
      (f.required?' required':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+(f.step!=null?' step="'+f.step+'"':'')+'>';
  }
  return '<div class="f'+(f.full?' full':'')+'"><label>'+esc(f.label)+(f.required?'<b>*</b>':'')+'</label>'+input+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</div>';
}

      btn.disabled = false;
    }
  });

function renderToday(){
  const d = Store.data;
  const today = todayStr();
  const todos = sortBy(d.schedule.filter(e=>e.date===today), (a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  const undone = todos.filter(t=>t.status!=='完成').length;
  const weekEnd = addDays(today, 7);
  const queued = d.content_items.filter(c=>c.stage==='发布' && c.due_date && c.due_date>=today && c.due_date<=weekEnd);
  const activeDeals = d.deals.filter(x=>x.stage!=='已交付' && x.stage!=='已回款');
  const pendingMoney = sum(activeDeals, x=>(Number(x.amount)||0)-(Number(x.received)||0));
  const feed = sortBy(d.content_items, (a,b)=>{
    if(!a.due_date) return 1; if(!b.due_date) return -1;

function narrowView(){ return (typeof window !== 'undefined') && window.innerWidth <= 820; }
function fanOffset(i, idx, n){
  let off = i - idx;
  if(n > 2){
    if(off > n/2) off -= n;
    if(off < -n/2) off += n;
  }
  return off;
}
function fanTransform(off){
  const nar = narrowView(), abs = Math.abs(off);
  const tx = off * (nar ? 88 : 92), ty = abs * (nar ? 8 : 9), rot = off * (nar ? 6 : 7);
  const sc = abs === 0 ? 1.045 : (abs === 1 ? .95 : .875);
  return 'translateX(calc(-50% + '+tx+'px)) translateY('+ty+'px) rotate('+rot+'deg) scale('+sc+')';
}
function fanStyle(off){
  return 'transform:'+fanTransform(off)+';z-index:'+(10-Math.abs(off));
}

function focusDealHTML(x){

        '<div class="m"><div class="k">已回款</div><div class="v">'+fmtMoney(x.received)+'</div></div>'+
      '</div>'+
      '<div class="fd-list"><div class="k">交付内容</div><ul>'+(dl.length? dl.map(t=>'<li>'+esc(t)+'</li>').join('') : '<li>未填写</li>')+'</ul></div>'+
    '</div>'+
    '<div class="fd-r">'+
      '<div class="ring">'+ringSVG(pct)+'<div class="rv"><b>'+pct+'<small style="font-size:11px">%</small></b><span>PROGRESS</span></div></div>'+
      '<div class="fd-money"><span>合同 / 已收</span><b>'+fmtMoney(x.amount)+' / '+fmtMoney(x.received)+'</b></div>'+
      '<div class="fd-actions">'+
        '<button class="btn primary" data-act="open-deal" data-id="'+esc(x.id)+'">打开项目资料</button>'+
        '<button class="btn" data-act="deal-schedule" data-id="'+esc(x.id)+'">加入排期</button>'+
        '<button class="btn ghost" data-act="edit-deal" data-id="'+esc(x.id)+'">编辑商单</button>'+
      '</div>'+
    '</div>';

/* 只更新扇形与聚焦卡，不重建节点，保留过渡动画 */
function applyFan(){
  const deals = Store.data.deals;
  const n = deals.length;
  const box = document.querySelector('#views .view[data-view="deals"]');
  if(!box || !n) return;
  const idx = clamp(ui.dealIndex, 0, n-1);
  ui.dealIndex = idx;
  box.querySelectorAll('.fan-card').forEach(el=>{
    const i = Number(el.dataset.i);
    if(!deals[i]) return;
    const off = fanOffset(i, idx, n), abs = Math.abs(off);
    const visible = abs <= (narrowView() ? 1 : 2);
    el.style.transform = fanTransform(off);
    el.style.zIndex = 10 - abs;
    el.style.opacity = visible ? 1 : 0;
    el.style.pointerEvents = visible ? 'auto' : 'none';
    el.classList.toggle('dim', off !== 0);
  });
  const idxEl = box.querySelector('.fan-nav .idx');
  if(idxEl) idxEl.textContent = pad2(idx+1)+' / '+pad2(n);
  const fd = box.querySelector('.focus-deal');
  if(fd){
    fd.innerHTML = focusDealHTML(deals[idx]);
    fd.classList.remove('fd-anim');
    void fd.offsetWidth;
    fd.classList.add('fd-anim');
  }
}

function renderSchedule(){
  const base = ui.schedStart || weekStart(todayStr());
  ui.schedStart = base;
  const today = todayStr();
  const byDate = {};
  Store.data.schedule.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
  Object.keys(byDate).forEach(k=>{
    byDate[k].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  });

  const legend = EVENT_KINDS.map(k=>'<span><i style="background:'+KIND_DOT[k]+'"></i>'+esc(k)+'</span>').join('');
  const head = '<div class="sched"><div class="wk">WK</div>'+
    [0,1,2,3,4,5,6].map(i=>{
      const d = parseYmd(addDays(base, i));
      const wk = ['周一','周二','周三','周四','周五','周六','周日'][i];
      return '<div class="dh" style="'+(i===6?'border-right:0':'')+'"><b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b><span>'+wk+'</span></div>';
    }).join('');

  let body = '';
  const maxShowN = narrowView() ? 1 : 2;
  for(let w=0; w<4; w++){
    const wDate = parseYmd(addDays(base, w*7));
    body += '<div class="wlab">W'+(weekNoOf(ymd(wDate)))+'</div>';
    for(let dj=0; dj<7; dj++){
      const date = addDays(base, w*7+dj);
      const list = byDate[date] || [];
      const shown = list.slice(0, maxShowN);
      body += '<div class="cell'+(date===today?' today':'')+(w===3 && dj>3?' other':'')+'" data-date="'+date+'" data-act="open-day" title="点此查看当天安排">'+
        '<div class="dn"><b>'+parseYmd(date).getDate()+'</b>'+(parseYmd(date).getDate()===1?'<span class="mm">'+(parseYmd(date).getMonth()+1)+'月</span>':'')+'</div>'+
        shown.map(e=>'<div class="ev k-'+esc(e.kind)+(e.status==='完成'?' done':'')+'" draggable="true" data-ev="'+esc(e.id)+'" data-act="edit-event" data-id="'+esc(e.id)+'" title="'+esc(e.title)+'">'+
          (e.time?'<span class="tm">'+esc(e.time)+'</span>':'')+'<span>'+esc(e.title)+'</span></div>').join('')+
        (list.length > maxShowN ? '<div class="ev more" data-act="open-day" data-date="'+date+'">+'+(list.length-maxShowN)+' 项</div>'
          : (list.length === 0 ? '<div class="ev add" data-act="new-event" data-date="'+date+'">'+icon('plus',10)+'</div>' : ''))+
      '</div>';
    }
  }
  body += '</div>';

  $('#views .view[data-view="schedule"]').innerHTML =
    '<div class="toolbar"><div class="sched-leg">'+legend+'</div><div class="sp"></div>'+
      '<button class="btn sm" data-act="sched-shift" data-n="-28">'+icon('arrowL',12)+' 上一组</button>'+
      '<button class="btn sm" data-act="sched-today">本周</button>'+
      '<button class="btn sm" data-act="sched-shift" data-n="28">下一组 '+icon('arrowR',12)+'</button>'+
    '</div>'+
    '<div class="mobile-only sched-hint">点日期格看当天安排 · 格中的 + 直接新建</div>'+
    '<div class="sched-scroll">'+head+body+'</div>';

/* ================= 拖拽 ================= */
let dragOverEl = null;
document.addEventListener('dragstart', e=>{
  const card = e.target.closest ? e.target.closest('.icard[draggable="true"]') : null;
  if(card){
    e.dataTransfer.setData('text/plain', 'content:' + card.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
    return;
  }
  const ev = e.target.closest ? e.target.closest('.ev[draggable="true"]') : null;
  if(ev){
    e.dataTransfer.setData('text/plain', 'event:' + ev.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    ev.classList.add('dragging');
  }
});
document.addEventListener('dragend', e=>{
  $$('.icard.dragging,.ev.dragging').forEach(x=>x.classList.remove('dragging'));
  $$('.col.over,.cell.over').forEach(x=>x.classList.remove('over'));
  dragOverEl = null;
});
document.addEventListener('dragover', e=>{
  const t = e.target.closest ? (e.target.closest('.col') || e.target.closest('.cell')) : null;
  if(!t) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(dragOverEl && dragOverEl !== t) dragOverEl.classList.remove('over');
  t.classList.add('over');
  dragOverEl = t;
});
document.addEventListener('drop', async e=>{
  const t = e.target.closest ? (e.target.closest('.col') || e.target.closest('.cell')) : null;
  if(!t) return;
  e.preventDefault();
  $$('.col.over,.cell.over').forEach(x=>x.classList.remove('over'));
  dragOverEl = null;
  const raw = e.dataTransfer.getData('text/plain') || '';
  const p = raw.indexOf(':');
  const type = raw.slice(0, p), id = raw.slice(p+1);
  try{
    if(type === 'content' && t.classList.contains('col')){
      const stage = t.dataset.stage;
      const c = Store.data.content_items.find(x=>x.id===id);
      if(!c || c.stage === stage) return;
      const patch = { stage };
      if(stage === '已发布') patch.published_at = new Date().toISOString();
      await updateRow('content_items', id, patch);
      renderAll();
      toast('已移动到「'+stage+'」');
    }else if(type === 'event' && t.classList.contains('cell')){
      const date = t.dataset.date;
      const ev = Store.data.schedule.find(x=>x.id===id);
      if(!ev || ev.date === date) return;
      await updateRow('schedule', id, { date });
      renderAll();
      toast('已改到 ' + fmtD(date));
    }
  }catch(err){
    toast('移动失败：' + err.message, true);
  }
});
/* ================= 洞察 ================= */
function donutSVG(items){
  const total = sum(items, x=>x.value);
  const safe = total || 1;
  const r = 56, C = 2 * Math.PI * r;
  let acc = 0;
  const arcs = items.filter(x=>x.value>0).map((x,i)=>{
    const dash = x.value / safe * C;
    const rot = acc / safe * 360 - 90;
    acc += x.value;
    return '<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+x.color+'" stroke-width="15" stroke-dasharray="'+dash+' '+(C-dash)+'" transform="rotate('+rot+' 80 80)"/>';
  }).join('');
  return '<svg viewBox="0 0 160 160" style="max-width:190px;margin:4px auto 2px;display:block">'+arcs+
    '<text x="80" y="77" text-anchor="middle" font-size="22" font-family="ui-monospace,monospace" fill="#1F1D19">'+(total?fmtNum(total):'0')+'</text>'+
    '<text x="80" y="95" text-anchor="middle" font-size="8.5" letter-spacing="1.6" fill="#7A7468">TOTAL</text></svg>';
}

function barsSVG(items){
  const w = 560, rowH = 34, labelW = 64, valW = 58;
  const h = items.length * rowH + 8;
  const barW = w - labelW - valW - 10;
  const max = Math.max.apply(null, items.map(x=>x.value).concat([1]));
  const rows = items.map((x,i)=>{
    const yy = 4 + i * rowH;
    const bw = Math.max(2, x.value / max * barW);
    return '<text x="0" y="'+(yy+12)+'" font-size="10" fill="#7A7468">'+esc(x.label)+'</text>'+
      '<rect x="'+labelW+'" y="'+yy+'" width="'+barW+'" height="10" rx="2" fill="#E7E1D3"/>'+
      '<rect x="'+labelW+'" y="'+yy+'" width="'+bw+'" height="10" rx="2" fill="'+x.color+'"/>'+
      '<text x="'+w+'" y="'+(yy+10)+'" text-anchor="end" font-size="10" font-family="ui-monospace,monospace" fill="#1F1D19">'+fmtNum(x.value)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="padding:4px 2px 2px">'+rows+'</svg>';
}

function trendSVG(points){
  const w = 620, h = 200, pl = 44, pr = 14, pt = 16, pb = 28;
  const innerW = w - pl - pr, innerH = h - pt - pb;
  const max = Math.max.apply(null, points.map(p=>p.value).concat([1]));
  const step = points.length > 1 ? innerW / (points.length-1) : 0;
  const X = i => pl + (points.length > 1 ? i * step : innerW/2);
  const Y = v => pt + innerH - (v / max) * innerH;
  const linePts = points.map((p,i)=>X(i)+','+Y(p.value)).join(' ');
  const areaPts = pl+','+(pt+innerH)+' '+linePts+' '+(pl+innerW)+','+(pt+innerH);
  const grid = [0,0.5,1].map(f=>{
    const yy = pt + innerH - f * innerH;
    return '<line x1="'+pl+'" y1="'+yy+'" x2="'+(pl+innerW)+'" y2="'+yy+'" stroke="#E7E1D3" stroke-width="1"/>'+
      '<text x="'+(pl-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" font-family="ui-monospace,monospace" fill="#A39B8C">'+fmtNum(max*f)+'</text>';
  }).join('');
  const labels = points.map((p,i)=>{
    const every = points.length > 14 ? Math.ceil(points.length / 7) : 1;
    if(points.length > 14 && i !== points.length-1 && i % every !== 0) return '';
    return '<text x="'+X(i)+'" y="'+(h-9)+'" text-anchor="middle" font-size="9" font-family="ui-monospace,monospace" fill="#A39B8C">'+fmtD(p.date)+'</text>';
  }).join('');
  const dots = points.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p.value)+'" r="2.6" fill="#B04A2B"/>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'"><polygon points="'+areaPts+'" fill="#B04A2B" opacity="0.10"/>'+
    '<polyline points="'+linePts+'" fill="none" stroke="#B04A2B" stroke-width="1.6" stroke-linejoin="round"/>'+
    grid + dots + labels + '</svg>';
}

function legend(items){
  return '<div class="legend">'+items.map(x=>'<span><i style="background:'+x.color+'"></i>'+esc(x.label)+' · '+fmtNum(x.value)+'</span>').join('')+'</div>';
}

function renderInsights(){
  const box = $('#views .view[data-view="insights"]');
  const range = ui.insRange, plat = ui.insPlat;
  const days = range === 30 ? 30 : (range === 7 ? 7 : 0);
  const from = days ? addDays(todayStr(), -(days-1)) : '';
  const inRange = x => !from || (x.date||'') >= from;
  const m = Store.data.metrics.filter(x=>inRange(x) && (plat===ALL || x.platform===plat));
  const mAllPlat = Store.data.metrics.filter(inRange);
  const plays = sum(m, x=>x.plays);
  const likes = sum(m, x=>x.likes);
  const comments = sum(m, x=>x.comments);
  const saves = sum(m, x=>x.saves);
  const shares = sum(m, x=>x.shares);
  const inter = likes + comments + saves + shares;
  const fans = sum(m, x=>x.followers);
  const rate = plays ? (inter / plays * 100) : 0;
  const contents = Store.data.content_items.filter(c=>plat===ALL || c.platform===plat);
  const published = contents.filter(c=>c.stage==='已发布').length;
  const rangeLabel = days ? '近 ' + days + ' 天' : '全部时间';
  const platLabel = plat === ALL ? '全平台' : plat;

  const stageItems = STAGES.map((s,i)=>({
    label:s,
    value: contents.filter(c=>c.stage===s).length,
    color: STAGE_DOT[s] || CHART_COLORS[i%CHART_COLORS.length]
  }));

  const platforms = PLATFORMS.map(p=>{
    const rows = mAllPlat.filter(x=>x.platform===p);
    return { label:p, value: sum(rows, x=>x.plays), color: CHART_COLORS[PLATFORMS.indexOf(p)%CHART_COLORS.length] };
  }).filter(x=>x.value>0);

  const fb = FEEDBACKS.map((f,i)=>({
    label:f,
    value: m.filter(x=>x.feedback===f).length,
    color: CHART_COLORS[i%CHART_COLORS.length]
  }));

  const trendDays = days || 30;
  const dates = [];
  for(let i=trendDays-1;i>=0;i--) dates.push(addDays(todayStr(), -i));
  const trendPoints = dates.map(d=>({ date:d, value: sum(m.filter(x=>x.date===d), x=>x.plays) }));

  const toolbar =

      [7,30,0].map(r=>'<button class="chip'+(range===r?' on':'')+'" data-act="ins-range" data-v="'+r+'">'+(r?('近 '+r+' 天'):'全部')+'</button>').join('')+
      '<span style="width:10px"></span>'+
      [ALL].concat(PLATFORMS).map(p=>'<button class="chip'+(plat===p?' on':'')+'" data-act="ins-plat" data-v="'+esc(p)+'">'+esc(p===ALL?'全平台':p)+'</button>').join('')+

    '</div>';

  if(!m.length){
    box.innerHTML = toolbar + '<div class="card"><div class="empty">'+esc(rangeLabel)+' · '+esc(platLabel)+' 还没有数据，点右上角「记录数据」补一条</div></div>';
    return;
  }

  box.innerHTML = toolbar +
    '<div class="kpis">'+
      '<div class="stat accent"><span class="eyebrow">PLAYS / 播放</span><b>'+fmtNum(plays)+'</b><div class="sub">'+esc(rangeLabel)+' · '+esc(platLabel)+' · '+m.length+' 条记录</div></div>'+
      '<div class="stat"><span class="eyebrow">ENGAGEMENT / 互动</span><b>'+fmtNum(inter)+'</b><div class="sub">赞 '+fmtNum(likes)+' · 评 '+fmtNum(comments)+'</div></div>'+
      '<div class="stat"><span class="eyebrow">RATE / 互动率</span><b>'+rate.toFixed(1)+'<small>%</small></b><div class="sub">收藏 '+fmtNum(saves)+' · 转发 '+fmtNum(shares)+'</div></div>'+
      '<div class="stat"><span class="eyebrow">GROWTH / 新增关注</span><b>'+fmtNum(fans)+'</b><div class="sub">已发布内容 '+published+' 条</div></div>'+
    '</div>'+
    '<div class="chart-grid">'+
      '<div class="card chart-card"><div class="card-h"><h3>内容状态分布</h3><span class="eyebrow">PIPELINE</span></div>'+
        '<div class="card-b">'+donutSVG(stageItems)+legend(stageItems)+'</div></div>'+
      '<div class="card chart-card"><div class="card-h"><h3>渠道播放</h3><span class="eyebrow">BY CHANNEL</span></div>'+
        '<div class="card-b">'+(platforms.length? barsSVG(platforms) : '<div class="empty">暂无播放数据</div>')+'</div></div>'+
      '<div class="card chart-card"><div class="card-h"><h3>反馈分布</h3><span class="eyebrow">FEEDBACK</span></div>'+
        '<div class="card-b">'+barsSVG(fb)+'</div></div>'+

/* ---------- 指标 CSV 粘贴导入（纯本机解析，不联网、不上传） ---------- */
const CSV_COLS = [
  ['date', ['日期','时间','date']],
  ['platform', ['平台','渠道','platform']],
  ['title', ['标题','内容标题','作品标题','笔记标题','title']],
  ['plays', ['播放','播放量','浏览量','曝光','曝光量','阅读','阅读量','plays','views']],
  ['likes', ['点赞','点赞数','赞','likes']],
  ['comments', ['评论','评论数','comments']],
  ['saves', ['收藏','收藏数','saves']],
  ['shares', ['转发','分享','转发数','shares']],
  ['followers', ['涨粉','新增关注','新增粉丝','followers']],
  ['feedback', ['反馈','feedback']]
];
function csvNum(v){
  const s = String(v == null ? '' : v).replace(/[,\s]/g, '');
  const m = s.match(/^(\d+(?:\.\d+)?)([万wW亿]?)/);
  if(!m) return 0;
  const n = Number(m[1]);
  if(!isFinite(n)) return 0;
  return Math.round(m[2] === '亿' ? n * 1e8 : (m[2] ? n * 1e4 : n));
}
function csvDate(v){
  const m = String(v || '').trim().match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  if(!m) return '';
  return m[1] + '-' + pad2(Number(m[2])) + '-' + pad2(Number(m[3]));
}
function csvPlatform(v){
  const s = String(v || '');
  if(/小红书|红书|RED/i.test(s)) return '小红书';
  if(/抖音|douyin/i.test(s)) return '抖音';
  if(/视频号/.test(s)) return '视频号';
  if(/公众号/.test(s)) return '公众号';
  return '';
}
function parseCSVText(text){
  const rows = [];
  let row = [], cell = '', q = false;
  const src = String(text || '').replace(/^\ufeff/, '');
  for(let i = 0; i < src.length; i++){
    const ch = src[i];
    if(q){
      if(ch === '"'){ if(src[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    }else if(ch === '"'){ q = true; }
    else if(ch === ',' || ch === '\t' || ch === ';'){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r'){ cell += ch; }
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
function parseMetricsCSV(text){
  const rows = parseCSVText(text);
  if(!rows.length) return { recs:[], bad:0 };
  const head = rows[0].map(s => String(s).trim().toLowerCase());
  const hasHeader = CSV_COLS.some(c => c[1].some(k => head.indexOf(k.toLowerCase()) > -1));
  const colOf = {};
  let start = 0;
  if(hasHeader){
    CSV_COLS.forEach(c => {
      const i = head.findIndex(h => c[1].some(k => k.toLowerCase() === h));
      if(i > -1) colOf[c[0]] = i;
    });
    start = 1;
  }else{
    /* 无表头时按固定顺序：日期,平台,标题,播放,点赞,评论,收藏,转发,涨粉 */
    ['date','platform','title','plays','likes','comments','saves','shares','followers'].forEach((k, i)=>{ colOf[k] = i; });
  }
  const recs = [];
  let bad = 0;
  for(let r = start; r < rows.length; r++){
    const cells = rows[r];
    const get = k => (colOf[k] == null ? '' : String(cells[colOf[k]] == null ? '' : cells[colOf[k]]).trim());
    const date = csvDate(get('date'));
    if(!date){ bad++; continue; }
    const fb = get('feedback');
    recs.push({
      date,
      platform: csvPlatform(get('platform')) || '小红书',
      title: get('title'),
      plays: csvNum(get('plays')),
      likes: csvNum(get('likes')),
      comments: csvNum(get('comments')),
      saves: csvNum(get('saves')),
      shares: csvNum(get('shares')),
      followers: csvNum(get('followers')),
      feedback: FEEDBACKS.indexOf(fb) > -1 ? fb : '无感'
    });
  }
  return { recs, bad };
}
function openMetricsImport(){
  openModal(
    '<div class="m-head"><div><span class="eyebrow">IMPORT / 指标导入</span><h3>粘贴后台数据</h3>'+
      '<p class="sub">把小红书 / 抖音后台导出的 CSV 整段粘进来。只在本机浏览器解析，不上传。</p></div>'+
      '<button class="m-close" data-close aria-label="关闭">'+icon('x')+'</button></div>'+
    '<div class="m-body">'+
      '<textarea id="csvBox" rows="9" placeholder="日期,平台,标题,播放,点赞,评论,收藏,转发,涨粉&#10;2026-11-01,小红书,示例标题,12800,860,42,310,26,18" '+
        'style="width:100%;resize:vertical;border:1px solid var(--line);background:var(--card2);border-radius:3px;padding:9px 10px;font-family:var(--mono);font-size:11px;line-height:1.7;outline:none"></textarea>'+
      '<p class="hint" style="margin-top:10px;line-height:1.9">支持逗号 / 制表符 / 分号分隔，带不带表头都行，数字可写 1.2万。'+
        '日期、平台、标题都相同的记录会跳过，不会重复入库。</p>'+
    '</div>'+
    '<div class="m-foot"><button class="btn" data-close>取消</button>'+
      '<button class="btn primary" id="csvOk">解析并导入</button></div>', true);
  $('#csvOk').onclick = ()=>{
    const { recs, bad } = parseMetricsCSV($('#csvBox').value || '');
    if(!recs.length){ toast('没解析到有效行，检查一下日期列', true); return; }
    const seen = new Set(Store.data.metrics.map(x => (x.date||'') + '|' + (x.platform||'') + '|' + (x.title||'')));
    const fresh = recs.filter(r=>{
      const k = r.date + '|' + r.platform + '|' + r.title;
      if(seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    if(!fresh.length){ toast('这些记录都已经在库里了'); return; }
    const now = new Date().toISOString();
    Store.data.metrics = Store.data.metrics.concat(fresh.map(r => Object.assign({ id:uid(), created_at:now, updated_at:now }, r)));
    if(Store.mode === 'cloud') schedulePush(); else if(Store.mode === 'local') lsWrite(Store.data);
    Store.fp = fpOf(Store.data);
    renderAll();
    closeModal();
    toast('已导入 ' + fresh.length + ' 条' +
      (recs.length - fresh.length ? '，跳过 ' + (recs.length - fresh.length) + ' 条重复' : '') +
      (bad ? '，' + bad + ' 行日期无法识别' : ''));
  };
  setTimeout(()=>{ const t = $('#csvBox'); if(t && window.innerWidth > 820) t.focus(); }, 40);
}

function aiProvider(){ const p = aiLS(AI_PROVIDER_LS, 'dashscope'); return AI_PRESET[p] ? p : 'dashscope'; }
function aiCfg(){
  const p = aiProvider();
  const pre = AI_PRESET[p];
  return {
    provider: p,
    url: p === 'custom' ? aiLS(AI_URL_LS, '') : pre.url,
    model: aiLS(AI_MODEL_LS, '') || pre.model,
    key: aiLS(AI_KEY_LS, '')
  };
}
function aiKey(){ return aiCfg().key; }
function aiModel(){ return aiCfg().model; }

function aiKindOf(x){
  const cat = (x.category || '') + ',' + (x.tags || '');
  if(x.kind === '素材') return '拍摄素材清单';
  if(/穿搭|配饰/.test(cat)) return '小红书图文';
  if(/日常|好物|玄学/.test(cat)) return '短视频口播';
  return '小红书图文';
}

function aiPrompt(x, kind, extra){
  const shape = kind === '短视频口播'
    ? '【开场 3 秒】一句钩子\n【分镜】3-4 个镜头，每个写「画面 + 口播」\n【结尾】一句互动提问'
    : kind === '拍摄素材清单'
    ? '【必拍画面】6-8 条，写清拍什么\n【机位与光线】3 条\n【道具】清单\n【注意】版权与肖像提示'
    : '【标题备选】3 条，每条不超过 20 字\n【正文】300-500 字，分 3-5 段，第一句是钩子\n【标签】3-5 个，用 # 开头\n【互动】一句提问，放在正文最后';
  return '你是自媒体账号「枕冬」的写作助手。账号定位：日常、玄学短句、小确幸好物（小物件）三类，语气像朋友聊天。\n' +
    '选题：' + (x.title || '') + '\n' +
    '类型：' + (x.kind || '选题') + '｜分类：' + (x.category || '未分类') + '｜平台：' + (x.platform || '小红书') + '\n' +
    '标签：' + (x.tags || '无') + '\n' +
    '参考备注：' + (x.note || '无') + '\n' +
    '稿件类型：' + kind + '\n' +
    (extra ? '额外要求：' + extra + '\n' : '') +
    '\n输出结构：\n' + shape + '\n\n' +
    '硬性要求：\n' +
    '1. 简体中文，短句，口语化，避免书面腔和空洞形容词\n' +
    '2. 不虚构销量、库存、粉丝数、平台数据、他人评价\n' +
    '3. 不使用「最」「第一」「绝对」「全网最低」「顶级」等绝对化用语\n' +
    '4. 不承诺任何效果，不做健康、财运、感情方面的指导\n' +
    '5. 不编造具体品牌、价格、地址\n' +
    '6. 最后单独一行写「（草稿，待人工确认）」\n' +
    '只输出稿件正文，不要解释思路。';
}

function localDraft(x, kind, extra){
  const t = x.title || '未命名选题';
  const tg = (x.tags || '').split(',').map(s=>s.trim()).filter(Boolean);
  const tail = '\n\n' + (tg.length ? '# ' + tg.map(s=>'#'+s).join(' ') + '\n\n' : '') +
    (extra ? '（你的额外要求：' + extra + '）\n\n' : '') + '（草稿，待人工确认）';
  if(kind === '短视频口播'){
    return '【开场 3 秒】\n（写一句让人停下来的话，围绕「' + t + '」）\n\n' +
      '【分镜】\n1. 画面：…　口播：…\n2. 画面：…　口播：…\n3. 画面：…　口播：…\n\n' +
      '【结尾】\n（一句提问，引导评论）' + tail;
  }
  if(kind === '拍摄素材清单'){
    return '【必拍画面】\n1. …\n2. …\n3. …\n4. …\n5. …\n6. …\n\n' +
      '【机位与光线】\n1. …\n2. …\n3. …\n\n' +
      '【道具】\n- …\n- …\n\n' +
      '【注意】画面前请确认授权，避免出现他人正脸与可识别的私人空间' + tail;
  }
  return '【标题备选】\n1. …\n2. …\n3. …\n\n' +
    '【正文】\n（第一段：钩子，围绕「' + t + '」）\n\n（第二段：具体场景和细节）\n\n（第三段：一点自己的感受或反转）\n\n【互动】\n（一句提问，引导评论）' + tail;
}

async function callAI(prompt, opt){
  const cfg = aiCfg();
  const key = (opt && opt.key) || cfg.key;
  const model = (opt && opt.model) || cfg.model;
  const url = (opt && opt.url) || cfg.url;
  if(!url) throw new Error('接口地址为空');
  let res;
  try{
    res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
      body: JSON.stringify({
        model,
        messages:[{ role:'user', content: prompt }],
        temperature: 0.8,
        max_tokens: 1200
      })
    });
  }catch(err){
    throw new Error('网络或跨域失败，检查网络或换一个服务商');
  }
  if(!res.ok){
    let raw = '';
    try{
      const j = await res.json();
      raw = (j && j.error && j.error.message) || (j && j.message) || '';
    }catch(e){}
    if(res.status === 401) throw new Error('Key 无效或已过期（HTTP 401）');
    throw new Error('HTTP ' + res.status + (raw ? ' · ' + raw : ''));
  }
  const j = await res.json();
  const txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
  if(!txt) throw new Error('模型没有返回内容');
  return txt;
}
