function goView(key, push){
  if(!NAV.some(n=>n.key===key)) key = 'today';
  if(push && location.hash !== '#/' + key){
    location.hash = '#/' + key;
    return;
  }
  if(ui.view === key){
    renderNav(); updateHeader();
    return;
  }
  ui.view = key;
  renderNav();
  updateHeader();
}

window.addEventListener('hashchange', ()=>{
  const k = location.hash.replace(/^#\/?/, '');
  if(k && NAV.some(n=>n.key===k)) goView(k, false);
});

document.addEventListener('change', e=>{
  if(e.target.id === 'platFilter'){
    ui.contentPlatform = e.target.value;
    renderContent();
  }
});

document.addEventListener('click', async e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ goView(nav.dataset.nav, true); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  try{
    switch(act){
      case 'toggle-todo': {
        const ev = Store.data.schedule.find(x=>x.id===id);
        if(ev){
          await updateRow('schedule', id, { status: ev.status==='完成' ? '待办' : '完成' });
          renderAll();
        }
        break;
      }
      case 'filter-stage':
        ui.contentStage = el.dataset.v;
        renderContent();
        break;
      case 'new-content':
        openContentForm(null, el.dataset.stage || '文案');
        break;
      case 'copy-content': {
        const c = Store.data.content_items.find(x=>x.id===id);
        if(c) copyText(contentText(c));
        break;
      }
      case 'edit-content': {
        const c = Store.data.content_items.find(x=>x.id===id);
        if(c) openContentForm(c);
        break;
      }
      case 'advance-content':
        await advanceContent(id);
        break;
      case 'del-content': {
        const c = Store.data.content_items.find(x=>x.id===id);
        confirmAction({
          title:'删除这条内容？',
          body:'将删除「' + (c ? c.title : '') + '」。此操作同步写回数据表，删除后无法在页面恢复。',
          onOk: async ()=>{ await deleteRow('content_items', id, '内容'); renderAll(); }
        });
        break;
      }
      case 'pick-deal': {
        const i = Number(el.dataset.i) || 0;
        if(i === ui.dealIndex){
          const cur = Store.data.deals[i];
          if(cur) openDeal(cur.id);
        }else{
          ui.dealIndex = i;
          applyFan();
        }
        break;
      }
      case 'deal-prev':
        if(!Store.data.deals.length) break;
        ui.dealIndex = (ui.dealIndex - 1 + Store.data.deals.length) % Store.data.deals.length;
        applyFan();
        break;
      case 'deal-next':
        if(!Store.data.deals.length) break;
        ui.dealIndex = (ui.dealIndex + 1) % Store.data.deals.length;
        applyFan();
        break;
      case 'open-deal':
        openDeal(id);
        break;
      case 'edit-deal': {
        const d = Store.data.deals.find(x=>x.id===id);
        if(d) openDealForm(d);
        break;
      }
      case 'deal-schedule':
        await addDealToSchedule(id);
        break;
      case 'del-deal': {
        const d = Store.data.deals.find(x=>x.id===id);
        confirmAction({
          title:'删除这个商单？',
          body:'将删除「' + (d ? d.brand : '') + '」及其金额、交付记录。该操作不可撤销。',
          onOk: async ()=>{ await deleteRow('deals', id, '商单'); renderAll(); }
        });
        break;
      }
      case 'sched-shift':
        ui.schedStart = addDays(ui.schedStart || weekStart(todayStr()), Number(el.dataset.n));
        renderSchedule();
        break;
      case 'sched-today':
        ui.schedStart = weekStart(todayStr());
        renderSchedule();
        break;
      case 'open-day':
        openDay(el.dataset.date);
        break;
      case 'new-event':
        openEventForm(null, el.dataset.date);
        break;
      case 'edit-event': {
        const ev = Store.data.schedule.find(x=>x.id===id);

        break;

      case 'del-event': {
        const ev = Store.data.schedule.find(x=>x.id===id);

          title:'删除这项安排？',
          body:'将删除「' + (ev ? ev.title : '') + '」的排期，删除后不可恢复。',
          onOk: async ()=>{ await deleteRow('schedule', id, '安排'); renderAll(); }
        });
        break;
      }
      case 'open-data': { openDataPanel(); break; }
      case 'new-deal': { openDealForm(null); break; }
      case 'backup-now': { exportJSON(); break; }
      case 'tpl-download': { downloadTemplate(); break; }
      case 'csv-import': { openMetricsImport(); break; }
      case 'quick-todo': { openQuickTodo(quickText()); break; }
      case 'quick-content': { openQuickContent(quickText()); break; }
      case 'quick-deal': { openQuickDeal(quickText()); break; }
      case 'ins-range': {
        ui.insRange = Number(el.dataset.v);
        renderInsights();
        break;
      }
      case 'ins-plat': {
        ui.insPlat = el.dataset.v;
        renderInsights();
        break;
      }
      case 'edit-metric': {
        const mt = Store.data.metrics.find(x=>x.id===id);
        if(mt) openMetricForm(mt);
        break;
      }
      case 'del-metric': {
        const mt = Store.data.metrics.find(x=>x.id===id);
        confirmAction({
          title:'删除这条数据？',
          body:'将删除 ' + (mt ? mt.date + ' · ' + mt.platform : '该记录') + '，删除后不可恢复。',
          onOk: async ()=>{ await deleteRow('metrics', id, '记录'); renderAll(); }
        });
        break;
      }
      case 'lib-tab':
        ui.libKind = el.dataset.v;
        renderLibrary();
        break;
      case 'lib-status':
        ui.libStatus = el.dataset.v;
        renderLibrary();
        break;
      case 'idea-preview': {
        if(e.target.closest('a')) break;
        openIdeaPreview(id);
        break;
      }
      case 'idea-draft': {
        const it = Store.data.ideas.find(x=>x.id===id);
        if(it) openIdeaDraft(id);
        break;
      }
      case 'swap-status': {
        const it = Store.data.ideas.find(x=>x.id===id);
        if(it) openStatusSwap(id);
        break;
      }
      case 'swap-tags': {
        const it = Store.data.ideas.find(x=>x.id===id);
        if(it) openTagSwap(id);
        break;
      }
      case 'edit-idea': {
        const it = Store.data.ideas.find(x=>x.id===id);
        if(it) openIdeaForm(it);
        break;
      }
      case 'idea-to-content':
        await ideaToContent(id);
        break;
      case 'del-idea': {
        const it = Store.data.ideas.find(x=>x.id===id);
        confirmAction({
          title:'删除这条选题？',
          body:'将删除「' + (it ? it.title : '') + '」。该操作不可撤销。',
          onOk: async ()=>{ await deleteRow('ideas', id, '选题'); renderAll(); }
        });
        break;
      }
    }
  }catch(err){
    toast((err && err.message) || '操作失败', true);
  }
});

$('#newBtn').addEventListener('click', ()=>{
  if(ui.view === 'today') openEventForm(null, todayStr());
  else if(ui.view === 'content') openContentForm(null, '文案');
  else if(ui.view === 'deals') openDealForm(null);
  else if(ui.view === 'schedule') openEventForm(null, todayStr());
  else if(ui.view === 'insights') openMetricForm();
  else if(ui.view === 'library') openIdeaForm(null);
});

$('#dataBtn').addEventListener('click', openDataPanel);
$('#aiBtn').addEventListener('click', openAIPanel);

/* ---------- 星球黑洞：点击后才加载 three.js，关闭即卸载 ---------- */
(function initBlackhole(){
  const overlay = $('#bhOverlay'), frame = $('#bhFrame');
  const entry = $('#bhEntry'), closeBtn = $('#bhClose');
  if(!overlay || !frame || !entry || !closeBtn) return;
  function show(){
    if(!frame.getAttribute('src')) frame.src = './blackhole/index.html';
    overlay.hidden = false;
    document.body.classList.add('bh-open');
    closeBtn.focus();
  }
  function hide(){
    overlay.hidden = true;
    document.body.classList.remove('bh-open');
    frame.src = 'about:blank';
    entry.focus();
  }
  entry.addEventListener('click', show);
  closeBtn.addEventListener('click', hide);
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && !overlay.hidden) hide();
  });
})();
$('#mAI').addEventListener('click', ()=>{ $('#moreMenu').classList.remove('open'); openAIPanel(); });
$('#mData').addEventListener('click', ()=>{ $('#moreMenu').classList.remove('open'); openDataPanel(); });
$('#moreBtn').addEventListener('click', ev=>{
  ev.stopPropagation();
  $('#moreMenu').classList.toggle('open');
});
document.addEventListener('click', ev=>{
  if(!ev.target.closest('.more-wrap')) $('#moreMenu').classList.remove('open');
});
$('#sync').addEventListener('click', ()=>{
  if(Store.mode === 'cloud') syncNow(true);
  else openDataPanel();
});

/* ================= 启动 ================= */
function registerSW(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

async function init(){
  const initial = location.hash.replace(/^#\/?/, '');
  if(NAV.some(n=>n.key===initial)) ui.view = initial;
  ui.schedStart = weekStart(todayStr());
  renderNav();
  updateHeader();
  tickClock();
  setInterval(tickClock, 30000);

  try{
    await loadAll();
    setSyncState('ok');
  }catch(err){
    CLOUD = false;
    Store.mode = 'local';
    Store.data = lsRead();
    Store.fp = fpOf(Store.data);
    setSyncState('warn', '云端不可用');
    toast('云端连接失败，已切回本地数据（可点右上角「数据」重连）', true);
  }
  renderAll();

  if(Store.mode === 'local'){
    try{
      if(!localStorage.getItem(LOCAL_NOTICE_KEY)){
        localStorage.setItem(LOCAL_NOTICE_KEY, '1');
        setTimeout(()=>toast('本地模式：数据只在这台设备，换设备前请先导出备份'), 900);
      }
    }catch(e){}
  }

  setInterval(()=>{
    if(!document.hidden) syncNow(false);
  }, 45000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncNow(false); });
  let rsT;
  let lastNar = narrowView();
  window.addEventListener('resize', ()=>{
    clearTimeout(rsT);
    rsT = setTimeout(()=>{
      const nar = narrowView();
      if(nar !== lastNar){ lastNar = nar; renderAll(); return; }
      if(ui.view==='deals') applyFan();
    }, 200);
  });

  /* 商单扇形：左右滑动切换 + 键盘左右键 */
  let swX = 0, swY = 0, swT = 0, swMoved = false;
  document.addEventListener('touchstart', e=>{
    if(!e.target.closest('.fan-stage') || e.touches.length !== 1) return;
    swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now(); swMoved = false;
  }, { passive: true });
  document.addEventListener('touchend', e=>{
    if(!swT || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - swX;
    const dy = e.changedTouches[0].clientY - swY;
    const fresh = Date.now() - swT < 700;
    swT = 0;
    if(!fresh || Math.abs(dx) < 38 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    const n = Store.data.deals.length;
    if(!n) return;
    swMoved = true;
    ui.dealIndex = (ui.dealIndex + (dx < 0 ? 1 : -1) + n) % n;
    applyFan();
  }, { passive: true });
  document.addEventListener('click', e=>{
    if(swMoved && e.target.closest('.fan-stage')){
      swMoved = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);
  document.addEventListener('keydown', e=>{
    if(ui.view !== 'deals' || document.querySelector('dialog[open]')) return;
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const n = Store.data.deals.length;
    if(!n) return;
    ui.dealIndex = (ui.dealIndex + (e.key === 'ArrowRight' ? 1 : -1) + n) % n;
    applyFan();
  });

  window.addEventListener('storage', e=>{
    if(e.key === LS_KEY) syncNow(false);
  });

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitDialog);
    window.visualViewport.addEventListener('scroll', fitDialog);
  }
  document.addEventListener('focusin', e=>{ if(e.target.closest('dialog')) setTimeout(fitDialog, 120); });
  document.addEventListener('focusout', e=>{ if(e.target.closest('dialog')) setTimeout(fitDialog, 120); });
  registerSW();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
