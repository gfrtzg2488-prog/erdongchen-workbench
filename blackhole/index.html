<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<link rel="icon" href="data:,">
<title>黑洞吸积盘 · 3D 预览</title>
<style>
  :root{
    --bg:#05060A;
    --panel-bg:rgba(9,11,16,.93);
    --line:rgba(255,255,255,.08);
    --text:#E8E4DA;
    --muted:#8A919C;
    --faint:#666D78;
    --accent:#E08A4C;
    --ok:#4AD07A;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  body{
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;top:0;left:0;display:block;outline:none;touch-action:none}

  /* ---------- file:// 提示 ---------- */
  #protocol-tip{
    display:none;
    position:fixed;z-index:60;top:0;left:0;right:0;
    padding:12px 18px;
    background:#5A1D12;color:#FFD9C9;
    border-bottom:1px solid #8A3A28;
    font-size:13px;line-height:1.6;text-align:center;
  }
  html.file-protocol #protocol-tip{display:block}

  /* ---------- 右侧面板 ---------- */
  #panel{
    position:fixed;top:0;right:0;bottom:0;width:300px;z-index:20;
    display:flex;flex-direction:column;
    background:var(--panel-bg);
    border-left:1px solid var(--line);
    -webkit-backdrop-filter:blur(16px) saturate(120%);
    backdrop-filter:blur(16px) saturate(120%);
    transition:transform .4s cubic-bezier(.2,.7,.2,1);
  }
  body.panel-hidden #panel{transform:translateX(100%)}

  .panel-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:20px 16px 14px;border-bottom:1px solid var(--line);
  }
  .eyebrow{
    margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);
  }
  .panel-head h1{margin:4px 0 0;font-size:14px;font-weight:600;letter-spacing:.06em}

  .icon-btn{
    flex:none;width:26px;height:26px;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.14);border-radius:4px;
    background:rgba(255,255,255,.04);color:#C9CDD6;
    font-size:13px;line-height:1;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24)}

  .panel-body{
    flex:1;overflow-y:auto;padding:6px 16px 24px;
    scrollbar-width:thin;scrollbar-color:#2A2E38 transparent;
  }
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:#242832;border-radius:3px}

  .panel-body h2{
    margin:20px 0 9px;font-family:var(--mono);font-size:9px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  }

  /* 里程碑 */
  .milestones{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .milestones li{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#C8CCD4}
  .milestones .dot{
    flex:none;width:6px;height:6px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 8px rgba(74,208,122,.65);
  }
  .milestones .mid{flex:none;width:18px;font-family:var(--mono);font-size:9px;color:var(--faint)}

  /* 实时指标 */
  .metrics{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .metrics > div{
    padding:8px 9px;border:1px solid rgba(255,255,255,.055);border-radius:4px;
    background:rgba(255,255,255,.035);
  }
  .metrics dt{font-size:9.5px;letter-spacing:.05em;color:var(--muted)}
  .metrics dd{
    margin:3px 0 0;font-family:var(--mono);font-size:14px;color:#F2ECE0;
    font-variant-numeric:tabular-nums;
  }

  /* 物理参数 */
  .params{margin:0;display:flex;flex-direction:column}
  .params > div{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.055);
  }
  .params dt{font-size:10.5px;color:var(--muted)}
  .params dd{margin:0;font-family:var(--mono);font-size:10.5px;color:#D6D0C2;font-variant-numeric:tabular-nums}

  .notice{
    margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line);
    font-size:10px;line-height:1.7;color:var(--faint);
  }

  /* 打开面板按钮 */
  #panel-open{
    display:none;position:fixed;top:14px;right:14px;z-index:21;
    padding:7px 12px;border-radius:4px;border:1px solid var(--line);
    background:rgba(10,12,18,.85);color:var(--text);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  #panel-open:hover{border-color:rgba(255,255,255,.22)}
  body.panel-hidden #panel-open{display:block}

  @media (max-width:820px){
    #panel{width:min(86vw,320px)}
    .panel-head{padding-top:18px}
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="protocol-tip">
    必须通过 http:// 方式打开：file:// 无法加载 ES 模块。请双击目录中的「启动预览.bat」后访问 http://localhost:8123/
  </div>

  <button id="panel-open" type="button" aria-label="打开过程面板">过程面板</button>

  <aside id="panel" aria-label="过程面板">
    <header class="panel-head">
      <div>
        <p class="eyebrow">BLACK HOLE / ACCRETION</p>
        <h1>吸积盘 3D 预览</h1>
      </div>
      <button id="panel-collapse" class="icon-btn" type="button" aria-label="折叠面板" title="折叠面板">›</button>
    </header>

    <div class="panel-body">
      <section>
        <h2>里程碑</h2>
        <ul id="milestones" class="milestones"></ul>
      </section>

      <section>
        <h2>实时指标</h2>
        <dl class="metrics">
          <div><dt>FPS</dt><dd id="m-fps">–</dd></div>
          <div><dt>粒子数</dt><dd id="m-particles">–</dd></div>
          <div><dt>物理积分</dt><dd id="m-physics">–</dd></div>
          <div><dt>Draw calls</dt><dd id="m-calls">–</dd></div>
        </dl>
      </section>

      <section>
        <h2>物理参数</h2>
        <dl class="params">
          <div><dt>史瓦西半径 rs</dt><dd id="p-rs">–</dd></div>
          <div><dt>GM</dt><dd id="p-gm">–</dd></div>
          <div><dt>盘范围 r</dt><dd id="p-range">–</dd></div>
          <div><dt>积分方法</dt><dd>半隐式欧拉 ×2</dd></div>
        </dl>
      </section>

      <p class="notice" id="quality-note">移动端为降级画质</p>
    </div>
  </aside>

  <script>
    if (location.protocol === 'file:') {
      document.documentElement.classList.add('file-protocol');
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "lil-gui": "./vendor/lil-gui.esm.js"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
