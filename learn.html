function xmlEsc(v){
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xlCell(v, isNum){
  if(isNum && v !== '' && v != null && !isNaN(Number(v))){
    return '<Cell><Data ss:Type="Number">' + Number(v) + '</Data></Cell>';
  }
  return '<Cell><Data ss:Type="String">' + xmlEsc(v) + '</Data></Cell>';
}
function exportExcel(){
  const modName = id=>{ const m = modOf(id); return m ? m.title : ''; };
  const unitName = id=>{ const u = unitOf(id); return u ? u.title : ''; };
  const pracName = id=>{ const p = practiceOf(id); return p ? p.title : ''; };
  const sheets = [
    {name:'模块', head:['编号','标题','英文','说明'], rows:sortedModules().map(m=>[m.id,m.title,m.en,m.summary])},
    {name:'单元', head:['模块','标题','目标','要点','学时','状态','笔记'], rows:Store.data.units.map(u=>[modName(u.module_id),u.title,u.goal,String(u.points || '').replace(/\n/g,' / '),Number(u.hours) || 0,u.status,u.notes])},
    {name:'实操', head:['模块','单元','标题','动作','交付物','截止日','状态','备注'], rows:Store.data.practices.map(p=>[modName(p.module_id),unitName(p.unit_id),p.title,p.action,p.deliverable,p.due_date,p.status,p.notes])},
    {name:'结果', head:['实操','标题','指标','目标','实际','结论','日期','证据','备注'], rows:Store.data.results.map(r=>[pracName(r.practice_id),r.title,r.metric,r.target,r.actual,r.verdict,r.date,r.evidence,r.notes])},
    {name:'复盘', head:['范围','对象','日期','评分','保留','改进','下一步','备注'], rows:Store.data.reviews.map(v=>[v.scope,v.ref_title,v.date,Number(v.score) || 0,v.kept,v.improve,v.next,v.notes])},
    {name:'归档', head:['日期','标题','范围','格式','单元','实操','结果','复盘','备注'], rows:Store.data.archives.map(a=>[a.date,a.title,a.scope,(a.formats || []).join('、'),a.counts ? (a.counts.units || 0) : 0,a.counts ? (a.counts.practices || 0) : 0,a.counts ? (a.counts.results || 0) : 0,a.counts ? (a.counts.reviews || 0) : 0,a.notes])}
  ];
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel">';
  sheets.forEach(s=>{
    xml += '<Worksheet ss:Name="' + xmlEsc(s.name) + '"><Table>';
    xml += '<Row>' + s.head.map(h=>xlCell(h, false)).join('') + '</Row>';
    s.rows.forEach(r=>{ xml += '<Row>' + r.map(v=>xlCell(v, typeof v === 'number')).join('') + '</Row>'; });
    xml += '</Table></Worksheet>';
  });
  xml += '</Workbook>';
  downloadFile('zhuji-tables-' + todayStr() + '.xls', xml, 'application/vnd.ms-excel;charset=utf-8');

function doExport(format){
  const scope = (format === 'JSON' || format === 'Excel') ? 'all' : ui.archiveScope;
  if(format === 'Markdown'){
    downloadFile('zhuji-archive-' + todayStr() + '.md', buildMarkdown(scope), 'text/markdown;charset=utf-8');
  }else if(format === 'JSON'){
    exportJSON();
  }else if(format === 'Excel'){
    exportExcel();
  }else if(format === 'Report'){
    if(!openReport(scope)) return;
  }
  logArchive(format === 'Report' ? '报告' : format, scope);
  toast('已生成' + (format === 'Report' ? '可打印报告' : format === 'Markdown' ? ' Markdown 归档' : format === 'JSON' ? ' JSON 备份' : ' Excel 表格'));
}

/* ================= 数据操作 ================= */
function doImport(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const j = JSON.parse(String(reader.result));
      const d = j && j.tables ? j.tables : j;
      if(!d || !Array.isArray(d.units)) throw new Error('未找到学习数据（缺少 units）');
      Store.data = normalize(d);
      ensureModules();
      save();
      renderAll();
      toast('已导入：单元 ' + Store.data.units.length + ' 条');
    }catch(err){
      toast('导入失败：' + err.message, true);
    }finally{
      const inp = $('#fileIn');
      if(inp) inp.value = '';
    }
  };
  reader.readAsText(file);
}
function restoreFramework(){
  const now = new Date().toISOString();
  let addM = 0, addU = 0;
  MODULES_SEED.forEach((m,i)=>{
    if(!Store.data.modules.some(x=>x.id === m.id)){
      Store.data.modules.push(Object.assign({}, m, {order:i+1, builtin:true}));
      addM++;
    }
  });
  UNIT_SEED.forEach((u,i)=>{
    if(!Store.data.units.some(x=>x.id === u.id)){
      Store.data.units.push(Object.assign({}, u, {status:'未开始', notes:'', order:i+1, created_at:now, updated_at:now}));
      addU++;
    }
  });
  save(); renderAll();
  toast('已补齐 ' + addM + ' 个模块、' + addU + ' 个单元');
}
function clearRecords(){
  const ans = prompt('这会清空实操、结果、复盘与归档日志，并把课程单元恢复为「未开始」。\n请输入「清空」继续：');
  if(ans !== '清空'){ toast('已取消'); return; }
  const now = new Date().toISOString();
  Store.data.units = UNIT_SEED.map((u,i)=>Object.assign({}, u, {
    status:'未开始', notes:'', order:i+1, created_at:now, updated_at:now
  }));
  Store.data.practices = [];
  Store.data.results = [];
  Store.data.reviews = [];
  Store.data.archives = [];
  ensureModules();
  save(); renderAll();
  toast('已清空学习记录，课程框架保留');
}

/* ================= 事件 ================= */
document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id || '';

  switch(act){
    case 'quick-add': quickAdd(); break;
    case 'u-status': ui.status = el.dataset.v; renderCurriculum(); break;
    case 'r-filter': ui.result = el.dataset.v; renderResults(); break;
    case 'toggle-points': ui.openUnits[id] = !ui.openUnits[id]; renderCurriculumList(); break;
    case 'open-lecture': openLecture(id); break;
    case 'start-unit': updateRow('units', id, {status:'学习中'}); renderAll(); toast('已开始学习'); break;
    case 'finish-unit': updateRow('units', id, {status:'已学完'}); renderAll(); toast('已标记学完'); break;
    case 'edit-unit': { const u = unitOf(id); if(u) openUnitForm(u); break; }
    case 'add-unit': openUnitForm(null, id); break;
    case 'new-unit': openUnitForm(null, null); break;
    case 'practice-from-unit': {
      const u = unitOf(id);
      if(u) openPracticeForm(null, {title:'实操：' + u.title, unit_id:u.id, module_id:u.module_id, due_date:addDays(todayStr(),7)});
      break;
    }
    case 'review-module': {
      const m = modOf(id);
      if(m) openReviewForm(null, {ref:'模块::' + m.id + '::' + m.title});
      break;
    }
    case 'open-module': {
      ui.view = 'curriculum'; ui.status = ALL; ui.search = ''; ui.module = id;
      if(location.hash !== '#/curriculum') location.hash = '#/curriculum';
      renderAll();
      setTimeout(()=>{ const box = document.getElementById('mod-' + id); if(box) box.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
      break;
    }
    case 'new-practice': openPracticeForm(); break;
    case 'edit-practice': { const p = practiceOf(id); if(p) openPracticeForm(p); break; }
    case 'del-practice': {
      const p = practiceOf(id);
      if(p && confirm('确定删除实操「' + p.title + '」？')){ deleteRow('practices', id); renderAll(); toast('已删除实操'); }
      break;
    }
    case 'finish-practice': updateRow('practices', id, {status:'已完成'}); renderAll(); toast('已标记完成'); break;
    case 'result-from-practice': openResultForm(null, id); break;
    case 'new-result': openResultForm(); break;
    case 'edit-result': { const r = Store.data.results.find(x=>x.id === id); if(r) openResultForm(r); break; }
    case 'review-practice': {
      const p = practiceOf(id);
      if(p) openReviewForm(null, {ref:'实操::' + p.id + '::' + p.title});
      else openReviewForm();
      break;
    }
    case 'new-review': openReviewForm(); break;
    case 'edit-review': { const v = Store.data.reviews.find(x=>x.id === id); if(v) openReviewForm(v); break; }
    case 'del-review': {
      if(confirm('确定删除这条复盘？')){ deleteRow('reviews', id); renderAll(); toast('已删除复盘'); }
      break;
    }
    case 'export-md': doExport('Markdown'); break;
    case 'export-report': doExport('Report'); break;
    case 'export-json': doExport('JSON'); break;
    case 'export-xls': doExport('Excel'); break;
    case 'import-json': { const inp = $('#fileIn'); if(inp) inp.click(); break; }
    case 'restore-framework': restoreFramework(); break;
    case 'clear-records': clearRecords(); break;
    case 'del-archive': {
      if(confirm('确定删除这条归档日志？不会删除已导出的文件。')){ deleteRow('archives', id); renderArchive(); renderNav(); toast('已删除日志'); }
      break;
    }
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && e.target && e.target.id === 'qkInput'){
    e.preventDefault();
    quickAdd();
  }
});

const fileIn = $('#fileIn');
if(fileIn){
  fileIn.addEventListener('change', e=>{
    const f = e.target.files && e.target.files[0];
    if(f) doImport(f);
  });
}

const dataBtn = $('#dataBtn');
if(dataBtn){
  dataBtn.onclick = ()=>{
    go('archive');
    setTimeout(()=>{ const el = $('#dataPanel'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 90);
  };
}

window.addEventListener('hashchange', ()=>{
  const k = location.hash.replace(/^#\/?/, '');
  if(NAV.some(n=>n.key === k)){
    ui.view = k;
    renderAll();
  }
});
window.addEventListener('storage', e=>{
  if(e.key === LS_KEY){
    Store.data = lsRead();
    ensureModules();
    renderAll();
  }
});

/* ================= 启动 ================= */
function init(){
  const initial = location.hash.replace(/^#\/?/, '');
  if(NAV.some(n=>n.key === initial)) ui.view = initial;
  Store.data = lsRead();
  ensureModules();
  save();
  renderAll();
  tickClock();
  setInterval(tickClock, 30000);
}
init();
</script>
</body>
</html>
