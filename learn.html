<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>筑基 · 创业学习工作台</title>
<meta name="theme-color" content="#F3F4F6">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#F3F4F6;--card:#FFFFFF;--card2:#F9FAFB;--ink:#0B1215;--ink2:#F3F4F6;
  --text:#1F2933;--muted:#6A7282;--faint:#99A1AF;--line:#E5E7EB;--line2:#EEF0F3;
  --accent:#174E4F;--accent-ink:#FFFFFF;--accent-soft:rgba(23,78,79,.08);
  --sage:#00A63E;--sage-soft:rgba(0,166,62,.10);
  --amber:#B27B00;--amber-soft:rgba(252,200,0,.18);
  --plum:#7C6BD6;--plum-soft:rgba(124,107,214,.10);
  --danger:#E7000B;--danger-soft:rgba(231,0,11,.08);--slate:#99A1AF;--coral:#00A63E;
  --rail-bg:#FFFFFF;--rail-bg2:#FFFFFF;--rail-text:#174E4F;--rail-muted:#6A7282;--rail-line:#EEF0F3;
  --r:14px;--sidebar:244px;--ff:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--ff);font-size:13px;line-height:1.58;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
::selection{background:var(--accent);color:#fff}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid rgba(23,78,79,.45);outline-offset:2px}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#D1D5DC;border-radius:10px;border:2px solid var(--paper)}
*::-webkit-scrollbar-thumb:hover{background:#99A1AF}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 侧栏（白色 B 端） ---------- */
.rail{position:sticky;top:0;height:100vh;background:var(--card);color:var(--rail-text);display:flex;flex-direction:column;padding:22px 14px 18px;gap:18px;z-index:20;border-right:1px solid var(--line);box-shadow:none}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line);position:relative}
.brand b{display:flex;align-items:center;gap:9px;font-family:var(--ff);font-size:21px;font-weight:700;letter-spacing:.08em;line-height:1.15;color:var(--ink)}
.brand b::before{content:"";width:27px;height:27px;border-radius:9px;background:linear-gradient(145deg,#1E6364,#174E4F);box-shadow:inset -7px -7px 0 rgba(255,255,255,.16);flex:none}
.brand span{display:block;margin-top:8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--faint)}
.brand::after{display:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;padding:13px 12px 5px}
.nav-label:first-child{padding-top:0}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--muted);font-size:12.5px;text-align:left;transition:background .16s,color .16s;border-left:0}
.nav button svg{width:16px;height:16px;flex:none;opacity:.85}
.nav button:hover{background:var(--card2);color:var(--ink)}
.nav button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px -10px rgba(23,78,79,.5)}
.nav button.on svg{opacity:1;color:#fff}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--muted);background:var(--card2);padding:1px 7px;border-radius:20px}
.nav button.on .count{background:rgba(255,255,255,.18);color:#fff}
.rail-foot{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-family:var(--mono);font-size:9.5px;line-height:1.9;color:var(--muted);letter-spacing:.04em}
.rail-foot b{color:var(--ink);font-weight:600}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage);margin-right:5px;vertical-align:1px;box-shadow:0 0 0 3px rgba(0,166,62,.14)}

/* ---------- 主区 ---------- */
main{min-width:0;padding:0 30px 60px;display:flex;flex-direction:column;background:var(--card)}
.topbar{position:sticky;top:0;z-index:15;margin-top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0 15px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:none}
.tb-l{min-width:0}
.tb-l h1{font-family:var(--ff);font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.12;margin-top:3px;color:var(--ink)}
.tb-l p{color:var(--muted);font-size:11.5px;margin-top:6px}
.topbar .eyebrow{color:var(--accent)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;line-height:1.6;text-align:right}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:6px 11px;border-radius:20px;background:var(--card2)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--sage);display:block;box-shadow:0 0 0 3px rgba(0,166,62,.14)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 13px;border-radius:9px;font-size:11.5px;transition:.16s;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.btn:hover{border-color:#D1D5DC;background:var(--card2);color:var(--ink)}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 18px -12px rgba(23,78,79,.7)}
.btn.primary:hover{background:#0F3D3E;border-color:#0F3D3E;color:#fff;box-shadow:0 10px 22px -12px rgba(23,78,79,.85)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--danger);border-color:rgba(231,0,11,.22)}
.btn.danger:hover{background:var(--danger-soft);border-color:rgba(231,0,11,.42);color:#B80009}
.btn.sm{padding:5px 10px;font-size:10.5px;border-radius:7px}
.btn[disabled]{opacity:.4;pointer-events:none}
.view{display:none;padding-top:22px}
.view.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:none}
.card-h{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.card-h .eyebrow{margin-left:auto}
.card-b{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stats-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 14px;color:var(--text);box-shadow:none}
.stat .eyebrow{display:block;margin-bottom:8px;color:var(--muted);font-size:9px;padding-right:36px}
.stat b{display:block;font-family:var(--ff);font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px;letter-spacing:0}
.stat .sub{font-size:10.5px;color:var(--muted);margin-top:6px;position:relative;z-index:1}
.stat::after{content:"";position:absolute;right:14px;top:14px;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:13px;line-height:1;color:var(--accent)}
.stat.a::after{content:"▤";background:#E3F1EF;color:#174E4F}
.stat.g::after{content:"✓";background:#E6F6EC;color:#00A63E;font-weight:700}
.stat.w::after{content:"◎";background:#FFF7DC;color:#B27B00}
.stat.p::after{content:"↻";background:#EFEBFB;color:#7C6BD6;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.04em;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--card2);white-space:nowrap}
.badge .bd{width:5px;height:5px;border-radius:50%;background:var(--slate)}
.badge.s-idle .bd{background:var(--faint)}
.badge.s-doing{border-color:rgba(252,200,0,.45);color:var(--amber);background:var(--amber-soft)}
.badge.s-doing .bd{background:var(--amber)}
.badge.s-done{border-color:rgba(0,166,62,.28);color:var(--sage);background:var(--sage-soft)}
.badge.s-done .bd{background:var(--sage)}
.badge.s-blocked{border-color:rgba(231,0,11,.24);color:var(--danger);background:var(--danger-soft)}
.badge.s-blocked .bd{background:var(--danger)}
.badge.s-plum{border-color:rgba(124,107,214,.26);color:var(--plum);background:var(--plum-soft)}
.badge.s-plum .bd{background:var(--plum)}
.sample-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--plum);border:1px dashed rgba(124,107,214,.38);padding:1px 6px;border-radius:6px;background:var(--plum-soft)}
.empty{padding:30px 14px;text-align:center;color:var(--faint);font-size:11.5px}
.bar{height:6px;background:#EEF0F3;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:20px;transition:width .35s}
.hair{height:1px;background:var(--line2);border:0;margin:0}

/* ---------- 总览 ---------- */
.hero{display:flex;align-items:center;gap:18px;padding:2px 2px 18px}
.hero .line{font-family:var(--serif);font-size:20px;letter-spacing:.01em;color:var(--ink)}
.hero .line em{font-style:normal;color:var(--accent)}
.hero .rule{flex:1;height:1px;background:linear-gradient(90deg,#E5E7EB,transparent)}
.hero .hint{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.05em}
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,20,43,.04)}
.quick .eyebrow{flex:none;color:var(--accent)}
.quick input{flex:1;min-width:140px;border:0;background:transparent;font-size:12px;padding:3px 2px;outline:none;color:var(--text)}
.quick input::placeholder{color:var(--faint)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.flow-step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:0 1px 2px rgba(16,20,43,.04)}
.flow-step .fs-top{display:flex;align-items:center;gap:8px}
.flow-step .fs-no{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;flex:none;font-weight:600}
.flow-step b{display:block;font-family:var(--mono);font-size:23px;font-weight:500;margin-top:9px;letter-spacing:-.02em;color:var(--ink)}
.flow-step span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.flow-step::after{content:"›";position:absolute;right:-8px;top:50%;transform:translateY(-50%);color:#D1D5DC;font-size:16px;z-index:2}
.flow-step:last-child::after{display:none}
.split{display:grid;grid-template-columns:1.35fr .95fr;gap:16px;align-items:start}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line2)}
.todo li:last-child{border-bottom:0}
.todo .ck{width:17px;height:17px;border:1.5px solid #D1D5DC;border-radius:5px;flex:none;margin-top:1px;display:grid;place-items:center;background:var(--card);color:#fff}
.todo .ck svg{width:9px;height:9px;opacity:0}
.todo li.done .ck{border-color:var(--sage);background:var(--sage)}
.todo li.done .ck svg{opacity:1}
.todo .ck:hover{border-color:var(--accent)}
.todo .tt{font-size:12px;line-height:1.45;color:var(--text)}
.todo .meta{margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.todo .time{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.todo .over{color:var(--danger)}
.mrow{display:grid;grid-template-columns:22px 1fr 78px 34px;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover .mt b{color:var(--accent)}
.mrow .mn{font-family:var(--mono);font-size:9px;color:var(--faint)}
.mrow .mt b{display:block;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .16s;color:var(--ink)}
.mrow .mt span{font-size:9.5px;color:var(--muted)}
.mrow .mp{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:right}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{padding:11px 0;border-bottom:1px solid var(--line2)}
.rlist li:last-child{border-bottom:0}
.rlist .rh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rlist .rt{font-size:11.5px;font-weight:500;margin-top:5px;line-height:1.45;color:var(--ink)}
.rlist .rn{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{display:inline-flex;gap:3px;margin-left:auto}
.score i{width:5px;height:5px;border-radius:50%;background:#E5E7EB;display:block}
.score i.on{background:var(--accent);box-shadow:0 0 0 2px rgba(23,78,79,.14)}

/* ---------- 课程 ---------- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:20px;font-size:10.5px;color:var(--muted);transition:.16s}
.chip:hover{border-color:#D1D5DC;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:rgba(23,78,79,.3);color:var(--accent);font-weight:600}
.toolbar .sp{flex:1}
.search{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:20px;font-size:11px;outline:0;min-width:150px;color:var(--text);transition:.16s}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:rgba(23,78,79,.45);box-shadow:0 0 0 3px rgba(23,78,79,.08)}
.module-block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,20,43,.04)}
.module-head{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.module-head .mno{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;letter-spacing:.06em;flex:none}
.module-head .mt{min-width:0;flex:1}
.module-head .mt b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.module-head .mt span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.module-head .mbar{width:90px;flex:none}
.module-head .mp{font-family:var(--mono);font-size:9.5px;color:var(--muted);width:38px;text-align:right;flex:none}
.unit-row{display:flex;gap:10px;padding:13px 18px;border-top:1px solid var(--line2);align-items:flex-start;transition:background .16s}
.unit-row:hover{background:var(--card2)}
.unit-row:first-of-type{border-top:0}
.u-dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:7px;background:var(--faint)}
.u-dot.doing{background:var(--amber);box-shadow:0 0 0 3px rgba(232,137,12,.14)}
.u-dot.done{background:var(--sage);box-shadow:0 0 0 3px rgba(15,169,123,.14)}
.u-main{min-width:0;flex:1}
.u-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.u-title b{font-size:12.5px;font-weight:500;line-height:1.4;color:var(--ink)}
.u-hours{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:auto}
.u-goal{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.u-points{display:none;margin-top:8px;padding:10px 13px;background:#F3F7F7;border-left:2px solid rgba(23,78,79,.35);border-radius:7px}
.u-points.on{display:block}
.u-points span{display:block;font-size:10.5px;color:var(--muted);line-height:1.7;padding-left:11px;position:relative}
.u-points span::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:rgba(23,78,79,.45)}
.lec-link{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;line-height:1;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(23,78,79,.18);padding:4px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.lec-link:hover{background:rgba(23,78,79,.14)}
.lec-link svg{width:10px;height:10px}
.u-acts{display:flex;gap:3px;flex:none;align-items:center}
.iconbtn{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:var(--faint);border:1px solid transparent;transition:.14s}
.iconbtn:hover{background:var(--card2);border-color:var(--line);color:var(--ink)}
.iconbtn.del:hover{color:var(--danger);background:var(--danger-soft);border-color:rgba(231,0,11,.18)}
.iconbtn svg{width:12px;height:12px}

/* ---------- 实操看板 ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:#F9FAFB;border:1px solid var(--line);border-radius:var(--r);min-height:220px;display:flex;flex-direction:column}
.col-h{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.col-h .cdot{width:6px;height:6px;border-radius:50%}
.col-h b{font-size:11.5px;font-weight:600;color:var(--ink)}
.col-h span{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--muted);background:#fff;padding:1px 7px;border-radius:20px;box-shadow:0 1px 2px rgba(16,20,43,.06)}
.col-b{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1}
.icard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:12px;transition:.16s;box-shadow:0 1px 2px rgba(16,20,43,.05)}
.icard.st-doing{border-left-color:var(--amber)}
.icard.st-done{border-left-color:var(--sage)}
.icard.st-blocked{border-left-color:var(--danger)}
.icard:hover{border-color:#D1D5DC;border-left-color:var(--accent);box-shadow:0 10px 24px -18px rgba(16,24,40,.35);transform:translateY(-2px)}
.icard .ic-top{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.icard .due{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--faint)}
.icard .due.over{color:var(--danger)}
.icard h4{font-size:12px;font-weight:500;line-height:1.42;color:var(--ink)}
.icard .im{font-size:9.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard .hook{font-size:10px;color:var(--faint);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .cf{display:flex;align-items:center;gap:4px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2)}
.icard .acts{margin-left:auto;display:flex;gap:2px}

/* ---------- 结果 ---------- */
.result-row{display:grid;grid-template-columns:1.4fr .9fr .95fr 82px 62px 60px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 17px;margin-bottom:9px;transition:.16s;box-shadow:0 1px 2px rgba(16,20,43,.04)}

.result-row .rt span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-row .k{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:2px}
.result-row .rv{font-size:11px;line-height:1.45;color:var(--text)}
.result-row .rv b{font-family:var(--mono);font-weight:500;color:var(--accent)}
.result-row .date{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:right}

/* ---------- 复盘 ---------- */
.review-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:11px;box-shadow:0 1px 2px rgba(16,20,43,.04)}

.rv-body{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
.rv-body .k{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
.rv-body p{font-size:11.5px;line-height:1.6;color:var(--text)}
.rv-foot{display:flex;align-items:flex-start;gap:10px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2)}
.rv-foot .note{font-size:10.5px;color:var(--muted);line-height:1.55;flex:1}
.rv-foot .acts{display:flex;gap:2px;flex:none}

/* ---------- 归档 ---------- */
.archive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.arch-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;display:flex;flex-direction:column;gap:9px;transition:.18s;box-shadow:0 1px 2px rgba(16,20,43,.04)}
.arch-card:hover{border-color:#D1D5DC;box-shadow:0 14px 32px -24px rgba(16,24,40,.35);transform:translateY(-2px)}
.arch-card .ac-top{display:flex;align-items:center;gap:9px}
.arch-card .ac-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,rgba(23,78,79,.10),rgba(0,166,62,.08));border:1px solid rgba(23,78,79,.14);display:grid;place-items:center;color:var(--accent);flex:none}
.arch-card .ac-ic svg{width:15px;height:15px}
.arch-card h3{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink)}
.arch-card p{font-size:10.5px;color:var(--muted);line-height:1.6;flex:1}
.arch-card .btn{align-self:flex-start}
.data-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,20,43,.04)}
.data-panel .dp-t{min-width:180px;flex:1}
.data-panel .dp-t b{display:block;font-size:12px;font-weight:600;color:var(--ink)}
.data-panel .dp-t span{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5}
.privacy{display:flex;align-items:flex-start;gap:8px;font-size:10px;color:#8A5A0B;background:#FFFBEB;border:1px solid #FDE68A;border-left:3px solid #FCC800;padding:10px 13px;border-radius:7px;line-height:1.6;margin-bottom:16px}
.privacy b{color:#7A4E06}
.privacy svg{flex:none;width:13px;height:13px;margin-top:2px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
.tbl th{text-align:left;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:400;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line2);color:var(--text);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--card2)}
.tbl td.mono{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.tbl .t-acts{text-align:right;white-space:nowrap}

/* ---------- 弹层 / 表单 ---------- */
dialog{border:0;padding:0;background:var(--card);color:var(--text);border-radius:20px;max-width:560px;width:calc(100% - 32px);max-height:86vh;max-height:86dvh;box-shadow:0 40px 90px -28px rgba(16,20,43,.6);overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
dialog.wide{max-width:720px}
dialog::backdrop{background:rgba(11,31,32,.45);backdrop-filter:blur(4px)}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 15px;border-bottom:1px solid var(--line);flex:none}
.m-head .eyebrow{display:block;margin-bottom:4px;color:var(--accent)}
.m-head h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;color:var(--ink)}
.m-head .sub{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.m-close{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.m-close:hover{background:var(--card2);color:var(--ink)}
.m-close svg{width:13px;height:13px}
.m-body{padding:17px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;max-height:calc(86vh - 128px);max-height:calc(86dvh - 128px)}
.lec-body{font-size:12.5px;line-height:1.78;color:var(--text)}
.lec-body h5{font-size:13px;font-weight:700;color:var(--ink);margin:18px 0 7px;padding-left:9px;border-left:3px solid var(--accent);line-height:1.35}
.lec-body h5:first-child{margin-top:0}
.lec-body p{margin:0 0 8px}
.lec-body ul,.lec-body ol{margin:0 0 10px;padding-left:19px}
.lec-body li{margin:3px 0}
.lec-body b{color:var(--ink);font-weight:600}
.lec-body blockquote{margin:10px 0;padding:9px 12px;background:var(--card2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;color:var(--muted)}
.lec-empty{color:var(--muted);text-align:center;padding:24px 0}
.lec-meta{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--faint);margin-right:auto;align-self:center}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--card2);flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
.f label b{color:var(--accent);font-weight:400;margin-left:2px}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--card);padding:8px 11px;border-radius:9px;font-size:11.5px;outline:0;width:100%;color:var(--text);transition:.14s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:rgba(23,78,79,.45);box-shadow:0 0 0 3px rgba(23,78,79,.08)}
.f input::placeholder,.f textarea::placeholder{color:var(--faint)}
.f textarea{resize:vertical;min-height:64px;line-height:1.5}
.f .hint{font-size:9px;color:var(--faint);line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:#174E4F;border:1px solid rgba(255,255,255,.10);color:#F4F8F8;font-size:11.5px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:80vw;text-align:center;box-shadow:0 18px 44px -16px rgba(16,24,40,.5)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:#B42318;border-color:rgba(255,255,255,.14);color:#FFF1EE}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  main{padding:0 22px 48px}
  .result-row{grid-template-columns:1.3fr .8fr .9fr 76px 58px 56px;gap:9px}
}

  .stats-4{grid-template-columns:repeat(2,minmax(0,1fr))}

  .result-row .acts{grid-column:auto}
}
@media (max-width:820px){
  body{grid-template-columns:1fr;display:block;background-image:none}

  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:2px;scrollbar-width:none}

  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:4px;padding:6px 2px;font-size:10px;border-left:0;border-bottom:0;justify-content:center;border-radius:10px;color:var(--muted)}
  .nav button.on{border-left-color:transparent;border-bottom-color:transparent;background:var(--accent);box-shadow:none;color:#fff}
  .nav button svg{width:15px;height:15px}
  .nav .count{display:none}
  main{padding:0 13px calc(64px + env(safe-area-inset-bottom));background:var(--card)}
  .toast{bottom:calc(74px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
  .topbar{top:0;margin-top:0;padding:12px 0 11px;border-radius:0;gap:9px;box-shadow:none}
  .tb-l h1{font-size:22px}
  .tb-l p{display:none}
  .tb-r{gap:7px;flex:1;justify-content:flex-end}
  .clock{display:none}
  .sync{font-size:8.5px;padding:4px 8px}
  #newBtn{padding:6px 10px;font-size:10.5px}
  .view{padding-top:14px}
  .stats-4{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:14px}
  .stat b{font-size:23px}
  .hero{display:none}
  .flow{grid-template-columns:1fr 1fr;gap:8px}
  .kanban{grid-template-columns:1fr;gap:10px}
  .col{min-height:0}
  .col-b{display:flex}
  .result-row{grid-template-columns:1fr 70px;gap:8px;padding:12px 13px}
  .result-row .rr-m,.result-row .rr-va{display:none}
  .result-row .rr-d{display:none}
  .result-row .acts{grid-column:1/-1;justify-content:flex-start;border-top:1px dashed var(--line2);padding-top:7px;margin-top:2px}
  .rv-body{grid-template-columns:1fr;gap:8px}
  .archive-grid{grid-template-columns:1fr}
  .module-head{flex-wrap:wrap}
  .module-head .mbar{width:70px}
  .unit-row{padding:11px 13px}
  .u-acts{flex-wrap:wrap;justify-content:flex-end;max-width:96px}
  .u-hours{margin-left:0}
  .form-grid{grid-template-columns:1fr}
  dialog{width:calc(100% - 20px);max-height:92vh;max-height:92dvh;margin:auto}
  .data-panel .dp-t{min-width:100%}
}
@media (max-width:380px){
  .stats-4,.flow{grid-template-columns:1fr}
  .sync span{display:none}
  .sync{padding:4px 6px}
}

<body>

<script>
/* ================= 常量 ================= */
const LS_KEY = 'zj_learn_v1';
const CONTENT_VERSION = 4;
const RESET_VERSION = 4;
const TABLES = ['modules','units','practices','results','reviews','archives'];
const UNIT_STATUS = ['未开始','学习中','已学完'];
const PRACTICE_STATUS = ['待开始','进行中','已完成','受阻'];
const VERDICTS = ['达标','部分达标','未达标'];
const SCOPE_TYPES = ['模块','实操','阶段'];
const ALL = '全部';
const STATUS_CLASS = {
  '未开始':'idle','学习中':'doing','已学完':'done',
  '待开始':'idle','进行中':'doing','已完成':'done','受阻':'blocked',
  '达标':'done','部分达标':'doing','未达标':'blocked'
};

const MODULES_SEED = [
  {id:'m01',title:'创业条件评估',en:'FOUNDATION',summary:'用资源盘点、现金流底线与风险共识三张表，判断现在是否适合创业。'},
  {id:'m02',title:'商业与市场',en:'MARKET',summary:'通过 10 次客户访谈、竞品拆解和商业模式画布，验证需求是否真实。'},
  {id:'m03',title:'公司设立与合规',en:'LEGAL',summary:'从主体选择到注册开户、许可资质，走通合法经营的第一步。'},
  {id:'m04',title:'财税与资金',en:'FINANCE',summary:'建立记账报税、发票社保和 12 个月现金流的管理节奏。'},
  {id:'m05',title:'产品与交付',en:'PRODUCT',summary:'用 MVP、交付 SOP 和供应链备选，把想法变成可复购的交付。'},
  {id:'m06',title:'团队与股权',en:'TEAM',summary:'定岗位、定薪酬、定股权规则，让团队在前期就不埋雷。'},
  {id:'m07',title:'增长与运营',en:'GROWTH',summary:'用渠道测试、内容转化和留存指标，搭出可追踪的增长路径。'},
  {id:'m08',title:'法务与风控',en:'RISK',summary:'掌握合同审查、知识产权与数据合规，守住经营底线。'}
];

const UNIT_SEED = [
  {id:'u01',module_id:'m01',title:'动机与资源盘点',goal:'用一页纸写清创业动机、现有资源与最大可承受损失，并能向伙伴复述。',points:'学：区分机会驱动、生存驱动、使命驱动三种动机，以及各自常见的失败模式\n学：用“资金/技能/人脉/时间”四象限盘点资源，每项写现有、缺口、补齐方式\n读：《精益创业》第 1–2 章；YC Startup School 的 How to Start a Startup 讲座\n练：完成个人资源盘点表，标注 3 项必须外部补齐的资源\n产出：一页《创业条件自评》，含 3 个主要风险与应对动作\n验收：能在 3 分钟内讲清“为什么是我、为什么现在、最坏损失是多少”',hours:3},
  {id:'u02',module_id:'m01',title:'时间与现金流底线',goal:'算出个人与家庭 12 个月最低生存成本，设定止损线和复盘节点。',points:'学：区分固定支出、弹性支出与一次性投入，建立月度生存成本口径\n学：runway（现金可覆盖月数）= 可动用现金 ÷ 月均净支出\n读：《精益创业》关于“跑道”的章节；《财务智慧》现金流基础\n练：用过去 6 个月真实流水推算未来 12 个月支出\n产出：12 个月生存成本表 + 止损线（金额/时间/指标）\n验收：明确“现金低于几个月必须停损”，并写下 3 个降本动作',hours:3},
  {id:'u03',module_id:'m01',title:'风险承受力与家庭共识',goal:'与家人或伙伴形成书面共识，明确投入上限、最坏结果和退出机制。',points:'学：用“最坏情况清单”评估法律、财务、关系与健康四类风险\n学：区分可承受与不可承受风险，为每项风险设触发条件\n读：《创业维艰》关于“直面现实”的章节\n练：开一次 30 分钟家庭或伙伴沟通会，逐项确认时间、资金与负债边界\n产出：一页《风险与共识备忘录》，双方签字或聊天记录留档\n验收：所有重大投入都有书面边界，并约定每季度复盘一次',hours:2},

  {id:'u04',module_id:'m02',title:'需求验证访谈',goal:'完成 10 次目标客户访谈，提炼出至少 3 个重复出现且愿意付费的问题。',points:'学：用 JTBD（待办任务）描述客户“在什么场景下想完成什么”\n学：掌握开放式提问与追问，避免“你会买吗”这类引导性问题\n读：《精益创业》客户访谈章节；《妈妈测试》前 5 章\n练：设计 5 个访谈问题，完成 10 次访谈并逐字记录关键原话\n产出：访谈记录表 + 需求归纳（频次、场景、现有替代方案、付费意愿）\n验收：至少 6 人提到同一痛点，且有 3 人愿意留联系方式或试用',hours:4},
  {id:'u05',module_id:'m02',title:'目标客户与竞品',goal:'画出 1 个核心客户画像，完成 3 个竞品的价格与差异拆解。',points:'学：客户画像六要素：角色、场景、目标、痛点、预算、决策链\n学：竞品要看“替代方案”，包括手工、Excel、外包，而不只是同行\n读：《定位》前 4 章；《价值主张设计》客户画像部分\n练：做一张竞品拆解表：卖点、价格、渠道、口碑、弱点\n产出：客户画像卡 + 竞品对比表 + 1 个可切入的空位假设\n验收：能说清“客户现在怎么解决、为什么愿意换、我们凭什么是更好选择”',hours:3},
  {id:'u06',module_id:'m02',title:'商业模式画布与定价',goal:'用一页商业模式画布说明价值创造与获取方式，并完成 2 套定价方案。',points:'学：商业模式画布九宫格：客户、价值主张、渠道、客户关系、收入、资源、活动、合作、成本\n学：三种定价法：成本加成、竞争定价、价值定价；理解毛利与单位经济模型\n读：《商业模式新生代》画布章节；《精益创业》价值假设与增长假设\n练：填写画布 v1，测算单笔订单的收入、变动成本与毛利\n产出：商业模式画布 + 定价方案 A/B + 单客经济模型（LTV/CAC 初算）\n验收：每个格子都有证据或待验证假设，不写空话',hours:4},

  {id:'u07',module_id:'m03',title:'主体形式选择',goal:'在个体工商户、有限公司、合伙企业之间做出有理由的选择，并记录退出成本。',points:'学：比较三类主体的责任边界、税负、设立成本、融资能力与注销难度\n学：理解有限责任公司认缴出资与股东责任，关注 2023 年修订《公司法》的实缴过渡要求\n读：《公司法》最新版股东出资与责任条款；当地市场监管局办事指南\n练：用决策矩阵给三类主体打分（责任、税负、成本、融资、退出）\n产出：一页《主体选择说明》，含理由、替代方案与退出成本\n验收：能向会计或律师复述选择依据，并列出 3 个需专业确认的问题',hours:3},

  {id:'u09',module_id:'m03',title:'经营范围与许可资质',goal:'对照行业许可目录，确认业务所需的前置/后置许可与备案。',points:'学：区分前置审批、后置审批与告知承诺制，理解无证经营的风险\n学：经营范围使用规范表述，主营业务放在第一项\n读：当地行政许可事项清单；行业主管部门官网办事指南\n练：把业务拆成具体经营活动，逐项对照是否需要许可证或备案\n产出：证照与许可清单，含办理条件、周期、年检与续期提醒\n验收：所有在营业务都有对应资质或明确的合规路径',hours:3},

  {id:'u11',module_id:'m04',title:'发票与社保公积金',goal:'搞清开票、收票、作废红冲与员工社保公积金办理流程。',points:'学：发票种类、开票额度、税率或征收率，以及作废与红冲的适用场景\n学：社保公积金开户、增员减员、缴费基数与申报周期（以当地为准）\n读：电子税务局发票业务指引；当地社保与公积金中心办事指南\n练：建立发票收发登记表，模拟一次开票与一次红冲\n产出：发票台账 + 社保公积金办理清单\n验收：每张发票可对应合同或回款，社保缴纳与员工名册一致',hours:3},

  {id:'u16',module_id:'m06',title:'岗位与招聘',goal:'明确前 3 个岗位的职责、产出与招聘标准，完成一次结构化面试。',points:'学：先定“要完成的产出”，再定岗位，而不是先招人\n学：结构化面试：同一组问题、统一评分表、行为事例追问（STAR）\n读：《聘谁》关于 A 级招聘的章节\n练：写 3 份一页 JD，设计 5 个面试问题与评分标准\n产出：岗位画像 + JD + 面试评分表 + 试用期目标\n验收：每位候选人按同一标准打分，试用期目标可量化',hours:3},
  {id:'u17',module_id:'m06',title:'薪酬与激励',goal:'设计一套固定加浮动、可解释且能留住关键人的薪酬结构。',points:'学：薪酬三段：固定工资、浮动奖金、长期激励（股权或期权）\n学：参考同城同岗位市场区间，控制薪酬带宽与内部公平\n读：《薪酬管理》基础章节；公开行业薪酬报告\n练：为 3 个岗位设定薪酬带宽与浮动规则\n产出：薪酬结构表 + 激励规则 + 调薪机制\n验收：每个岗位的薪酬有依据、浮动部分可量化、员工能算清',hours:3},
  {id:'u18',module_id:'m06',title:'股权期权与合伙协议',goal:'把股权比例、成熟机制、决策权与退出方式提前写进书面协议。',points:'学：股权成熟常见 4 年、1 年 cliff，以及回购与加速条款\n学：区分股权、期权、分红权；识别代持与控制权风险\n读：《公司法》股权转让条款；《创业维艰》分钱与人员调整章节\n练：用一页 term sheet 写清出资、比例、成熟、决策与退出\n产出：合伙协议条款清单（待律师审核）+ 股权结构表\n验收：每位合伙人清楚“拿多少、多久拿到、什么情况失去、怎么退出”',hours:4},

  {id:'u19',module_id:'m07',title:'获客渠道盘点',goal:'列出 3 个可测试获客渠道，并用小预算跑出初始 CAC。',points:'学：渠道分类：搜索、内容、社交、渠道合作、线下、老客转介绍\n学：CAC = 渠道投入 ÷ 新增客户数，用来比较渠道效率\n读：《增长黑客》获客章节；《精益数据分析》渠道指标\n练：为 3 个渠道各设 500–1000 元小预算与 2 周测试周期\n产出：渠道测试计划 + 线索来源表 + CAC 初算\n验收：至少 1 个渠道能稳定带来有效线索，且 CAC 可接受',hours:3},
  {id:'u20',module_id:'m07',title:'内容与销售转化',goal:'搭一条从内容触达、咨询到成交的可追踪路径。',points:'学：内容矩阵：认知、兴趣、信任、成交四类内容各司其职\n学：转化路径：钩子 → 价值证明 → 行动号召 → 跟进\n读：《文案训练手册》；《影响力》六大说服原则\n练：选 1 个平台，连续发布 4 条内容并记录曝光、互动、咨询、成交\n产出：内容排期表 + 转化漏斗表 + 话术脚本\n验收：能算出每个环节的转化率，并找到最该优化的一环',hours:4},
  {id:'u21',module_id:'m07',title:'客户留存与核心指标',goal:'确定 3 个真正要盯的经营指标，建立周度数据记录。',points:'学：区分虚荣指标与经营指标：复购率、留存率、毛利率、回款周期\n学：用 cohort（按首购月份分组）观察留存，而不是只看总数\n读：《精益数据分析》留存与黏性章节；《哈佛商业评论》客户留存文章\n练：建立周度指标表，连续记录 4 周并画趋势\n产出：核心指标看板 + 留存曲线 + 3 个改进行动\n验收：每周 30 分钟内能更新数据，并据此做一次决策',hours:3},

  {id:'u22',module_id:'m08',title:'合同要点',goal:'掌握合同审查清单，能识别主体、付款、交付、违约等关键风险。',points:'学：合同八要素：主体、标的、价款、付款、交付、验收、违约、争议解决\n学：重点看付款节点、验收标准、解除条件、保密与知识产权归属\n读：《民法典》合同编相关条款；行业协会合同示范文本\n练：用审查清单逐条检查一份真实合同（脱敏后）\n产出：合同审查清单 + 风险条款修改建议\n验收：能标出至少 5 个风险点，并写出可执行的修改意见',hours:3},

const LECTURES = {
  "u01": "<p><b>核心结论：</b>创业第一步不是找机会，而是写清自己为什么做、手里有什么、能承受多大损失。一页纸能讲清这三点，才有资格谈方向。</p><h5>关键概念</h5><ul><li>机会驱动：看到明确的需求缺口，能说出客户、场景和现有替代方案；常见失败模式是追热点，需求没验证就投钱。</li><li>生存驱动：因失业、收入下降被动开始；常见失败模式是急于变现，接不合适的单，把现金流拖垮。</li><li>使命驱动：为某个长期问题而做；常见失败模式是只谈意义不谈买单人，长期靠外部输血。</li><li>资源四象限：资金、技能、人脉、时间，每项分“现有、缺口、补齐方式”三列。</li><li>最大可承受损失：钱、时间、关系成本的上限，先定量再动手。</li></ul><h5>操作步骤</h5><ol><li>用两百字写下动机，标注属于哪一类，并对照该类动机的失败模式自查。</li><li>逐项填四象限：资金写可动用金额与来源，技能写能独立交付和不会的事，人脉写能直接约到的人及其角色，时间写每周可投入小时数。</li><li>每个象限挑出缺口，标出其中三项必须靠外部补齐的，写明补齐方式、周期、成本。</li><li>写出三个主要风险，每个配一条应对动作和一个可观察的触发信号。</li><li>找人复述，三分钟内讲完“为什么是我、为什么现在、最坏损失是多少”，对方能复述回来算通过。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，起步时都以为最缺客户。填完表发现真正的缺口是课程交付没有标准化，以及没人能独立拜访客户。资金够撑九个月，人脉里有四位人力资源负责人可以直接约见。他们砍掉原计划中的线上平台开发，把预算放到打磨两门标准课和补一个销售角色上，三个月后靠这四人的转介绍跑通第一批付费班。</p><h5>模板 / 清单</h5><ul><li>动机：类型、一句话理由、失败模式自查</li><li>资金：可动用金额、来源、每月净支出</li><li>技能：能独立交付、必须外购、补齐周期</li><li>人脉：可直接约见的人、角色、能帮的事</li><li>时间：每周可投入小时、不可动用的时段</li><li>风险三条：描述、触发信号、应对动作</li><li>结论：继续、缩小范围、暂缓</li></ul><h5>常见误区</h5><ul><li>把动机写成口号，不写具体触发事件，复盘时无法判断是否还成立。</li><li>资源只算钱，不算时间和人脉，项目最后死在没时间推进。</li><li>把“认识”当人脉，没验证对方是否愿意引荐或付费。</li><li>只写风险不写触发信号，等风险发生才发现已经晚了。</li></ul>",
  "u02": "<p><b>核心结论：</b>runway 等于可动用现金除以月均净支出。先算出这个月数，再决定投入节奏；不知道能活几个月就开始花钱，是最常见的死法。</p><h5>关键概念</h5><ul><li>固定支出：房租、社保、还款、家庭基本生活，短期内改不动。</li><li>弹性支出：差旅、推广、外包、娱乐，一个月内可以压缩。</li><li>一次性投入：设备、注册、押金、装修，不重复但会一次性抽走现金。</li><li>净支出：总支出减可预期的稳定收入，用过去六个月流水推算，不用乐观估计。</li><li>止损线：金额、时间、指标三条同时设定，任一触发即执行。</li></ul><h5>操作步骤</h5><ol><li>导出过去六个月个人与家庭流水，按固定、弹性、一次性三类归集，算出月均。</li><li>用保守口径推未来十二个月支出，把已知的涨价、还款、保险、学费单列。</li><li>统计可动用现金，剔除应急金和不能动的钱，只算活期与可快速赎回部分。</li><li>算出 runway 写在纸上；低于六个月，先降本再启动。</li><li>设三条止损线，写明触发的具体金额与日期，并约定由谁执行。</li><li>定复盘节点：每月固定一天更新现金流，每季度做一次去留判断。</li></ol><h5>案例</h5><p>一家做设计外包的两人工作室，最初按“每月接三单”估收入，实际前三个月只接到一单。他们把弹性支出砍掉三成，退掉一间独立办公室，runway 从五个月拉到九个月。同时设了止损线：现金低于三个月，或第八个月仍未稳定两单每月，就转回兼职接单。第八个月指标线被触发，他们主动收缩，没有去借短期贷款。这套算法后来写在白板上，每月固定更新一次。</p><h5>模板 / 清单</h5><ul><li>月度生存成本表：固定、弹性、一次性，各列十二个月</li><li>可动用现金：金额、到账时间、限制条件</li><li>runway 计算：现金除以月均净支出等于月数</li><li>止损线三条：金额线、时间线、指标线，各写触发值</li><li>降本动作三个：内容、预计节省、执行日期</li><li>复盘节点：每月日期、每季判断标准</li></ul><h5>常见误区</h5><ul><li>用最好月份的流水推全年，runway 被高估一倍以上。</li><li>把应收账款当现金，到账前发不出工资。</li><li>只设金额线不设时间线，项目拖成长期消耗。</li><li>家庭支出和公司支出混在一起，看不到真实缺口。</li><li>把一次性支出摊进月均，看不出缺口最早出现在哪个月。</li></ul>",
  "u03": "<p><b>核心结论：</b>风险不是敢不敢，而是上限有没有写下来。把投入上限、最坏结果和退出机制落到书面，才有资格动用家庭资源。</p><h5>关键概念</h5><ul><li>四类风险：法律、财务、关系、健康。法律指连带责任与合同违约，财务指负债与担保，关系指合伙与亲友借贷，健康指长期高压。</li><li>可承受风险：损失发生后不影响基本生活、不牵连他人、可以恢复。</li><li>不可承受风险：需要高息借款、动用养老或教育金、以住房抵押、替他人担保。</li><li>触发条件：把“感觉不对”换成可观察的事实，比如连续两个月未达目标、出现诉讼、家人明确反对。</li><li>退出机制：什么情况下停止投入、剩余资产怎么分、谁来做最终决定。</li></ul><h5>操作步骤</h5><ol><li>列最坏情况清单，四类风险各写两条具体情形，写到能想象出画面。</li><li>逐条标“可承受”或“不可承受”，不可承受的当场划掉对应动作。</li><li>为可承受风险设触发条件和一个复核日期。</li><li>约一次三十分钟沟通会，逐项确认时间上限、资金上限、是否负债、最坏结果怎么应对。</li><li>结论写成一页备忘录，双方签字或保留聊天记录，约定每季度复盘一次。</li></ol><h5>案例</h5><p>一家做社区烘焙的夫妻档，原本打算抵押住房扩店。沟通会上把最坏情况写出来：半年不回本，房贷断供，孩子的教育金被动用。这条被列为不可承受，方案改为租共享厨房、先做预售。后来旺季备货失误，亏掉约两个月利润，因为上限写得清楚，两人没有追加借贷，两个月内恢复常态。复盘时两人按备忘录逐条核对，确认没有一条越界。</p><h5>模板 / 清单</h5><ul><li>投入上限：资金、时间、每周小时</li><li>禁止动作：抵押、担保、高息借贷、动用专项存款</li><li>四类风险各一条：情形、可承受与否、应对动作</li><li>触发条件：事实描述、复核人、复核日期</li><li>退出机制：停止信号、剩余资产处理、决策人</li><li>留档方式：签字页或聊天记录，注明复盘频率</li></ul><h5>常见误区</h5><ul><li>只跟伴侣说“放心”，不留任何书面边界。</li><li>把“我会努力”当应对方案，没有具体动作。</li><li>让合伙人替公司担保，却不写清责任上限。</li><li>备忘录写完就锁进抽屉，从不拿出来复盘。</li><li>把口头同意当成共识，事后理解不一致时没有依据。</li><li>只写金额上限，不写时间上限和由谁来决定停止。</li></ul>",
  "u04": "<p><b>核心结论：</b>访谈的目标不是听人说想法不错，而是拿到过去发生过的具体行为。愿意付费的问题，一定藏在客户已经花过钱、花过时间的场景里。</p><h5>关键概念</h5><ul><li>JTBD：客户在特定场景下想完成的待办任务，描述的是场景加目标，不是产品功能。</li><li>开放式提问：问“上次遇到这个问题是什么时候”，不问“你会买吗”。</li><li>追问三层：发生了什么、你当时怎么处理、花了多少钱和时间。</li><li>归纳四字段：频次、场景、现有替代方案、付费信号。</li><li>三大污染源：引导性提问、假设性问题、礼貌性肯定。</li></ul><h5>操作步骤</h5><ol><li>设计五个问题：最近一次遇到该问题的时间、当时怎么处理、花了多少钱、哪里不满意、如果有更好的方式会怎么选。</li><li>找十位符合画像的人，避开亲友，优先找最近三个月真实发生过该场景的人。</li><li>每次访谈二十五到三十分钟，逐字记录关键原话，不写自己的解读。</li><li>访谈后二十四小时内填记录表，标出频次、场景、替代方案、付费信号。</li><li>十次结束后归纳：同一痛点被提到几次，多少人愿意留联系方式或试用。</li><li>判断标准：至少六人提到同一痛点、三人愿意留联系方式或试用，才进入方案设计。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，原以为客户痛点是课程不够新。十次访谈后，八位人力资源负责人提到的是“培训后没法向老板证明效果”。他们据此把产品从卖课程改为卖课程加效果评估报告，第一期就拿到三家续约意向。团队复盘时说，如果当时只写总结不记原话，很容易把自己的假设当成结论。十次记录他们留了原件，复盘时能逐条回看。</p><h5>模板 / 清单</h5><ul><li>受访者：角色、行业、团队规模，不记录无关个人信息</li><li>场景：最近一次发生的时间、触发事件</li><li>现有做法：用了什么、花了多少钱和时间</li><li>不满点：原话摘录两到三句</li><li>付费信号：是否问价、是否愿留联系方式、是否愿试用</li><li>归纳字段：痛点编号、频次、强度</li></ul><h5>常见误区</h5><ul><li>问“你会买吗”，得到的是礼貌，不是需求。</li><li>只找熟人访谈，对方顺着你的话讲。</li><li>记录写成总结，丢掉原话，归纳时回不到现场。</li><li>把三个人的意见当成市场结论，样本太小就下重注。</li><li>把访谈做成推销，中途开始介绍产品，后面听到的都是客套。</li></ul>",
  "u05": "<p><b>核心结论：</b>客户画像不是人口标签，而是谁在什么场景下、因为什么、愿意花多少钱解决问题。竞品也不止同行，客户现在用的土办法才是最大的对手。</p><h5>关键概念</h5><ul><li>画像六要素：角色、场景、目标、痛点、预算、决策链。</li><li>决策链：使用者、付款人、影响者、否决者，常常不是同一个人。</li><li>替代方案：手工、表格、外包、干脆不解决，都算竞品。</li><li>空位假设：竞品都没做好的那一块，用一句话写清，并标注待验证。</li><li>差异必须能被客户感知，不能只是自己内部的形容词。</li></ul><h5>操作步骤</h5><ol><li>从访谈记录里挑出最集中的一类人，填六要素，每项都要有原话或事实支撑。</li><li>列出三个竞品，其中至少一个是客户现在的土办法。</li><li>做拆解表：卖点、价格、渠道、口碑、弱点，价格写公开可查的区间。</li><li>找出三家都没解决好的那一项，写成一句空位假设，附验证方式。</li><li>用一句话回答：客户现在怎么解决、为什么愿意换、我们凭什么更好。</li><li>判断标准：三个问题都答得出，且答案有访谈或公开信息支撑，画像才算成立。</li></ol><h5>案例</h5><p>一家做中小企业财税代账的四人团队，原本把客户定为所有小微企业。拆解后发现三家同行都在拼价格，没人处理“老板看不懂报表”这件事。他们把画像收窄到有专职出纳、老板每月要看经营数据的公司，产品加了月度经营解读。客户换过来的理由变得具体：不是更便宜，而是终于有人把数字讲清楚。这套画像后来成了他们筛选线索的第一道门槛，不符合的直接转给合作方。</p><h5>模板 / 清单</h5><ul><li>画像卡：角色、场景、目标、痛点原话、预算区间、决策链四人</li><li>竞品对比：名称、卖点、价格区间、渠道、口碑、弱点</li><li>土办法一栏：客户现在怎么做、成本、不满</li><li>空位假设：一句话、验证方式、验证周期</li><li>换购理由：现在怎么解决、为什么换、我们更好在哪</li><li>放弃条件：哪类客户明确不接</li></ul><h5>常见误区</h5><ul><li>画像写成年龄区间加城市，无法指导任何动作。</li><li>只看同行，忽略客户用表格和人工硬扛的现实。</li><li>把老板当唯一客户，忽略实际使用者和否决者。</li><li>空位假设写完不做验证，直接当结论投入。</li><li>把竞品的宣传语当卖点，不去验证客户是否真的在意。</li></ul>",
  "u06": "<p><b>核心结论：</b>画布的价值不在填满九格，而在标出哪些格子有证据、哪些还是假设。定价决定的不只是收入，还有客户筛选和交付方式。</p><h5>关键概念</h5><ul><li>九宫格：客户细分、价值主张、渠道、客户关系、收入来源、核心资源、关键活动、重要合作、成本结构。</li><li>三种定价：成本加成保底、竞争定价跟随、价值定价按客户收益定。</li><li>毛利等于收入减变动成本；单位经济模型看单笔订单是否赚钱。</li><li>LTV 与 CAC 之比用来判断获客是否划算，早期只能粗算。</li><li>每个格子标“已验证”或“待验证”，比写得漂亮更重要。</li></ul><h5>操作步骤</h5><ol><li>先填右侧：客户细分、价值主张、渠道，三格必须来自访谈结论。</li><li>再填左侧：核心资源、关键活动、重要合作，写实际有的，不写想有的。</li><li>填成本结构，区分固定与变动；填收入来源，写清单价、频次、付款方式。</li><li>测算单笔订单：收入、变动成本、毛利、交付耗时。</li><li>出两套定价：A 按价值定价走高单价少客户，B 按竞争定价走低单价多客户，各写适用条件。</li><li>粗算 LTV 与 CAC；若 LTV 不到 CAC 的三倍，先改交付成本或提价，不急着放量。</li></ol><h5>案例</h5><p>一家做企业内训的三人团队，画布第一版把收入写成按天收费，算完发现单天毛利不高，排期还被客户牵着走。第二版改为按项目收费加年度顾问，单价提高，交付周期拉长但课件可复用，单项目毛利明显改善。他们没有对外公布具体数字，只确认了一个判断：低价多单的模式养不起三个全职。他们把两套定价分别发给老客户试报价，才定下最终版本。</p><h5>模板 / 清单</h5><ul><li>九格各一行：内容、证据或假设、验证动作</li><li>单笔经济：单价、变动成本、毛利、交付工时</li><li>定价 A 与 B：价格、目标客户、交付方式、适用条件</li><li>LTV 与 CAC：粗算口径、当前值、警戒线</li><li>待验证清单：假设、验证方式、截止日期</li></ul><h5>常见误区</h5><ul><li>九格填满却全是形容词，没有任何证据。</li><li>只算收入不算交付工时，越忙越亏。</li><li>定价只看同行，不看客户获得的收益。</li><li>把 LTV 与 CAC 当精确指标，早期数据不足时过度纠结。</li><li>把画布当成一次性作业，定价改了画布却不跟着改。</li></ul>",
  "u07": "<p><b>核心结论：</b>主体形式选的是责任边界和退出成本，不是哪个更省钱。先想清楚最坏情况下谁承担什么，再比较税负和流程。</p><h5>关键概念</h5><ul><li>个体工商户：设立简单、成本低，经营者财产与经营债务的关系需按现行规定确认。</li><li>有限公司：股东以认缴出资为限承担责任，涉及出资实缴与过渡安排，以修订后的《公司法》及当地最新规定为准。</li><li>合伙企业：普通合伙人对企业债务承担无限连带责任，有限合伙人以出资为限。</li><li>比较维度：责任边界、税负、设立成本、融资能力、注销难度、账务要求。</li><li>退出成本：注销流程、税务清算、债务处理、时间与费用。</li></ul><h5>操作步骤</h5><ol><li>列出未来二十四个月的真实业务：是否签大额合同、是否雇人、是否引入外部投资、是否涉及许可资质。</li><li>用决策矩阵给三类主体在六个维度打分，加权后看得分，同时保留理由栏。</li><li>重点确认责任边界：可能产生大额赔偿或负债的业务，优先考虑责任隔离更清晰的形式。</li><li>估算退出成本：注销所需时间、是否需清税、是否有未了结合同。</li><li>写一页主体选择说明：选择、理由、替代方案、退出成本、三个待专业确认的问题。</li><li>带着问题问会计或律师；税负、社保、出资的具体口径以当地最新规定为准。</li></ol><h5>案例</h5><p>一家做软件外包的三人团队，最初注册个体工商户，接单灵活、维护成本低。第二年接到一份金额较大的企业合同，对方要求开专用发票并约定违约赔偿。三人重新评估后改为有限公司，理由是责任边界更清楚、便于对接大客户。他们同时记录了注销个体户所需的时间和费用，作为以后再调整的参考。</p><h5>模板 / 清单</h5><ul><li>业务特征：合同规模、是否雇人、是否融资、是否需许可</li><li>决策矩阵：责任、税负、设立成本、融资、退出、账务，各打分</li><li>选择结论：主体类型、三条理由</li><li>替代方案：另一类型的适用条件</li><li>退出成本：注销周期、清算事项、预估费用</li><li>待确认问题：税务、社保、出资各一条，注明以当地最新规定为准</li></ul><h5>常见误区</h5><ul><li>只看注册是否方便，不看责任边界。</li><li>认为有限公司一定更省税，忽略账务与合规成本。</li><li>用亲友代持规避限制，留下权属纠纷隐患。</li><li>不记录退出成本，等到要注销才发现拖了几个月。</li></ul>",
  "u08": "<p><b>核心结论：</b>注册是一条有五道关的流水线，最容易卡住的是住所证明和经营范围表述，不是名称核准。把材料清单和退回原因记下来，第二次会快很多。</p><h5>关键概念</h5><ul><li>五步：名称申报、设立登记、刻章备案、税务报到、银行开户。</li><li>住所证明：房产证明、租赁合同、产权人同意书，各地要求不同，以当地政务服务平台指引为准。</li><li>公司章程：出资比例、认缴期限、决策规则，要与实际约定一致。</li><li>经营范围：用规范表述，主营业务放第一项。</li><li>银行开户：法人到场、经营地址核验、用途说明，各行要求不同。</li></ul><h5>操作步骤</h5><ol><li>在当地政务服务网查企业开办指南，把材料清单打印出来逐项打勾。</li><li>准备三到五个备选名称，按优先级申报，避免与已有名称近似。</li><li>准备住所证明，先与产权方确认材料形式，再签租赁合同。</li><li>起草公司章程，出资比例与认缴期限和合伙人书面约定一致。</li><li>提交设立登记，记录提交时间、退回原因、补正内容。</li><li>刻章并备案，同步办理税务报到，确认税种与申报周期。</li><li>预约对公账户开户，带齐执照、印章、法人身份证、经营地址证明。</li><li>完成后扫描归档，建一张进度表，标注每个环节的实际耗时。</li></ol><h5>案例</h5><p>一家做内容制作的三人工坊，第一次提交因经营范围写成“各类业务”被退回，第二次按规范表述拆成节目制作、广告设计、文化活动策划后通过。银行开户时又因租赁合同地址与实际办公地不一致多跑了一趟。他们把两次退回原因写进进度表，后来帮朋友办理同类事项时直接避开了这两个坑。</p><h5>模板 / 清单</h5><ul><li>环节：名称申报、设立登记、刻章、税务报到、银行开户</li><li>每环节：负责人、提交日期、状态、退回原因、补正内容、完成日期</li><li>材料清单：住所证明、章程、股东身份证明、经营范围表述、印章、开户资料</li><li>归档规则：文件名写环节加日期，扫描件统一存放并备份</li><li>待确认：税种核定、申报周期、开户行要求，以当地最新规定为准</li></ul><h5>常见误区</h5><ul><li>名称只准备一个，被驳回后重新排队。</li><li>经营范围照抄同行，包含自己不做也需要许可的项目。</li><li>章程套模板，出资期限与实际约定不一致。</li><li>执照拿到就认为完成，忘了税务报到和开户，影响开票收款。</li></ul>",
  "u09": "<p><b>核心结论：</b>经营范围不是写给客户看的宣传语，而是监管部门判断你能不能做这门生意的依据。先把业务拆成具体经营活动，再逐项对照许可目录，比事后被责令停业、罚款或平台下架便宜得多。各地许可目录和办理口径差异较大，以当地最新规定为准。</p><h5>关键概念</h5><ul><li>前置审批：先取得许可证才能办营业执照，常见于食品、医疗器械、危化品等，具体项目以当地许可清单为准。</li><li>后置审批：可以先领执照，但在开展该项经营前必须取得许可，多数行业属于这一类。</li><li>告知承诺制：书面承诺符合条件即可先发证、后核查，承诺不实要承担撤销与处罚后果。</li><li>规范表述：经营范围使用登记机关的规范目录用语，自拟词句容易被退回；主营业务写在第一项，影响税务核定与资质判断。</li></ul><h5>操作步骤</h5><ol><li>把收入来源改写成动词短语：卖什么、卖给谁、怎么交付、是否收费。</li><li>逐条对照当地行政许可事项清单，标注“无需许可 / 后置 / 前置 / 禁止”。</li><li>拿不准的条目，带着业务描述去政务窗口或打政务服务热线问，记录答复人和日期。</li><li>按“主营在前、兼营在后、未来可能做的放末尾”排序，形成经营范围草稿。</li><li>建立证照台账：名称、编号、办理条件、主管部门、周期、年检或续期时间、保管人。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，最初把经营范围写成“教育咨询、企业管理咨询”，实际交付包含线上课程录制和学员社群运营。做许可对照时发现，面向社会招生并颁发证书的培训可能触及办学许可要求，他们改成只做企业内训、不发证书，并补齐“组织文化艺术交流活动”等条目。省下的不是一笔钱，而是三个月的整改时间。</p><h5>模板 / 清单</h5><ul><li>业务活动拆解表：活动、客户类型、是否收费、对应许可、依据与查询日期。</li><li>许可状态标注：无需 / 后置 / 前置 / 禁止，四档只能选一个，不留模糊。</li><li>证照台账：名称、编号、有效期、年检节点、续期提醒、保管人。</li><li>合规路径说明：暂不具备条件的业务，写明何时、以什么方式补齐。</li></ul><h5>常见误区</h5><ul><li>以为执照上写了就能做，忽略后置许可仍需单独申请。</li><li>经营范围照抄同行，对方有资质而自己没有。</li><li>把未来三五年想做的全写上，核验时反而说不清主营。</li><li>拿到证就不管有效期，年检、续期、地址变更全部漏掉。</li></ul>",
  "u10": "<p><b>核心结论：</b>记账报税的价值不在“交了多少税”，而在让每笔收支有凭证、每个月有节奏、随时能对外说明经营状况。小团队最常见的损失不是税负高，而是逾期申报、凭证缺失带来的罚款和信用受损。具体税种、税率与申报期限以当地最新规定为准。</p><h5>关键概念</h5><ul><li>小规模纳税人：按征收率简易计税，多为按季申报，进项税一般不能抵扣；销售额超过标准会被要求登记为一般纳税人，标准以当地最新规定为准。</li><li>一般纳税人：按适用税率计算销项、抵扣进项，需要取得合规专票，账务和发票管理要求更高。</li><li>主要税种：增值税、企业所得税、个人所得税、附加税费、印花税，申报周期各不相同，要分别建提醒。</li><li>收入确认口径：会计口径、开票口径、收款口径三者会分离，差异必须逐笔说明，否则账面利润和现金永远对不上。</li></ul><h5>操作步骤</h5><ol><li>固定每月 1—5 日整理上月流水，把银行流水、合同、发票三样对齐。</li><li>建立凭证命名规则：年月＋类型＋金额＋对方简称，扫描件放同一目录，按年打包备份。</li><li>在电子税务局核对申报状态，把截止日提前三天写进日历并设提醒。</li><li>每月核对三项数据：开票金额、银行收款、账面收入，差异逐笔写原因。</li><li>每季度与会计对一次账，确认税种、申报表、预缴与留抵情况，形成一页对账记录。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，前两个月把微信收款直接当收入，没有对应合同和发票，季度申报时说不清收入构成。后来每笔回款都标注“合同编号＋服务期”，跨月服务按进度确认收入，凭证按月归档。第三次申报时会计半小时就完成核对，还顺带发现一笔重复报销的交通费。</p><h5>模板 / 清单</h5><ul><li>月度财税日历：日期、事项、负责人、所需材料、完成标记。</li><li>凭证归档规则：命名、存放路径、备份周期、保留年限以当地规定为准。</li><li>三数核对表：开票、收款、账面收入三列，差异写原因和处理人。</li><li>季度对账纪要：税种、申报结果、待办事项、下次核对日期。</li></ul><h5>常见误区</h5><ul><li>没有收入就不申报，零申报同样要按期做，逾期一样有后果。</li><li>用个人账户收公司款，收支混在一起，年底无法还原。</li><li>只看银行余额判断赚没赚钱，忽略应收和预收。</li><li>发票、合同、回款三者不对应，被核查时无法自证。</li><li>记账全交给代账公司就不看报表，申报错误长期无人发现。</li></ul>",
  "u11": "<p><b>核心结论：</b>发票和社保是两套独立的合规动作，前者构成收入与成本的证据链，后者构成用工关系的证据链。它们的共同作用是：客户、员工或监管来核对时，你能拿出彼此对得上的记录。社保基数与比例各地不同，以当地最新规定为准。</p><h5>关键概念</h5><ul><li>发票种类：增值税普通发票与专用发票，区别在能否抵扣进项；电子发票与纸质发票法律效力相同，但需要防重复报销。</li><li>开票额度：税务部门核定的单张与月度限额，超限要申请调整，临时大额业务提前沟通。</li><li>作废与红冲：当月开具且未认证的发票通常可作废；跨月或已认证的走红字冲销，具体操作以电子税务局指引为准。</li><li>社保公积金：开户、增员、减员、基数申报各有周期，基数上下限与缴费比例按当地规定执行。</li></ul><h5>操作步骤</h5><ol><li>建发票台账：开票日期、号码、类型、对方、金额、税率、对应合同、回款状态、经办人。</li><li>收票先验真，再看抬头、税号、项目名称是否与合同一致，缺项当场退回补开。</li><li>出现退货或开错，先判断是否跨月、是否已认证，再选择作废或红冲，保留沟通记录。</li><li>员工入职按当地时限办理社保增员，离职及时减员，避免多缴或断缴。</li><li>每月核对缴费明细与工资表的人数、基数，差异当月处理，不拖到年底。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队接了一个跨季度项目，客户要求先开票后付款。台账里把这张票标为“已开票未回款”，约定开票后十五天跟进。第二个月客户要求更换开票主体，因已跨月，走红冲后重开，过程留了邮件和聊天记录，后续对账没有争议。同期招的一名兼职，先按当地口径判断是否构成劳动关系，最终以劳务结算并代扣个税。</p><h5>模板 / 清单</h5><ul><li>发票台账：日期、号码、类型、金额、税率、合同号、回款、经办。</li><li>收票检查清单：抬头、税号、金额、项目名称、备注栏、开票人。</li><li>社保公积金办理清单：开户、增员、减员、基数调整、缴费、凭证留存。</li><li>月度一致性核对表：工资人数、社保人数、个税申报人数三列对照。</li></ul><h5>常见误区</h5><ul><li>电子发票重复打印报销，没有查重机制。</li><li>跨月发票直接作废，导致申报数据与账面不一致。</li><li>用“先不开票”拖延收入，客户催票时才补，风险只是后移。</li><li>员工口头放弃社保就真不缴，私下约定不能替代法定义务。</li><li>缴费基数一律按最低标准，长期与工资表明显不匹配。</li></ul>",
  "u12": "<p><b>核心结论：</b>利润表说明生意是否成立，现金流量表说明还能活几个月。小团队倒下多数不是不赚钱，而是回款没到、工资要发、账期错配。十二个月滚动现金流表是唯一能提前看见缺口的工具。这张表至少要能回答三个问题：哪个月现金最低、缺口多少、当时靠什么补上。</p><h5>关键概念</h5><ul><li>直接法：期初现金＋经营流入－经营流出±投资±筹资＝期末现金，逐项列示比倒推可靠。</li><li>利润与现金的分离：应收、预收、存货、押金、折旧都会让两者拉开距离，差额要能解释。</li><li>账期与回款周期：合同付款节点、实际到账天数、客户内部审批时长是三件事，不能混用。</li><li>安全现金红线：账上现金低于几个月固定支出就必须启动预案，月数由团队风险承受力决定。</li></ul><h5>操作步骤</h5><ol><li>拉出过去六个月银行流水，把支出分成固定、变动、一次性三类，算出月均刚性支出。</li><li>按月列回款计划，用历史实际到账天数做基准，不用合同账期；大客户单独一行，标注审批人和平均审批天数。</li><li>做保守、基准、乐观三张表，保守情景把回款推迟三十天、收入打八折。</li><li>找出三张表里现金最低的月份，标注缺口金额和成因。</li><li>为最低点写三个应对动作：延后非刚性支出、集中催收、短期融资或缩编，并指定触发条件与决策人。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，年框客户按季付款，讲师费和场地费却要月付。做完现金流表发现第四个月现金最低，因为一笔大额尾款要等到第五个月。他们做了两件事：新项目首付款比例从三成提到五成，场地年租改为按次结算。缺口从预估的两个月工资降到半个月，没有动用备用金。</p><h5>模板 / 清单</h5><ul><li>十二个月现金流表：月份、期初、经营流入、经营流出、投资、筹资、期末。</li><li>三情景假设表：回款延迟天数、收入折扣、成本上浮幅度，三列并排。</li><li>现金红线与预案：触发条件、对应动作、决策人、执行时限。</li><li>融资准备清单：用途、金额、期限、还款来源、可提供的证明材料。</li></ul><h5>常见误区</h5><ul><li>拿合同金额当回款，忽略审批流程和账期。</li><li>只做一版预测，没有保守情景，一有延迟就临时找钱。</li><li>把押金、保证金当成可支配现金。</li><li>融资缺口算成“差多少补多少”，没算利息和还款期。</li><li>表做完就不更新，实际与计划脱节三个月才发现。</li></ul>",
  "u13": "<p><b>核心结论：</b>MVP 的判断标准不是功能多少，而是能不能用最小成本回答一个关键问题：有人愿意为这件事付出钱、时间或注意力。做不出来的原因通常不是资源不够，而是想验证的假设太多，一次摊开就哪个都验不清。</p><h5>关键概念</h5><ul><li>关键假设：拆成价值假设（有人需要）和增长假设（能持续获得用户），一轮只验一个。</li><li>最小成本形态：预售、落地页加等候名单、人工代跑服务、现成工具拼接，都能在不动代码的情况下拿到信号。</li><li>成功标准前置：先写清“看到什么算通过”再做实验，避免事后给数据找解释。</li><li>范围边界：必须有、暂时不做、明确不做三档写清，防止范围一点点蔓延。</li></ul><h5>操作步骤</h5><ol><li>列出所有假设，用“不成立则整个项目不成立”的标准筛出三个。</li><li>每个假设写成可验证的一句话，例如“十位目标客户里有三位愿意先付费”。</li><li>选最便宜的形式：能人工就不做系统，能用现成工具就不自研。</li><li>设定周期与样本量，七天内拿到第一批真实反馈，逐条记录拒绝理由的原话。</li><li>复盘时按标准判定通过、部分通过、不通过；不通过就改假设，不加功能。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队想搭线上学习平台。他们没有先开发，而是用一份课程大纲做落地页，向三十位企业 HR 发出试听邀请，承诺两周内开课。十一人报名、四人愿付定金，课程用会议软件直播、资料用共享文档发放。这一轮验证了内容需求，也暴露真正的卡点是“学完没有作业反馈”，于是第二版才投入做批改流程，省掉了半个平台的开发量。</p><h5>模板 / 清单</h5><ul><li>MVP 范围表：必须有、暂不做、明确不做、验证指标、周期、负责人。</li><li>假设清单：假设、验证方式、成功标准、样本量、截止日。</li><li>实验记录：日期、接触人数、响应、拒绝原因原话、观察人。</li><li>上线检查：真实用户能否用、支付是否跑通、联系方式与数据回收方式是否就位。</li></ul><h5>常见误区</h5><ul><li>把 MVP 当成“功能少的正式产品”，一做就是三个月。</li><li>只找朋友测试，收回来的都是鼓励而不是购买信号。</li><li>成功标准写成“用户觉得不错”，事后无法判定。</li><li>一次验证五个假设，结果好也不知道是哪个起了作用。</li><li>收到负面反馈就加功能，而不是回去修假设。</li></ul>",
  "u14": "<p><b>核心结论：</b>交付质量靠流程固定，不靠个人状态和临场发挥。把接单到回访拆成五段，每段有可交付物、责任人和验收标准，团队换人、订单变多时才不会失控。SOP 的作用是让新人第一次做也能达到及格线。</p><h5>关键概念</h5><ul><li>五段流程：接单确认、排期、执行、验收、回访，每段都有输入、输出和责任人。</li><li>可交付物：客户能看见、能签字确认的成果，例如方案文档、成品文件、验收单。</li><li>验收清单：把“做好”翻译成可勾选的条件，减少“我以为”的争议。</li><li>返工规则：区分需求变更、执行失误、客户主观不满意，责任不同，成本承担也不同；每次返工都要登记在验收单上。</li></ul><h5>操作步骤</h5><ol><li>画出当前交付流程，标出每个环节的实际耗时和最常见的延误点。</li><li>为每段写清输入、输出、责任人、时限，形成一页纸的 SOP v1，不要写成手册。</li><li>制作验收清单，交付前执行人自检、负责人复核，两项都过才发客户；清单之外的口头认可不算交付完成。</li><li>约定变更流程：口头需求一律书面确认，涉及工作量变化先报价再动手。</li><li>连续记录三单的耗时、返工率、客户反馈，据此改 SOP，不凭印象改。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，接单后全靠微信沟通，出现过两次“客户以为含考试服务、团队以为不含”的纠纷。他们加了接单确认单，写清课程时长、人数上限、是否含考试与证书、修改次数，客户确认后才进排期表。验收清单设了六项，交付前逐项自检。从第三单起，返工从平均两次降到零次，回访时客户也能直接说出收到了哪些交付物。</p><h5>模板 / 清单</h5><ul><li>接单确认单：范围、交付物、时间、价格、修改次数、付款节点、双方确认人。</li><li>排期表：订单、开始、截止、责任人、依赖项、当前状态。</li><li>验收清单：六到十项可勾选条件、自检人、复核人、日期。</li><li>返工责任判定表：原因类型、承担方、处理方式、记录人。</li></ul><h5>常见误区</h5><ul><li>SOP 写成十几页，团队不看，等于没有。</li><li>验收标准只留在负责人脑子里，执行人靠猜。</li><li>客户口头加需求就免费做，成本一点点吃掉利润。</li><li>出问题先追责后复盘，同类问题反复出现。</li><li>只记录顺利的订单，延误原因没人整理。</li></ul>",
  "u15": "<p><b>核心结论：</b>供应链管理的目标不是拿到最低价，而是在价格、交期、质量之间找到可承受的组合，并保证关键环节断了还能继续交付。单一来源是隐藏最深的一项成本，平时看不出来，出事时直接停摆。关键物料的备选至少要能覆盖一个完整交付周期，否则名单再长也没用。</p><h5>关键概念</h5><ul><li>六个比较维度：价格、最小起订量、交期、账期、良品率、响应速度，只看价格容易误判。</li><li>单点依赖：只有一个供应商、一个规格或一种物流方式，任何一环出问题都会传导到交付。</li><li>总拥有成本：采购价之外还有运费、损耗、返工、资金占用和切换成本。</li><li>备选可用性：备选供应商要真实下过小单、验过货，只留在通讯录里的不算备选。</li></ul><h5>操作步骤</h5><ol><li>列出全部外购项，按“断供会影响多少订单”排序，找出前三个关键项。</li><li>每个关键项找两到三家询价，用同一份需求说明，避免报价口径不一致。</li><li>做对比表，把价格、起订量、交期、账期、良品率、响应速度逐项打分；打分前先定权重，避免凭印象拍板。</li><li>给备选下一笔小单试跑，记录实际交期和质量问题，而不是听承诺。</li><li>写应急切换卡：触发条件、联系人、替代规格、预估切换天数、决策人。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，长期只用一家印刷厂做教材，价格便宜但旺季交期不稳。一次客户临时把开班提前一周，教材差点没到。之后他们找了两家备选，各下二十本试单，记录实际交期和装订质量，把“提前十天以上下单”写进 SOP，并保留一家能接小批量加急的供应商。单价多花不到一成，换掉了每次开课前的焦虑。</p><h5>模板 / 清单</h5><ul><li>关键外购项清单：项目、影响订单数、当前供应商、断供风险等级。</li><li>供应商对比表：价格、起订量、交期、账期、良品率、响应速度、综合评分。</li><li>试单记录：日期、数量、实际交期、问题、处理结果、是否继续合作。</li><li>应急切换卡：触发条件、备选联系人、替代规格、切换天数、决策人。</li></ul><h5>常见误区</h5><ul><li>只比单价，忽略运费、损耗和账期带来的资金成本。</li><li>备选供应商只写在名单上，从未下过单。</li><li>把供应商的口头交期当成实际交期，不留缓冲。</li><li>采购集中在一人手里，价格和交期信息不透明。</li><li>出了问题才谈条件，平时没有季度回顾。</li></ul>",
  "u16": "<p><b>核心结论：</b>招聘的起点不是写 JD，而是说清这个岗位六个月内要交付什么结果。产出定义清楚，才知道该找什么人、用什么问题筛、试用期怎么判断去留。先招人再想让他做什么，是早期团队最常见的一笔冤枉钱。</p><h5>关键概念</h5><ul><li>先定产出再定岗位：把“需要有人负责的事”写成可衡量的结果，再倒推能力要求。</li><li>岗位画像：职责、产出、必备能力、加分项、明显不合适的特征，五栏写清。</li><li>结构化面试：同一组问题、同一套评分标准，候选人才具备可比性。</li><li>STAR 追问：情境、任务、行动、结果，重点追问“你具体做了什么”，而不是“你们团队怎么做”。</li></ul><h5>操作步骤</h5><ol><li>写下前三个岗位各自六个月内必须交付的两到三个结果，尽量带数量或时限。</li><li>把结果拆成能力项，区分必须项与加分项，删掉“沟通能力强”这类无法验证的描述。</li><li>写一页 JD：岗位目标、主要职责、产出指标、必备条件、汇报关系、薪酬区间。</li><li>设计五个问题，每个对应一项能力，配一到五分评分标准，写明高分行为样例。</li><li>面试当天完成打分并记录原话，试用期目标写进录用通知附件。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队要招第一位课程运营，原 JD 写“有运营经验、执行力强”，两个月没招到合适的人。改成“三个月内独立完成二十场课程的排期、通知与回访，学员满意度不低于内部基线”后，面试问题也随之变成“你过去怎么处理临时改期”“满意度下滑时你怎么定位原因”。候选人池变小了，但入职者的试用期目标可以直接对照，第三个月就能判断是否合格。</p><h5>模板 / 清单</h5><ul><li>岗位产出表：岗位、六个月产出、衡量方式、所需资源、验收人。</li><li>一页 JD：目标、职责、产出、必备、加分、汇报关系、薪酬区间。</li><li>面试评分表：能力项、对应问题、一到五分行为描述、权重、总分。</li><li>试用期目标：三十、六十、九十天里程碑，验收人与复盘日期。</li></ul><h5>常见误区</h5><ul><li>照抄大公司 JD，要求列一长串，实际工作用不上。</li><li>面试凭感觉，几个人各问各的，候选人无法比较。</li><li>只问假设性问题，不问过去真实做过的事。</li><li>试用期没有明确目标，到期只能凭印象决定去留。</li><li>招人前没算这个岗位的产出能否覆盖它的成本。</li></ul>",
  "u17": "<p><b>核心结论：</b>小团队薪酬的关键不是“给得高”，而是“算得清、讲得明、留得住关键人”。先定产出再定价，固定部分保生存，浮动部分绑结果，长期激励只给难以替代的岗位。</p><h5>关键概念</h5><ul><li>固定工资：覆盖岗位市场区间的中位偏低，保证基本生活，不让人因现金流焦虑分心。</li><li>浮动奖金：与可量化结果挂钩，如回款额、交付准时率、续约率，单项一般不超过固定工资的三成。</li><li>长期激励：股权或期权，给承担长期风险且难以替换的岗位，不给“帮忙性质”的人。</li><li>薪酬带宽：同岗设下限、中位、上限三档，同岗不同人的差距要能解释。</li><li>内部公平：相邻岗位带宽有重叠，晋升对应明确的加薪幅度。</li></ul><h5>操作步骤</h5><ol><li>为每个岗位写清三项核心产出与衡量口径，包含数量、质量、时限。</li><li>查同城同岗位公开薪酬区间，取中位数的八成到一倍二设带宽。</li><li>把月度现金拆成固定七到八成、浮动两到三成，浮动规则写成可代入的公式。</li><li>设三个调薪触发条件，如转正、连续两季达标、职责扩大，并写明幅度。</li><li>与每位成员一对一过一遍“你的钱怎么算”，让对方当场能复算。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，原先三人月薪相同，讲课多的和做后台的一样，半年后主力讲师离职。改成“固定工资加课时浮动加续约奖金”后，多讲多得；后台岗改设交付准时率奖金，内部矛盾随之减少。</p><h5>模板 / 清单</h5><ul><li>岗位名、核心产出、衡量口径、带宽下限到上限。</li><li>固定与浮动比例、浮动计算公式、封顶值。</li><li>发放周期与结算口径，按回款还是按签约必须写明。</li><li>调薪触发条件、幅度、复核日期。</li><li>长期激励对象、数量、成熟安排，需律师与会计师复核。</li></ul><h5>常见误区</h5><ul><li>用“以后给你股份”代替当下现金，只有口头承诺，后期必起争议。</li><li>浮动规则只写“看表现”，员工无法预判，激励变成怨气。</li><li>一人一价又不解释，同岗差距被知道后破坏信任。</li><li>把社保和个税当成额外福利来谈，合规缴纳是义务，具体以当地最新规定为准。</li><li>承诺超出当期现金能力的高固定工资，现金流一断就得裁员。</li></ul>",
  "u18": "<p><b>核心结论：</b>股权问题多数不是“分多少”，而是“什么情况失去、怎么退出”没写清。赚钱之前先把成熟、回购、决策、退出四件事写进书面协议，比反复争论比例更有用。</p><h5>关键概念</h5><ul><li>成熟机制：股权按时间或里程碑分批归属，常见做法是四年按月成熟。</li><li>cliff：满一定期限才成熟第一批，未满期限离职通常不带走。</li><li>回购：约定离职时由公司或创始人按什么价格买回未成熟或已成熟股份。</li><li>三类权利要分清：股权是所有权，期权是未来按约定价格购买的权利，分红权只分利润不带表决。</li><li>控制权：表决权比例、董事会席位、一票否决事项，可以与持股比例不完全一致。</li><li>代持：名义股东与实际出资人不一致，存在被强制执行与身份认定困难的风险。</li></ul><h5>操作步骤</h5><ol><li>列出每位合伙人的投入，包括现金、全职时间、客户资源、技术，折算成可比较的口径。</li><li>先定谁做什么决定：日常经营、预算超限、引入新股东、解散，逐项写表决规则。</li><li>设成熟表：总比例、成熟年限、cliff 期限、按月或按季归属。</li><li>写离职处理：主动离职、过错离职、丧失劳动能力、身故四种情形分别怎么回购、按什么价格。</li><li>约定增资与反稀释，后续融资或新合伙人进入时老股东如何被稀释。</li><li>先出一页条款清单，再交律师起草正式协议。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，早期口头约定三人均分。一人半年后退出并要求按当前估值变现，因没有成熟与回购条款，只能临时谈判，现金被抽走，剩下两人几乎停摆。事后补签成熟与回购条款，新合伙人按四年成熟进入。</p><h5>模板 / 清单</h5><ul><li>各方主体、出资额与方式、到位时间。</li><li>股权比例、成熟年限、cliff、加速条件。</li><li>表决规则与一票否决事项清单。</li><li>离职回购：四种情形、价格口径、支付期限。</li><li>竞业与保密、知识产权归属、分红政策、僵局解决方式。</li></ul><h5>常见误区</h5><ul><li>只谈比例不谈成熟，人走了股份收不回来。</li><li>用“干股”“分红权”含糊表述，事后被认定为股权。</li><li>代持不签书面协议，实际出资人举证困难。</li><li>把公司章程当形式，工商登记与内部约定不一致。</li><li>协议签完就不再更新，融资与人员变化后条款失效。股权、税负与工商变更的具体口径以当地最新规定为准，正式文本由律师起草、会计师复核。</li></ul>",
  "u19": "<p><b>核心结论：</b>早期不要全渠道铺开。用小预算把三个渠道各跑两周，拿到可比较的获客成本与线索质量，再决定把预算压到哪一个。</p><h5>关键概念</h5><ul><li>渠道分类：搜索、内容、社交、渠道合作、线下、老客转介绍，各自触达逻辑不同。</li><li>获客成本：渠道投入含人力分摊，除以新增有效客户数，不是除以线索数。</li><li>有效线索：有明确需求、有预算、能联系上，三个条件缺一不算。</li><li>归因口径：客户可能接触多个渠道，要事先约定以首次有效咨询为准还是以成交前最后一次为准，全程统一。</li><li>回本周期：获客成本除以单客月毛利，决定这个渠道能不能长期投。</li></ul><h5>操作步骤</h5><ol><li>按“客户在哪、怎么找到我们”列出五到六个候选渠道，先排除明显不匹配的。</li><li>选三个渠道，每个设五百到一千元预算、两周周期，只考核有效咨询一个目标。</li><li>给每个渠道建独立入口：专用二维码、专属话术、独立表单，保证来源可追。</li><li>每天记录曝光、点击、咨询、有效线索、成交，当天不回填等于白跑。</li><li>两周后算每个渠道的获客成本、有效线索率、成交率，做横向对比。</li><li>保留一个成本可接受且线索稳定的渠道加预算，其余暂停或换打法。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队原先靠朋友介绍，线索不稳。用三个渠道各投八百元测两周：行业社群分享带来十二条咨询、四条有效；短视频投流带来三十条咨询、两条有效；老客转介绍零成本带来三条有效。结论是把精力放在社群与转介绍，投流暂停。</p><h5>模板 / 清单</h5><ul><li>渠道名、入口方式、预算、周期、负责人。</li><li>曝光、点击、咨询、有效线索、成交分列，不合并。</li><li>渠道投入合计：广告费、人力分摊、物料。</li><li>获客成本、有效线索率、成交率、回本周期。</li><li>结论栏：加投、维持或暂停，附下一步动作与复盘日期。</li></ul><h5>常见误区</h5><ul><li>用总咨询数算成本，把无效咨询算成客户，渠道看着很好实际亏钱。</li><li>多个渠道共用同一个联系方式，来源无法区分，数据全废。</li><li>只投一周就下结论，样本太小，波动被当成趋势。</li><li>只算广告费，忽略人力与物料，成本被低估。</li><li>同时改产品、改价格、改渠道，无法判断是哪个因素起了作用。</li></ul>",
  "u20": "<p><b>核心结论：</b>内容不是发得多就有单，而是四类内容各司其职，把“看见、相信、咨询、成交”串成一条能算出转化率的路径。</p><h5>关键概念</h5><ul><li>四类内容：认知解决“你是谁”，兴趣给具体场景与方法，信任靠案例与过程，成交讲清服务边界与行动入口。</li><li>钩子：前两行决定是否继续看，要直指具体人群与具体问题。</li><li>转化路径：钩子、价值证明、行动号召、跟进，每一环都要有可统计的动作。</li><li>分段转化率：曝光到互动、互动到咨询、咨询到成交，分开算，不要只看总成交。</li><li>跟进节奏：首次响应时限与第三天、第七天的回访节点，超时后成交率明显下降。</li></ul><h5>操作步骤</h5><ol><li>选一个平台，先确认目标客户真的在这里，不要一开始就多平台同时做。</li><li>按四类内容各写一条，连续四周发布，固定发布时间。</li><li>每条只设一个行动号召，如私信关键词、填表、加联系方式，不要同时要求三件事。</li><li>建一张漏斗表，记录曝光、互动、咨询、有效咨询、成交五个数。</li><li>咨询统一用一套话术：确认场景、问预算与时间、给方案边界、明确下一步。</li><li>四周后只优化转化率最低的那一环，不要同时改多处。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，原先每条内容末尾都写“欢迎咨询”，咨询少且质量差。改成认知类讲“新员工上手慢的三种原因”，信任类讲一次课程交付的完整过程与脱敏后的客户反馈，成交类只写“回复关键词领课程大纲”，咨询量上升，多数能直接谈需求。</p><h5>模板 / 清单</h5><ul><li>内容编号、类型、目标人群、钩子、行动号召。</li><li>发布日期与平台、曝光、互动、咨询、有效咨询、成交。</li><li>各环节转化率与最低环节标注。</li><li>咨询话术四问：场景、预算、时间、决策人。</li><li>跟进节点：首次响应、第一天、第三天、第七天，各附话术与放弃标准。</li></ul><h5>常见误区</h5><ul><li>每条内容都在卖，没有认知与信任铺垫，咨询成本高。</li><li>一条内容放三个行动号召，用户不知道做什么，转化被稀释。</li><li>只看点赞与播放，不看咨询与成交，自我感觉良好。</li><li>咨询不记录来源与结果，算不出哪条内容真正带来客户。</li><li>承诺效果与收益，存在宣传合规风险，表述要保守并保留依据。</li></ul>",
  "u21": "<p><b>核心结论：</b>早期最该盯的不是注册数、粉丝数，而是留存率、复购率、毛利率、回款天数这四个能决定生死的数。按首购月份分组看留存，才看得清问题出在哪。</p><h5>关键概念</h5><ul><li>虚荣指标：累计用户数、累计曝光、粉丝数，只涨不降，却指导不了决策。</li><li>经营指标：复购率、留存率、毛利率、回款周期、单客毛利。</li><li>同期群：按首次购买月份把客户分组，看每组在第一个月、第二个月、第三个月还剩多少。</li><li>留存曲线：横轴是月份，纵轴是剩余比例，曲线走平说明沉淀出一批稳定客户。</li><li>回款周期：从交付到收到钱的平均天数，直接决定现金流生死。</li></ul><h5>操作步骤</h5><ol><li>从现有客户名单里只保留四个字段：首次成交日期、金额、成本、回款日期。</li><li>按首购月份分组，算出每组在第一个月、第二个月、第三个月、第六个月的留存比例。</li><li>选三个核心指标，建议月留存率、复购率、回款天数，把口径写下来固定住。</li><li>建周度表，每周固定时间填一次，不超过三十分钟。</li><li>连续记录四周，画趋势线，标出异常点与可能原因。</li><li>针对最差的一个指标，定一个改进行动与验证周期。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队原先只看当月签单额，月月波动却不知原因。建表后发现三月首购的客户第二个月留存只有两成，五月首购的接近五成，差别在交付后有没有做回访。补上交付后第七天回访，次月留存明显改善。</p><h5>模板 / 清单</h5><ul><li>客户字段：编号、首购月份、金额、成本、回款日期。</li><li>同期群表：首购月份乘以第一个月、第二个月、第三个月、第六个月留存比例。</li><li>三个核心指标：定义、口径、数据来源、负责人。</li><li>周度记录：新增、复购、流失、回款金额与天数。</li><li>异常标注：数值突变的原因假设与验证动作。</li></ul><h5>常见误区</h5><ul><li>用累计客户数当成绩，掩盖每月都在流失的事实。</li><li>留存率口径每月变，数字好看却无法纵向比较。</li><li>只算收入不算成本，毛利为负还在扩张。</li><li>数据靠回忆补填，错漏多，结论不可用。</li><li>指标设太多，每周填两小时，坚持三周就放弃。</li></ul>",
  "u22": "<p><b>核心结论：</b>合同审查的功夫在“能不能执行”：主体是否真实、钱怎么付、交付怎么验收、违约怎么算、争议去哪里解决。这五件事写不清，条款再多也难落地。</p><h5>关键概念</h5><ul><li>八要素：主体、标的、价款、付款、交付、验收、违约、争议解决。</li><li>主体核验：对方名称与营业执照一致，签约人有授权，经营范围覆盖该交易。</li><li>付款节点：预付、进度款、尾款各占多少，分别绑定签约、交付、验收等具体动作。</li><li>验收标准：可量化的交付物、明确验收期限、逾期未提异议视为通过的约定。</li><li>违约与解除：违约金计算方式、上限、解除条件与后果。</li><li>知识产权与保密：成果归谁、能否复用、保密期限多长。</li></ul><h5>操作步骤</h5><ol><li>先查主体：营业执照、信用信息、涉诉记录、签约人授权文件。</li><li>把标的写成可验收的清单，含数量、规格、交付形式、时间点。</li><li>付款与验收绑定，每一笔钱对应一个可验证的动作，不接受“完成后付”。</li><li>写清违约：逾期交付、质量不符、逾期付款各自怎么算，并设上限。</li><li>明确争议解决：协商期限、管辖法院或仲裁机构，二者只能选一个。</li><li>用审查清单逐条打勾，把修改意见写进批注，再进入谈判。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队接了一个二十人的内训单，合同只写“培训结束后付款”。交付后对方以效果不满意为由拖了两个月，团队没有验收标准和异议期限，只能反复沟通。后续版本加入“课程结束当场签署验收单，七日内未提书面异议视为验收通过，尾款十五日内支付”，回款顺畅很多。</p><h5>模板 / 清单</h5><ul><li>主体：名称一致、授权文件、经营范围、通知送达地址。</li><li>标的与价款：数量、规格、交付形式、含税与否、发票类型与时点。</li><li>付款：节点、比例、触发条件、逾期利息。</li><li>验收：标准、期限、异议方式、视为通过条款。</li><li>违约与争议：情形、计算方式、上限、协商期、管辖地或仲裁机构。</li><li>附项：保密与知识产权归属、不可抗力。</li></ul><h5>常见误区</h5><ul><li>只看金额不看验收，交付后没有依据主张完成。</li><li>接受验收合格后付款却不写验收期限，对方无限期拖。</li><li>违约金只写按实际损失赔偿，举证困难，等于没约定。</li><li>同时约定法院和仲裁，条款可能被认定无效。</li><li>口头变更不落书面，履行中产生争议无法举证。合同效力、违约金上限、管辖约定的具体规则以当地最新规定为准，重要合同请律师审核。</li></ul>",
  "u23": "<p><b>核心结论：</b>品牌名、Logo、内容、代码、方法流程，归属不清就是给别人留机会。先做权属清单，再按“商标先查再注册、著作权留痕、商业秘密靠制度”的顺序落动作。</p><h5>关键概念</h5><ul><li>商标：按四十五个类别注册，先做近似查询，注册周期通常数月，以官方实际进度为准。</li><li>著作权：作品完成即自动产生，登记是取证手段，不是权利来源。</li><li>专利三类：发明、实用新型、外观设计，保护对象与周期不同。</li><li>商业秘密：需同时满足非公开、有商业价值、已采取保密措施三个条件。</li><li>权属：职务成果、外包成果、合作成果，归属都要在合同里写明。</li></ul><h5>操作步骤</h5><ol><li>列清单：品牌名、Logo、标语、课程内容、代码、客户名单、方法流程。</li><li>商标先做近似查询，确定核心类别与防御类别。</li><li>提交注册，同步保存使用证据：上线时间、宣传物料、销售记录。</li><li>内容与代码留痕：版本记录、创作时间、作者，重要的做著作权登记。</li><li>员工与外包合同加权属条款：成果归公司、保密义务、离职交接要求。</li><li>建立保密制度：信息分级、访问权限、离职面谈与设备回收。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，课程大纲由兼职讲师编写，合同没写归属。讲师离开后把同一套课程卖给竞争对手，团队无法主张权利。之后所有外包合同加入“成果著作权归我方，讲师不得复用与对外讲授”，并为核心课程名称申请商标。</p><h5>模板 / 清单</h5><ul><li>资产名、类型、权利人、状态四列对照。</li><li>商标：类别、申请号、状态、续展日期提醒。</li><li>著作权：作品名、完成时间、登记号、使用证据存放位置。</li><li>专利：类型、申请日、年费缴纳提醒。</li><li>合同条款：职务成果归属、外包权属、保密期限、竞业范围。</li><li>内部制度：权限分级、外发审批、离职交接清单。</li></ul><h5>常见误区</h5><ul><li>先推广再注册，品牌做起来才发现已被他人注册。</li><li>只注册核心类别，周边类别被抢注后陷入被动。</li><li>认为“我做的就归我”，外包与职务成果没约定归属。</li><li>商业秘密没有任何保密措施，泄密后难以主张。</li><li>把登记证书当万能证据，实际使用证据反而缺失。商标审查与专利授权的具体标准以当地最新规定为准，关键申请请代理机构或律师复核。</li></ul>",
  "u24": "<p><b>核心结论：</b>数据合规的底线是只收必要的最少信息、说清用途、到期就删；纠纷处理的关键是平时把证据留全，出事二十四小时内能拿出完整记录。</p><h5>关键概念</h5><ul><li>最小必要：不因为“以后可能有用”就收集手机号、身份证号、住址。</li><li>告知同意：收集前告知目的、方式、范围、保存期限，并取得明确同意。</li><li>目的限定：收集时说的用途，不能事后扩大使用。</li><li>保存期限：到期删除或匿名化处理，不无限期留存。</li><li>敏感个人信息：生物识别、金融账户、健康医疗等，要求更严格。</li><li>数据跨境：向境外提供数据有单独要求，需评估与告知。</li></ul><h5>操作步骤</h5><ol><li>盘点现有客户数据字段，逐个标注用途、来源、保存期限、存放位置。</li><li>删掉没有明确用途的字段，能匿名就不实名，能少收就不多收。</li><li>补全告知与同意：表单加简短说明，重要场景单独勾选，不用默认勾选。</li><li>设权限：谁能看、谁能导出、多久复核一次，导出必须留记录。</li><li>定保存期限与删除动作：到期提醒、删除方式、删除记录。</li><li>建取证包：合同、沟通记录、交付凭证、验收单，统一命名并备份。</li></ol><h5>案例</h5><p>一家做企业培训的三人团队，报名表收集了身份证号与家庭住址，实际只用于开票与寄教材。盘点后改成只收姓名、单位、开票信息与收件地址，并在表单加一句用途说明。后来一次“未收到课程”的争议，当天就调出了签到与验收记录。</p><h5>模板 / 清单</h5><ul><li>字段清单：字段名、用途、是否必要、保存期限、存放位置、可访问人。</li><li>告知文本要素：收集方、目的、范围、保存期限、联系方式、撤回方式。</li><li>权限表：角色、可查看范围、可导出范围、复核周期。</li><li>删除记录：到期日、删除方式、执行人、确认人。</li><li>取证包：合同与订单、沟通记录、付款凭证、交付与验收记录。</li><li>事件响应：发现时间、影响范围、内部上报、对外通知与补救。</li></ul><h5>常见误区</h5><ul><li>表单一次收全，后面根本不用，风险却一直背着。</li><li>用默认勾选代替明确同意，同意无法成立。</li><li>客户数据存在个人手机与私人网盘，人员离职即失控。</li><li>出事才找记录，聊天记录已删、验收单没签。</li><li>认为小团队不会被关注，忽视基本合规义务。个人信息处理、跨境传输、泄露通知的具体要求以当地最新规定为准，涉及敏感信息或跨境业务请咨询专业律师。</li></ul>"
};

/* ================= 工具 ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){
  if(!s) return null;
  const p = String(s).slice(0,10).split('-').map(Number);
  if(p.length !== 3 || !p[0]) return null;
  return new Date(p[0], p[1]-1, p[2]);
}
function addDays(s, n){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function weekStart(s){
  const d = parseYmd(s) || new Date();
  d.setDate(d.getDate() - (d.getDay()+6)%7);
  return ymd(d);
}
function diffDays(a, b){
  const A = parseYmd(a), B = parseYmd(b);
  if(!A || !B) return 0;
  return Math.round((B - A)/86400000);
}
function fmtCN(s){
  const d = parseYmd(s); if(!d) return '—';
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
}
function relDay(s){
  if(!s) return '未排期';
  const n = diffDays(todayStr(), s);
  if(n === 0) return '今天';
  if(n === 1) return '明天';
  if(n === -1) return '昨天';
  return n > 0 ? n+' 天后' : (-n)+' 天前';
}
function clip(s, n){
  const t = String(s==null ? '' : s);
  return t.length > n ? t.slice(0, n) + '…' : t;
}
let _seq = 0;
function uid(){ _seq++; return 'local-' + Date.now().toString(36) + '-' + _seq; }
function byOrder(a, b){ return (a.order||0) - (b.order||0); }

/* ================= 种子与数据层 ================= */
function emptyData(){
  return {modules:[],units:[],practices:[],results:[],reviews:[],archives:[]};
}
function seedData(){
  const now = new Date().toISOString();
  const units = UNIT_SEED.map((u,i)=>Object.assign({}, u, {
    status:'未开始', notes:'', sample:false,
    order: i+1, created_at: now, updated_at: now
  }));
  return {
    modules: MODULES_SEED.map((m,i)=>Object.assign({}, m, {order:i+1, builtin:true})),
    units, practices: [], results: [], reviews: [], archives: []
  };
}
function normalize(d){
  const o = emptyData();
  TABLES.forEach(t=>{ o[t] = Array.isArray(d && d[t]) ? d[t] : []; });
  return o;
}
function syncCurriculum(d){
  const now = new Date().toISOString();
  const mm = {}; MODULES_SEED.forEach(m=>{ mm[m.id] = m; });
  d.modules = d.modules.map(m=> mm[m.id] ? Object.assign({}, mm[m.id], {order:m.order, builtin:true}) : m);
  MODULES_SEED.forEach((m,i)=>{
    if(!d.modules.some(x=>x.id === m.id)) d.modules.push(Object.assign({}, m, {order:i+1, builtin:true}));
  });
  const um = {}; UNIT_SEED.forEach(u=>{ um[u.id] = u; });
  d.units = d.units.map(u=>{
    const s = um[u.id];
    if(!s) return u;
    return Object.assign({}, u, {module_id:s.module_id, title:s.title, goal:s.goal, points:s.points, hours:s.hours});
  });
  UNIT_SEED.forEach((u,i)=>{
    if(!d.units.some(x=>x.id === u.id)){
      d.units.push(Object.assign({}, u, {
        status:'未开始', notes:'', sample:false, order:i+1,
        created_at:now, updated_at:now
      }));
    }
  });
}
function clearDemo(d){
  const now = new Date().toISOString();
  let touched = false;
  d.units = d.units.map(u=>{
    if(!u.sample) return u;
    touched = true;
    return Object.assign({}, u, {status:'未开始', notes:'', sample:false, updated_at:now});
  });
  ['practices','results','reviews','archives'].forEach(t=>{
    const kept = d[t].filter(x=>!x.sample);
    if(kept.length !== d[t].length){ touched = true; d[t] = kept; }
  });
  return touched;
}
function resetLearning(d){
  const now = new Date().toISOString();
  d.units = d.units.map(u=>Object.assign({}, u, {
    status:'未开始', notes:'', sample:false, updated_at:now
  }));
  d.practices = []; d.results = []; d.reviews = []; d.archives = [];
}
const Store = { data: emptyData() };

function lsWrite(d){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({v:CONTENT_VERSION, updated_at:new Date().toISOString(), tables:d}));
  }catch(e){
    toast('本地存储写入失败', true);
  }
}
function lsRead(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const j = JSON.parse(raw);
      const d = j && j.tables ? j.tables : j;
      const ver = j && typeof j.v === 'number' ? j.v : 0;
      const n = normalize(d);
      if(n.modules.length || n.units.length || n.practices.length){
        let touched = false;
        if(ver < CONTENT_VERSION){
          try{ syncCurriculum(n); touched = true; }catch(e){}
        }
        if(ver < RESET_VERSION){
          resetLearning(n); touched = true;
        }
        if(clearDemo(n)) touched = true;
        if(touched) lsWrite(n);
        return n;
      }
    }
  }catch(e){}
  const s = seedData();
  lsWrite(s);
  return s;
}
function save(){ lsWrite(Store.data); }
function createRow(table, row){
  const now = new Date().toISOString();
  const rec = Object.assign({id:uid(), created_at:now, updated_at:now}, row);
  Store.data[table] = (Store.data[table] || []).concat(rec);
  save();
  return rec;
}
function updateRow(table, id, patch){
  const arr = Store.data[table] || [];
  const i = arr.findIndex(r=>r.id === id);
  if(i < 0) return null;
  arr[i] = Object.assign({}, arr[i], patch, {updated_at:new Date().toISOString()});
  save();
  return arr[i];
}
function deleteRow(table, id){
  Store.data[table] = (Store.data[table] || []).filter(r=>r.id !== id);
  save();
}
function ensureModules(){
  MODULES_SEED.forEach((m,i)=>{
    if(!Store.data.modules.some(x=>x.id === m.id)){
      Store.data.modules.push(Object.assign({}, m, {order:i+1,builtin:true}));
    }
  });
  Store.data.modules.sort(byOrder);
}

/* ---------- 查询 ---------- */
function modOf(id){ return Store.data.modules.find(m=>m.id === id) || null; }
function unitOf(id){ return Store.data.units.find(u=>u.id === id) || null; }
function practiceOf(id){ return Store.data.practices.find(p=>p.id === id) || null; }
function moduleUnits(mid){ return Store.data.units.filter(u=>u.module_id === mid).sort(byOrder); }
function sortedModules(){ return Store.data.modules.slice().sort(byOrder); }
function practiceLabel(p){
  if(!p) return '未关联实操';
  const u = p.unit_id ? unitOf(p.unit_id) : null;
  const m = p.module_id ? modOf(p.module_id) : null;
  return (m ? m.title : '未归类') + (u ? ' · ' + u.title : '');
}
function statusBadge(s){
  const c = STATUS_CLASS[s] || '';
  return '<span class="badge s-'+c+'"><i class="bd"></i>'+esc(s)+'</span>';
}
function scoreDots(n){
  n = Number(n) || 0;
  let out = '<span class="score" title="评分 '+n+'/5">';
  for(let i=1;i<=5;i++) out += '<i class="'+(i<=n?'on':'')+'"></i>';
  return out + '</span>';
}

function practicesInScope(scope){
  const all = Store.data.practices;
  return scope === 'all' ? all : all.filter(p=>p.module_id === scope);
}
function unitsInScope(scope){
  const all = Store.data.units;
  return scope === 'all' ? all : all.filter(u=>u.module_id === scope);
}
function resultsInScope(scope){
  if(scope === 'all') return Store.data.results;
  const pids = practicesInScope(scope).map(p=>p.id);
  return Store.data.results.filter(r=>pids.indexOf(r.practice_id) > -1);
}
function reviewsInScope(scope){
  if(scope === 'all') return Store.data.reviews;
  const mids = [scope];
  const pids = practicesInScope(scope).map(p=>p.id);
  return Store.data.reviews.filter(r=>{
    if(r.scope === '模块') return mids.indexOf(r.ref_id) > -1;
    if(r.scope === '实操') return pids.indexOf(r.ref_id) > -1;
    return false;
  });
}
function scopeCounts(scope){
  const units = unitsInScope(scope);
  return {
    units: units.length,
    practices: practicesInScope(scope).length,
    results: resultsInScope(scope).length,
    reviews: reviewsInScope(scope).length
  };
}
function scopeLabel(scope){
  if(scope === 'all') return '全部模块';
  const m = modOf(scope);
  return m ? m.title : '全部模块';
}

/* ================= 表单 ================= */
function fieldHTML(f, val){
  const v = val == null ? (f.value == null ? '' : f.value) : val;
  let inner = '';
  if(f.type === 'select'){
    inner = '<select name="' + f.key + '">' + (f.options || []).map(o=>{
      const ov = (typeof o === 'object' && o !== null) ? o.value : o;
      const ol = (typeof o === 'object' && o !== null) ? o.label : o;
      return '<option value="' + esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>';
    }).join('') + '</select>';
  }else if(f.type === 'textarea'){
    inner = '<textarea name="' + f.key + '" rows="' + (f.rows || 3) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
  }else{
    const num = f.type === 'number' ? ' step="' + (f.step || 1) + '" min="0"' : '';
    inner = '<input name="' + f.key + '" type="' + (f.type || 'text') + '"' + num + ' value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '">';
  }
  return '<div class="f' + (f.full ? ' full' : '') + '"><label>' + esc(f.label) + (f.req ? '<b>*</b>' : '') + '</label>' + inner +
    (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '</div>';
}
function openForm(opt){
  const values = opt.values || {};
  const body = opt.fields.map(f=>fieldHTML(f, values[f.key])).join('');
  openModal(
    '<div class="m-head"><div><span class="eyebrow">' + esc(opt.eyebrow || '') + '</span><h3>' + esc(opt.title) + '</h3>' +
      (opt.sub ? '<div class="sub">' + esc(opt.sub) + '</div>' : '') + '</div>' +
      '<button type="button" class="m-close" data-close aria-label="关闭">' + icon('x',13) + '</button></div>' +
    '<form id="mForm" novalidate><div class="m-body"><div class="form-grid">' + body + '</div></div>' +
      '<div class="m-foot">' +
        (opt.onDelete ? '<button type="button" class="btn danger" data-del>删除</button>' : '') +
        '<button type="button" class="btn" data-close>取消</button>' +
        '<button type="submit" class="btn primary">' + esc(opt.submitText || '保存') + '</button>' +
      '</div></form>', !!opt.wide);
  const form = $('#mForm');
  form.onsubmit = e=>{
    e.preventDefault();
    const v = {};
    new FormData(form).forEach((val,k)=>{ v[k] = typeof val === 'string' ? val.trim() : val; });
    opt.onSubmit(v);
  };
  if(opt.onDelete){
    const del = form.querySelector('[data-del]');
    if(del) del.onclick = opt.onDelete;
  }
  const first = form.querySelector('input:not([type=number]),textarea,select');
  if(first) setTimeout(()=>{ try{ first.focus(); }catch(e){} },40);
}

    eyebrow: v ? 'REVIEW / 编辑' : 'REVIEW / 新建',
    title: v ? '编辑复盘' : '新建复盘',
    sub: '保留做对的、指出要改的、定下一步',
    fields:[
      {key:'ref', label:'复盘对象', type:'select', options:opts, full:true, req:true},
      {key:'date', label:'复盘日期', type:'date'},
      {key:'score', label:'评分（1–5）', type:'select', options:['1','2','3','4','5']},
      {key:'kept', label:'保留 / 做对了什么', type:'textarea', rows:3, full:true},
      {key:'improve', label:'改进 / 哪里不对', type:'textarea', rows:3, full:true},
      {key:'next', label:'下一步动作', type:'textarea', rows:2, full:true},
      {key:'notes', label:'备注', type:'textarea', rows:2, full:true}
    ],
    values:init,
    submitText: v ? '保存修改' : '保存复盘',
    onSubmit:val=>{
      const parts = String(val.ref || '').split('::');
      if(parts.length < 3){ toast('请选择复盘对象', true); return; }
      const scope = parts[0], refId = parts[1], refTitle = parts.slice(2).join('::');
      const row = {scope:scope, ref_id:refId, ref_title:refTitle, date:val.date, score:Number(val.score) || 3, kept:val.kept, improve:val.improve, next:val.next, notes:val.notes};

      else { createRow('reviews', row); }

    },
    onDelete: v ? ()=>{
      if(!confirm('确定删除这条复盘？')) return;
      deleteRow('reviews', v.id); closeModal(); renderAll(); toast('已删除复盘');
    } : null
  });

function downloadFile(name, content, mime){
  try{
    const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }catch(e){
    toast('下载失败：' + e.message, true);
  }
}

function buildMarkdown(scope){
  const mods = scope === 'all' ? sortedModules() : sortedModules().filter(m=>m.id === scope);
  const c = scopeCounts(scope);
  const doneUnits = unitsInScope(scope).filter(u=>u.status === '已学完').length;
  let out = '# 筑基 · 创业学习归档\n\n';
  out += '- 归档日期：' + todayStr() + '\n';
  out += '- 范围：' + scopeLabel(scope) + '\n';
  out += '- 数据来源：本机浏览器 localStorage，未上传\n';
  out += '- 概览：单元 ' + c.units + '（已学完 ' + doneUnits + '）· 实操 ' + c.practices + ' · 结果 ' + c.results + ' · 复盘 ' + c.reviews + '\n\n';
  out += '---\n\n';

  mods.forEach(m=>{
    const us = moduleUnits(m.id);
    const ps = Store.data.practices.filter(p=>p.module_id === m.id);
    const rs = resultsInScope(m.id);
    const vs = reviewsInScope(m.id);
    const dn = us.filter(u=>u.status === '已学完').length;
    out += '## ' + m.title + '\n\n';
    out += '> ' + (m.summary || '') + '　进度 ' + dn + '/' + us.length + '\n\n';

    out += '### 学习单元\n\n';
    if(!us.length) out += '暂无记录。\n\n';
    us.forEach(u=>{
      out += '- **' + u.title + '**（' + u.status + ' · ' + (Number(u.hours) || 0) + ' 学时）\n';
      out += '  - 目标：' + (u.goal || '—') + '\n';
      String(u.points || '').split('\n').filter(Boolean).forEach(p=>{ out += '  - 要点：' + p + '\n'; });
      if(u.notes) out += '  - 笔记：' + String(u.notes).replace(/\n/g, ' ') + '\n';
    });
    out += '\n### 实操\n\n';
    if(!ps.length) out += '暂无记录。\n\n';
    ps.forEach(p=>{
      out += '- **' + p.title + '**（' + p.status + '，截止 ' + (p.due_date || '—') + '）\n';
      out += '  - 动作：' + (p.action || '—') + '\n';
      out += '  - 交付物：' + (p.deliverable || '—') + '\n';
      if(p.notes) out += '  - 备注：' + String(p.notes).replace(/\n/g, ' ') + '\n';
    });
    out += '\n### 结果\n\n';
    if(!rs.length) out += '暂无记录。\n\n';
    rs.forEach(r=>{
      out += '- **' + r.title + '**（' + r.verdict + '，' + (r.date || '—') + '）\n';
      out += '  - 指标：' + (r.metric || '—') + '；目标：' + (r.target || '—') + '；实际：' + (r.actual || '—') + '\n';
      if(r.evidence) out += '  - 证据：' + r.evidence + '\n';
      if(r.notes) out += '  - 备注：' + String(r.notes).replace(/\n/g, ' ') + '\n';
    });
    out += '\n### 复盘\n\n';
    if(!vs.length) out += '暂无记录。\n\n';
    vs.forEach(v=>{
      out += '- **' + (v.ref_title || '未关联对象') + '**（' + v.scope + '，' + (v.date || '—') + '，评分 ' + (v.score || '—') + '/5）\n';
      out += '  - 保留：' + (v.kept || '—') + '\n';
      out += '  - 改进：' + (v.improve || '—') + '\n';
      out += '  - 下一步：' + (v.next || '—') + '\n';
      if(v.notes) out += '  - 备注：' + String(v.notes).replace(/\n/g, ' ') + '\n';
    });
    out += '\n';
  });

  if(scope === 'all'){
    const stages = Store.data.reviews.filter(v=>v.scope === '阶段');
    if(stages.length){
      out += '## 阶段复盘\n\n';
      stages.forEach(v=>{
        out += '- **' + (v.ref_title || '阶段') + '**（' + (v.date || '—') + '，评分 ' + (v.score || '—') + '/5）\n';
        out += '  - 保留：' + (v.kept || '—') + '\n';
        out += '  - 改进：' + (v.improve || '—') + '\n';
        out += '  - 下一步：' + (v.next || '—') + '\n';
      });
      out += '\n';
    }
  }

  out += '---\n\n本文件由「筑基 · 创业学习工作台」在本机生成，未上传任何服务。\n';
  return out;
}
