name: 抽取选题与素材

on:
  schedule:
    # GitHub 用 UTC，这里 14:00 UTC = 北京时间 22:00
    - cron: '0 14 * * *'
  push:
    # 改了抓取脚本或本文件就立刻跑一次，方便验证
    paths:
      - 'scripts/fetch-topics.mjs'
      - '.github/workflows/topics.yml'
  workflow_dispatch:
    inputs:
      max_topics:
        description: '本次抓取的选题条数'
        required: false
        default: '5'
      max_assets:
        description: '本次抓取的素材条数'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: topics-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 B 站热门并写入选题库
        env:
          MAX_TOPICS: ${{ github.event.inputs.max_topics || '5' }}
          MAX_ASSETS: ${{ github.event.inputs.max_assets || '3' }}
        run: node scripts/fetch-topics.mjs

      - name: 提交改动
        run: |
          git config user.name "topics-bot"
          git config user.email "topics-bot@users.noreply.github.com"
          git add data/workbench.json scripts/fetch-topics.mjs
          if git diff --cached --quiet; then
            echo "无改动，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动抓取 B 站热门选题 $(date -u -d '+8 hours' +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep 5
          done
          echo "推送失败" >&2
          exit 1
